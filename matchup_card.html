<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matchup Card Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!--
  ═══════════════════════════════════════════════════════════════════════════
  MATCHUP CARD COMPONENT
  ─ Drop the <style> block into your <head>
  ─ Drop the <div id="matchupCardWrap"> into your page body
  ─ Drop the <script> block before </body>
  ─ Call  loadMatchupCard(gamePk)  from anywhere in your existing JS
  ═══════════════════════════════════════════════════════════════════════════
  -->

  <style>
    /* ── Matchup Card Variables ─────────────────────────────────────────── */
    .mc-card-wrap {
      --mc-bg:         #0f1117;
      --mc-surface:    #171b26;
      --mc-border:     #232840;
      --mc-accent:     #00e676;
      --mc-accent2:    #29b6f6;
      --mc-warn:       #ff6b35;
      --mc-text:       #e2e8f0;
      --mc-muted:      #64748b;
      --mc-pill-bg:    #1e2435;
      --mc-hot:        #ff6b35;
      --mc-good:       #00e676;
      --mc-bad:        #f44336;
      font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', monospace;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Card Shell ──────────────────────────────────────────────────────── */
    .mc-card {
      background: var(--mc-bg);
      border: 1px solid var(--mc-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      animation: mc-fadein .35s ease;
    }
    @keyframes mc-fadein {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .mc-header {
      background: linear-gradient(135deg, #0d1520 0%, #131b2e 100%);
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--mc-border);
    }
    .mc-teams {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--mc-text);
      text-transform: uppercase;
    }
    .mc-at {
      color: var(--mc-muted);
      font-size: .85rem;
      font-weight: 400;
    }
    .mc-time {
      margin-left: auto;
      font-size: .75rem;
      color: var(--mc-muted);
      letter-spacing: .06em;
    }

    /* ── Pitcher Row ─────────────────────────────────────────────────────── */
    .mc-pitchers {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: .72rem;
      color: var(--mc-muted);
    }
    .mc-pitcher-name {
      color: var(--mc-text);
      font-weight: 600;
      font-size: .78rem;
    }
    .mc-vs { color: var(--mc-muted); }

    /* ── Pitcher Split Pills ─────────────────────────────────────────────── */
    .mc-split-row {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .mc-split-pill {
      background: var(--mc-pill-bg);
      border: 1px solid var(--mc-border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: .68rem;
      color: var(--mc-muted);
      white-space: nowrap;
    }
    .mc-split-pill strong {
      color: var(--mc-text);
      font-weight: 700;
    }
    .mc-split-pill .mc-flagged {
      color: var(--mc-warn);
    }

    /* ── Edge Banner ─────────────────────────────────────────────────────── */
    .mc-edge-banner {
      display: flex;
      gap: 8px;
      padding: 8px 20px;
      background: #0a1a0f;
      border-bottom: 1px solid #1a3520;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--mc-accent);
      text-transform: uppercase;
    }

    /* ── Bats Section ────────────────────────────────────────────────────── */
    .mc-section-label {
      padding: 10px 20px 4px;
      font-size: .63rem;
      letter-spacing: .14em;
      color: var(--mc-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .mc-batter-card {
      margin: 0 12px 8px;
      background: var(--mc-surface);
      border: 1px solid var(--mc-border);
      border-radius: 8px;
      padding: 12px 14px;
      position: relative;
      transition: border-color .2s;
    }
    .mc-batter-card:hover {
      border-color: #3a4060;
    }
    .mc-batter-card.mc-hot-batter {
      border-left: 3px solid var(--mc-hot);
    }

    .mc-batter-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .mc-team-badge {
      background: #1e2a40;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--mc-accent2);
    }
    .mc-batter-name {
      font-size: .88rem;
      font-weight: 700;
      color: var(--mc-text);
      flex: 1;
    }
    .mc-batter-hand {
      font-size: .65rem;
      color: var(--mc-muted);
    }
    .mc-hot-icon {
      font-size: .85rem;
    }

    .mc-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .mc-stat-box {
      background: var(--mc-bg);
      border: 1px solid var(--mc-border);
      border-radius: 6px;
      padding: 6px 8px;
      text-align: center;
    }
    .mc-stat-label {
      font-size: .55rem;
      letter-spacing: .1em;
      color: var(--mc-muted);
      text-transform: uppercase;
      display: block;
      margin-bottom: 3px;
    }
    .mc-stat-val {
      font-size: .88rem;
      font-weight: 700;
      color: var(--mc-text);
    }
    .mc-stat-val.mc-val-hot  { color: var(--mc-hot); }
    .mc-stat-val.mc-val-good { color: var(--mc-good); }

    /* ── Team Divider ────────────────────────────────────────────────────── */
    .mc-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 20px 10px;
      font-size: .62rem;
      letter-spacing: .1em;
      color: var(--mc-muted);
    }
    .mc-divider::before, .mc-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--mc-border);
    }

    /* ── Park Footer ─────────────────────────────────────────────────────── */
    .mc-park {
      background: #131820;
      border-top: 1px solid var(--mc-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mc-park-name {
      font-size: .75rem;
      font-weight: 700;
      color: var(--mc-text);
      flex: 1;
    }
    .mc-park-factors {
      display: flex;
      gap: 10px;
    }
    .mc-factor {
      font-size: .65rem;
      text-align: center;
    }
    .mc-factor-label {
      display: block;
      color: var(--mc-muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .55rem;
      margin-bottom: 2px;
    }
    .mc-factor-val {
      font-weight: 700;
      font-size: .78rem;
    }
    .mc-factor-val.pos { color: var(--mc-warn); }
    .mc-factor-val.neg { color: var(--mc-accent2); }
    .mc-factor-val.neu { color: var(--mc-muted); }

    /* ── The Edge ────────────────────────────────────────────────────────── */
    .mc-edge-body {
      padding: 14px 20px 18px;
      font-size: .78rem;
      line-height: 1.65;
      color: #94a3b8;
      background: #0c1018;
      border-top: 1px solid var(--mc-border);
    }
    .mc-edge-body strong {
      color: var(--mc-text);
      font-weight: 700;
    }

    /* ── Skeleton Loading ────────────────────────────────────────────────── */
    .mc-skeleton {
      background: linear-gradient(90deg, #1a1f2e 25%, #232840 50%, #1a1f2e 75%);
      background-size: 200% 100%;
      animation: mc-shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes mc-shimmer {
      0%   { background-position:  200% 0; }
      100% { background-position: -200% 0; }
    }
    .mc-edge-skeleton   { height: 64px; margin: 14px 20px 18px; }
    .mc-batter-skeleton { height: 88px; margin: 0 12px 8px; }

    /* ── Error State ─────────────────────────────────────────────────────── */
    .mc-error {
      padding: 24px 20px;
      color: var(--mc-warn);
      font-size: .8rem;
      text-align: center;
    }
  </style>
<link rel="stylesheet" href="/static/mobile.css">
</head>
<body>

  <!-- ── Matchup Card Mount Point ─────────────────────────────────────────
       Place this <div> wherever the card should appear in your page.
       loadMatchupCard(gamePk) populates it.
  ────────────────────────────────────────────────────────────────────────── -->
  <div class="mc-card-wrap" id="matchupCardWrap">
    <!-- Populated by loadMatchupCard(gamePk) -->
  </div>


  <!-- ── Matchup Card Script ───────────────────────────────────────────────
       Place this block before </body> (or copy into your existing JS file).
  ────────────────────────────────────────────────────────────────────────── -->
  <script>
  /* ══════════════════════════════════════════════════════════════════════
     MATCHUP CARD  —  loadMatchupCard(gamePk)
     Call this whenever the active game changes (e.g. from your game selector).
  ══════════════════════════════════════════════════════════════════════════ */
  (function () {
    'use strict';

    // ── Helpers ──────────────────────────────────────────────────────────

    function _fmt(val, decimals = 3) {
      if (val == null || isNaN(val)) return '\u2014';
      return Number(val).toFixed(decimals);
    }

    function _pct(val) {
      if (val == null || isNaN(val)) return '\u2014';
      return Number(val).toFixed(1) + '%';
    }

    function _factorClass(v) {
      if (v > 0) return 'pos';
      if (v < 0) return 'neg';
      return 'neu';
    }

    function _factorLabel(v) {
      return (v >= 0 ? '+' : '') + v + '%';
    }

    function _isLoose(brlPct, hr9) {
      return brlPct > 5 || hr9 > 1.0;
    }

    function _splitPillHTML(label, splits) {
      const vR = splits?.vR || {};
      const vL = splits?.vL || {};
      const vRloose = _isLoose(vR.brl_pct, vR.hr9);
      const vLloose = _isLoose(vL.brl_pct, vL.hr9);
      return `
        <span class="mc-split-pill">
          <strong>${label}</strong>
          &nbsp;vR
          <span class="${vRloose ? 'mc-flagged' : ''}">${_pct(vR.brl_pct)} BRL \u00b7 ${_fmt(vR.hr9, 2)} HR/9</span>
          &nbsp;|&nbsp;vL
          <span class="${vLloose ? 'mc-flagged' : ''}">${_pct(vL.brl_pct)} BRL \u00b7 ${_fmt(vL.hr9, 2)} HR/9</span>
        </span>`;
    }

    function _batterCardHTML(batter, teamAbr) {
      const s = batter.splits || {};
      const isHot = batter.hot;
      const isoClass = s.iso     > 0.200 ? 'mc-val-hot'  : s.iso     > 0.150 ? 'mc-val-good' : '';
      const baClass  = s.ba      > 0.290 ? 'mc-val-good' : '';
      const brlClass = s.brl_pct > 15    ? 'mc-val-hot'  : s.brl_pct > 8     ? 'mc-val-good' : '';
      const fbClass  = s.fb_pct  > 40    ? 'mc-val-good' : '';
      return `
        <div class="mc-batter-card${isHot ? ' mc-hot-batter' : ''}">
          <div class="mc-batter-top">
            <span class="mc-team-badge">${teamAbr}</span>
            <span class="mc-batter-name">${batter.name}</span>
            ${isHot ? '<span class="mc-hot-icon">\uD83D\uDD25</span>' : ''}
            <span class="mc-batter-hand">${batter.bat_side}HB</span>
          </div>
          <div class="mc-stats-grid">
            <div class="mc-stat-box">
              <span class="mc-stat-label">BA</span>
              <span class="mc-stat-val ${baClass}">${_fmt(s.ba)}</span>
            </div>
            <div class="mc-stat-box">
              <span class="mc-stat-label">BRL%</span>
              <span class="mc-stat-val ${brlClass}">${_pct(s.brl_pct)}</span>
            </div>
            <div class="mc-stat-box">
              <span class="mc-stat-label">FB%</span>
              <span class="mc-stat-val ${fbClass}">${_pct(s.fb_pct)}</span>
            </div>
            <div class="mc-stat-box">
              <span class="mc-stat-label">ISO</span>
              <span class="mc-stat-val ${isoClass}">${_fmt(s.iso)}</span>
            </div>
          </div>
        </div>`;
    }

    function _skeletonHTML() {
      return `
        <div class="mc-card">
          <div class="mc-header" style="padding:18px 20px 14px">
            <div class="mc-skeleton" style="height:22px;width:60%;margin-bottom:10px"></div>
            <div class="mc-skeleton" style="height:14px;width:40%"></div>
          </div>
          <div class="mc-batter-skeleton mc-skeleton"></div>
          <div class="mc-batter-skeleton mc-skeleton"></div>
          <div class="mc-edge-skeleton mc-skeleton"></div>
        </div>`;
    }

    function _errorHTML(msg) {
      return `<div class="mc-card"><div class="mc-error">\u26A0 ${msg}</div></div>`;
    }

    // ── Render ───────────────────────────────────────────────────────────

    function _renderCard(d) {
      const hp       = d.home_pitcher || {};
      const ap       = d.away_pitcher || {};
      const park     = d.park || {};
      const homeBats = d.bats_to_target?.home || [];
      const awayBats = d.bats_to_target?.away || [];

      let timeStr = '';
      try {
        const dt = new Date(d.game_time);
        timeStr = dt.toLocaleTimeString('en-US', {
          hour: 'numeric', minute: '2-digit',
          timeZone: 'America/New_York', timeZoneName: 'short'
        });
      } catch (_) { timeStr = d.game_time || ''; }

      const awayRows = awayBats.map(b => _batterCardHTML(b, d.away_team_abr)).join('');
      const homeRows = homeBats.map(b => _batterCardHTML(b, d.home_team_abr)).join('');

      let edgeHTML = (d.edge || 'Analysis loading\u2026')
        .replace(/(\b(TB|H\+R\+RBI|HR|hits|total bases)[^.]*\.?)$/i,
                 m => `<strong>${m}</strong>`);

      const hrFactor   = park.hr_factor   ?? 0;
      const hitsFactor = park.hits_factor ?? 0;

      return `
        <div class="mc-card">

          <div class="mc-header">
            <div class="mc-teams">
              ${d.away_team}
              <span class="mc-at">@</span>
              ${d.home_team}
              <span class="mc-time">${timeStr}</span>
            </div>
            <div class="mc-pitchers">
              <span class="mc-pitcher-name">${ap.name || 'TBD'}</span>
              <span class="mc-vs">vs</span>
              <span class="mc-pitcher-name">${hp.name || 'TBD'}</span>
            </div>
            <div class="mc-split-row">
              ${_splitPillHTML((ap.name?.split(' ').pop() || 'Away') + ` (${ap.hand})`, ap.splits || {})}
              ${_splitPillHTML((hp.name?.split(' ').pop() || 'Home') + ` (${hp.hand})`, hp.splits || {})}
            </div>
          </div>

          <div class="mc-section-label">Bats to Target</div>

          ${awayRows || '<div style="padding:8px 20px;color:#64748b;font-size:.75rem">No qualified away batters</div>'}

          ${(awayRows && homeRows) ? `<div class="mc-divider">${d.home_team_abr}</div>` : ''}

          ${homeRows || ''}

          <div class="mc-park">
            <span class="mc-park-name">${park.name || '\u2014'}</span>
            <div class="mc-park-factors">
              <div class="mc-factor">
                <span class="mc-factor-label">Park HR</span>
                <span class="mc-factor-val ${_factorClass(hrFactor)}">${_factorLabel(hrFactor)}</span>
              </div>
              <div class="mc-factor">
                <span class="mc-factor-label">Hits</span>
                <span class="mc-factor-val ${_factorClass(hitsFactor)}">${_factorLabel(hitsFactor)}</span>
              </div>
            </div>
          </div>

          <div class="mc-edge-banner">\u26A1 The Edge</div>
          <div class="mc-edge-body">${edgeHTML}</div>

        </div>`;
    }

    // ── Public API ───────────────────────────────────────────────────────

    /**
     * loadMatchupCard(gamePk)
     * Fetches /api/matchup-card/<gamePk> and renders the card into #matchupCardWrap.
     * Call this from your existing game-select handlers.
     */
    window.loadMatchupCard = async function (gamePk) {
      const wrap = document.getElementById('matchupCardWrap');
      if (!wrap) return;

      wrap.innerHTML = _skeletonHTML();

      try {
        const res  = await fetch(`/api/matchup-card/${gamePk}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.status === 'error') throw new Error(data.message);
        wrap.innerHTML = _renderCard(data);
      } catch (err) {
        console.error('[matchupCard]', err);
        wrap.innerHTML = _errorHTML(err.message || 'Failed to load matchup card.');
      }
    };

    // ── Auto-load if gamePk is already set ──────────────────────────────
    // Hooks into your existing selectedGamePk variable if present
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof selectedGamePk !== 'undefined' && selectedGamePk) {
        window.loadMatchupCard(selectedGamePk);
      }
    });

    // If you use a custom event when the game changes, listen here:
    // document.addEventListener('gameSelected', e => loadMatchupCard(e.detail.gamePk));

  }());
  </script>
<script src="/static/mobile-nav.js" defer></script>

</body>
</html>
