<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — MLB Analytics Hub</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;background:#0a0e1a;color:#c8d0e0;min-height:100vh;font-size:13px}
input,select,textarea{background:#0d1220;border:1px solid #2a3550;color:#c8d0e0;border-radius:4px;padding:8px 10px;font-family:inherit;font-size:13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:#00d4ff;box-shadow:0 0 0 2px rgba(0,212,255,.1)}
label{display:block;font-size:11px;color:#7a8aa0;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:8px 16px;transition:all .2s}
.btn-save{background:transparent;border:1px solid #3a4560;color:#8090b0;padding:8px 20px}
.btn-save:hover{border-color:#00d4ff;color:#00d4ff}

/* ── Section cards ── */
.section-card{background:#111827;border:1px solid #1e2a3a;border-radius:6px;padding:20px;margin-bottom:24px}
.section-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#00d4ff;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'○';font-size:9px}
.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:14px}
.field-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

/* ── Three-column top layout ── */
.top-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:24px}
@media(max-width:900px){.top-grid{grid-template-columns:1fr}}

/* ── Training specific ── */
.chip-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:4px;border:1px solid #2a3550;background:#0d1220;font-size:11px;cursor:pointer;user-select:none;transition:all .15s}
.chip input{width:12px;height:12px;accent-color:#00d4ff}
.chip.checked{border-color:#00d4ff;background:rgba(0,212,255,.08);color:#00d4ff}
.szn{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;border:1px solid #2a3550;background:#0d1220;font-size:11px;cursor:pointer;transition:all .15s}
.szn.on{border-color:#00d4ff;background:rgba(0,212,255,.1);color:#00d4ff;font-weight:700}
.train-btn{background:rgba(0,212,255,.1);border:1px solid #00d4ff;color:#00d4ff;padding:9px 20px;font-size:11px;font-weight:700;letter-spacing:.8px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
.train-btn:hover:not(:disabled){background:rgba(0,212,255,.2)}
.train-btn:disabled{opacity:.4;cursor:not-allowed}
.progress-bar{height:5px;border-radius:3px;background:#1e2a3a;overflow:hidden;margin:10px 0}
.progress-fill{height:100%;border-radius:3px;background:#00d4ff;transition:width .4s}
.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.mc{padding:10px 12px;border-radius:4px;border:1px solid #2a3550;background:#0d1220}
.mc.training{border-color:#00d4ff;background:rgba(0,212,255,.05)}
.mc.done{border-color:#00ff88;background:rgba(0,255,136,.05)}
.mc.failed{border-color:#ff4444;background:rgba(255,68,68,.05)}
.mc-name{font-size:11px;font-weight:700;letter-spacing:.4px;margin-bottom:4px}
.mc-stat{font-size:10px;color:#7a8aa0}
.log-box{background:#060a14;border:1px solid #1e2a3a;border-radius:4px;padding:10px 12px;height:180px;overflow-y:auto;font-size:10px;line-height:1.8;color:#7a8aa0;margin-top:10px;font-family:'Courier New',monospace}
.log-ok{color:#00ff88}.log-err{color:#ff4444}.log-head{color:#00d4ff;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.badge.idle{background:#1e2a3a;color:#7a8aa0}
.badge.running{background:rgba(0,212,255,.12);color:#00d4ff}
.badge.done{background:rgba(0,255,136,.12);color:#00ff88}
.badge.error{background:rgba(255,68,68,.12);color:#ff4444}
.select-wrap{position:relative}
.select-wrap select{appearance:none;padding-right:28px}
.select-wrap::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#5a6a80;pointer-events:none;font-size:11px}
.toggle-row{display:flex;align-items:center;gap:8px}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;border-radius:20px;background:#1e2a3a;cursor:pointer;transition:.2s}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;border-radius:50%;background:#5a6a80;transition:.2s}
.toggle input:checked+.toggle-slider{background:rgba(0,212,255,.2);border:1px solid #00d4ff}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px);background:#00d4ff}
.status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.divider{height:1px;background:#1e2a3a;margin:14px 0}
</style>
</head>
<body>

<div id="app-root" style="min-height:100vh"></div>

<script>
// ── Fetch settings then render ──────────────────────────────────────────────
async function init() {
  let appSettings = {}, adminSettings = {}, trackerSettings = {}, cacheStatus = {}, perfSettings = {}, memoryStatus = {};
  try { const r = await fetch('/api/app-settings'); const d = await r.json(); if(d.success) appSettings = d.settings; } catch(e){}
  try { const r = await fetch('/api/admin/settings'); const d = await r.json(); if(d.success) adminSettings = d.settings; } catch(e){}
  try { const r = await fetch('/api/tracker/settings'); const d = await r.json(); if(d.success) trackerSettings = d.settings||d; } catch(e){}
  try { const r = await fetch('/api/cache/status'); const d = await r.json(); if(d.success||d.status) cacheStatus = d; } catch(e){}
  try { const r = await fetch('/api/memory/status'); const d = await r.json(); memoryStatus = d; } catch(e){}

  const ai = appSettings.intelligence || {};
  const dc = appSettings.dataCollection || {};
  const api = appSettings.apiConfig || {};
  const perf = appSettings.performance || {};
  const tr = trackerSettings;
  const adm = adminSettings;

  document.getElementById('app-root').innerHTML = `
  <div style="padding:24px;max-width:1400px;margin:0 auto">

    <!-- Title -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#7a8aa0">○ ADMIN SETTINGS</div>
    </div>

    <!-- Row 1: Intelligence / Data Collection / API Cache -->
    <div class="top-grid">

      <!-- Intelligence & AI -->
      <div class="section-card">
        <div class="section-title">Intelligence &amp; AI</div>
        <div style="margin-bottom:10px">
          <label>Enable AI</label>
          <div class="select-wrap">
            <select id="ai-enabled">
              <option value="true" ${ai.enableAI!==false?'selected':''}>Enabled</option>
              <option value="false" ${ai.enableAI===false?'selected':''}>Disabled</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:10px"><label>AI Model</label><input id="ai-model" value="${ai.aiModel||'claude-sonnet-4-20250514'}"></div>
        <div style="margin-bottom:10px">
          <label>Insight Style</label>
          <div class="select-wrap">
            <select id="insight-style">
              <option value="detailed" ${(ai.insightStyle||'detailed')==='detailed'?'selected':''}>Detailed</option>
              <option value="concise" ${ai.insightStyle==='concise'?'selected':''}>Concise</option>
              <option value="brief" ${ai.insightStyle==='brief'?'selected':''}>Brief</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:10px"><label>Park Factor Weight</label><input id="park-weight" type="number" step="0.01" value="${ai.parkFactorWeight??0.3}"></div>
        <div style="margin-bottom:10px"><label>Weather Weight</label><input id="weather-weight" type="number" step="0.01" value="${ai.weatherWeight??0.2}"></div>
        <div style="margin-bottom:14px"><label>Opponent Impact Weight</label><input id="opp-weight" type="number" step="0.01" value="${ai.opponentWeight??0.25}"></div>
        <button class="btn-save" onclick="saveAI()">SAVE AI SETTINGS</button>
      </div>

      <!-- Data Collection -->
      <div class="section-card">
        <div class="section-title">Data Collection</div>
        <div class="field-grid-2" style="margin-bottom:10px">
          <div>
            <label>Enable FanGraphs</label>
            <div class="select-wrap"><select id="fg-enabled"><option value="true" ${dc.enableFanGraphs!==false?'selected':''}>✓ Enabled</option><option value="false" ${dc.enableFanGraphs===false?'selected':''}>Disabled</option></select></div>
          </div>
          <div>
            <label>Enable Savant</label>
            <div class="select-wrap"><select id="sv-enabled"><option value="true" ${dc.enableSavant!==false?'selected':''}>✓ Enabled</option><option value="false" ${dc.enableSavant===false?'selected':''}>Disabled</option></select></div>
          </div>
          <div>
            <label>Enable Odds API</label>
            <div class="select-wrap"><select id="odds-enabled"><option value="true" ${dc.enableOdds!==false?'selected':''}>✓ Enabled</option><option value="false" ${dc.enableOdds===false?'selected':''}>Disabled</option></select></div>
          </div>
          <div>
            <label>Enable Weather API</label>
            <div class="select-wrap"><select id="wx-enabled"><option value="true" ${dc.enableWeather!==false?'selected':''}>✓ Enabled</option><option value="false" ${dc.enableWeather===false?'selected':''}>Disabled</option></select></div>
          </div>
        </div>
        <div class="field-grid-2">
          <div><label>FanGraphs Refresh (hrs)</label><input id="fg-refresh" type="number" value="${dc.fgRefreshHours??6}"></div>
          <div><label>Savant Refresh (hrs)</label><input id="sv-refresh" type="number" value="${dc.savantRefreshHours??4}"></div>
          <div><label>Odds Refresh (min)</label><input id="odds-refresh" type="number" value="${dc.oddsRefreshMinutes??30}"></div>
          <div><label>Weather Refresh (min)</label><input id="wx-refresh" type="number" value="${dc.weatherRefreshMinutes??60}"></div>
        </div>
        <button class="btn-save" onclick="saveDC()">SAVE DATA COLLECTION</button>
      </div>

      <!-- API & Cache Config -->
      <div class="section-card">
        <div class="section-title">API &amp; Cache Configuration</div>
        <div class="field-grid-2">
          <div><label>Odds Events TTL (sec)</label><input id="odds-events-ttl" type="number" value="${api.oddsEventsTTLSec??21600}"></div>
          <div><label>Odds Game TTL (sec)</label><input id="odds-game-ttl" type="number" value="${api.oddsGameTTLSec??86400}"></div>
          <div><label>Odds NRFI TTL (sec)</label><input id="odds-nrfi-ttl" type="number" value="${api.oddsNRFITTLSec??300}"></div>
          <div><label>Memory Snapshots to Keep</label><input id="mem-snaps" type="number" value="${api.memoryKeepSnapshots??30}"></div>
          <div><label>Memory Max Size (MB)</label><input id="mem-max" type="number" value="${api.memoryMaxBytesMB??11}"></div>
          <div><label>Weather Cache TTL (min)</label><input id="wx-ttl" type="number" value="${api.weatherCacheTTLMin??20}"></div>
          <div><label>Props Scan Cache TTL (min)</label><input id="props-ttl" type="number" value="${api.propScanCacheTTLMin??20}"></div>
          <div><label>Consistency Cache TTL (min)</label><input id="cons-ttl" type="number" value="${api.consistencyCacheTTLMin??20}"></div>
        </div>
        <button class="btn-save" onclick="saveAPI()">SAVE API CONFIG</button>
      </div>
    </div>

    <!-- Row 2: Cache Status / Performance / Upload -->
    <div class="top-grid">

      <!-- Cache Status & Warm-Up -->
      <div class="section-card">
        <div class="section-title">Cache Status &amp; Warm-Up</div>
        <p style="font-size:11px;color:#7a8aa0;line-height:1.6;margin-bottom:14px">Readiness of background loaders the Monte Carlo sim depends on. After a redeploy, click <span style="color:#00d4ff;font-weight:700">WARM UP NOW</span> and wait until every row is green — cold caches make sims time out.</p>
        <div style="margin-bottom:12px">
          <label>Select Date:</label>
          <input type="date" id="cache-date" style="width:auto">
          <span id="lineup-status" style="font-size:11px;color:#7a8aa0;margin-left:8px">slate the lineup</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-save" onclick="warmupCache()">WARM UP NOW</button>
          <button class="btn-save" onclick="refreshCache()">REFRESH</button>
        </div>
        <div id="cache-rows" style="margin-top:12px;font-size:11px;color:#7a8aa0">Loading…</div>
        <div id="cache-ready" style="font-size:11px;color:#00ff88;margin-top:6px"></div>
        <div style="margin-top:10px;font-size:11px;color:#7a8aa0">pipeline will build</div>
      </div>

      <!-- Performance & System -->
      <div class="section-card">
        <div class="section-title">Performance &amp; System</div>
        <div class="field-grid-2">
          <div><label>Background Worker Interval (min)</label><input id="bg-interval" type="number" value="${perf.backgroundWorkerIntervalMin??300}"></div>
          <div><label>Max Concurrent Requests</label><input id="max-req" type="number" value="${perf.maxConcurrentRequests??10}"></div>
          <div><label>API Timeout (sec)</label><input id="api-timeout" type="number" value="${perf.apiTimeoutSec??30}"></div>
          <div>
            <label>Enable Diagnostics</label>
            <div class="select-wrap"><select id="diag-enabled"><option value="false" ${!perf.enableDiagnostics?'selected':''}>Disabled</option><option value="true" ${perf.enableDiagnostics?'selected':''}>Enabled</option></select></div>
          </div>
        </div>
        <button class="btn-save" onclick="savePerf()">SAVE PERFORMANCE SETTINGS</button>
      </div>

      <!-- Upload Data for Brain -->
      <div class="section-card">
        <div class="section-title">Upload Data for Brain</div>
        <div style="margin-bottom:12px">
          <label>Upload File</label>
          <input type="file" id="upload-file" accept=".csv,.json" style="padding:6px">
        </div>
        <div style="margin-bottom:12px">
          <label>File Type</label>
          <div class="select-wrap">
            <select id="upload-type">
              <option value="player_stats">Player Stats</option>
              <option value="game_logs">Game Logs</option>
              <option value="projections">Projections</option>
              <option value="custom">Custom</option>
            </select>
          </div>
        </div>
        <button class="btn-save" onclick="uploadFile()">UPLOAD</button>
        <div id="upload-msg" style="font-size:11px;color:#7a8aa0;margin-top:8px"></div>
        <div id="upload-list" style="margin-top:12px;font-size:11px"></div>
      </div>
    </div>

    <!-- Row 3: Cache Status Detail / Final Daily Summary / (blank or extra) -->
    <div class="top-grid">

      <!-- Brain Data Ingestion -->
      <div class="section-card">
        <div class="section-title">Brain Data Ingestion</div>
        <div id="brain-stats" style="font-size:11px;line-height:2;color:#c8d0e0">Loading…</div>
        <div class="divider"></div>
        <div id="brain-msg" style="font-size:11px;color:#7a8aa0;margin-bottom:10px"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-save" onclick="ingestNow()">INGEST NOW</button>
          <button class="btn-save" onclick="refreshBrain()">REFRESH</button>
          <button class="btn-save" onclick="fetchMLBPlayers()">FETCH MLB API PLAYERS</button>
        </div>
        <div id="brain-status-msg" style="font-size:11px;color:#7a8aa0;margin-top:8px"></div>
      </div>

      <!-- Final Daily Summary -->
      <div class="section-card">
        <div class="section-title">Final Daily Summary</div>
        <div style="margin-bottom:12px">
          <label>Select Date:</label>
          <input type="date" id="summary-date" style="width:auto">
        </div>
        <div id="summary-content" style="font-size:11px;color:#7a8aa0;margin-bottom:12px">Loading final daily summary…</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-save" onclick="buildLiveSummary()">BUILD LIVE SUMMARY</button>
          <button class="btn-save" onclick="rebuildPush()">REBUILD + PUSH</button>
          <button class="btn-save" onclick="pushSummary()">PUSH SUMMARY</button>
          <button class="btn-save" onclick="loadStored()">LOAD STORED</button>
        </div>
        <div id="summary-msg" style="font-size:11px;color:#7a8aa0;margin-top:8px"></div>
        <div style="font-size:11px;color:#7a8aa0;margin-top:6px">Push state: <span id="push-state">IDLE</span></div>
      </div>

      <!-- Admin Details -->
      <div class="section-card">
        <div class="section-title">Admin Details</div>
        <div style="margin-bottom:10px"><label>Organization</label><input id="adm-org" value="${adm.orgName||'MLB Analytics Hub'}"></div>
        <div style="margin-bottom:10px"><label>Admin Name</label><input id="adm-name" value="${adm.adminName||''}"></div>
        <div style="margin-bottom:10px"><label>Contact Email</label><input id="adm-email" value="${adm.contactEmail||''}"></div>
        <div style="margin-bottom:10px"><label>Timezone</label><input id="adm-tz" value="${adm.timezone||'America/New_York'}"></div>
        <div style="margin-bottom:14px">
          <label>Operational Mode</label>
          <div class="select-wrap">
            <select id="adm-mode">
              <option value="normal" ${(adm.operationalMode||'normal')==='normal'?'selected':''}>NORMAL</option>
              <option value="maintenance" ${adm.operationalMode==='maintenance'?'selected':''}>MAINTENANCE</option>
              <option value="debug" ${adm.operationalMode==='debug'?'selected':''}>DEBUG</option>
            </select>
          </div>
        </div>
        <button class="btn-save" onclick="saveAdmin()">SAVE ADMIN</button>
      </div>
    </div>

    <!-- Row 4: Risk & Tracker / Memory Collection / XGBoost Training -->
    <div class="top-grid">

      <!-- Risk & Tracker Settings -->
      <div class="section-card">
        <div class="section-title">Risk &amp; Tracker Settings</div>
        <div class="field-grid-2">
          <div><label>Bankroll</label><input id="tr-bankroll" type="number" value="${tr.bankroll??100}"></div>
          <div><label>Kelly Fraction</label><input id="tr-kelly" type="number" step="0.01" value="${tr.kellyFraction??0.5}"></div>
          <div><label>Unit Size %</label><input id="tr-unit" type="number" step="0.001" value="${tr.unitSizePct??0.01}"></div>
          <div><label>Max Bet %</label><input id="tr-maxbet" type="number" step="0.001" value="${tr.maxBetPct??0.03}"></div>
          <div><label>Picks / Game</label><input id="tr-picks" type="number" value="${tr.picksPerGame??14}"></div>
          <div><label>Best Edge Threshold</label><input id="tr-edge" type="number" step="0.001" value="${tr.bestEdgeThreshold??0.03}"></div>
        </div>
        <button class="btn-save" onclick="saveTracker()">SAVE TRACKER SETTINGS</button>
        <span id="tracker-msg" style="font-size:11px;color:#00ff88;margin-left:8px"></span>
      </div>

      <!-- Memory Collection Controls -->
      <div class="section-card">
        <div class="section-title">Memory Collection Controls</div>
        <div id="mem-status" style="font-size:11px;line-height:2.2;color:#c8d0e0;margin-bottom:14px">Loading…</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button class="btn-save" onclick="memCollect('light')">RUN LIGHT</button>
          <button class="btn-save" onclick="memCollect('deep')">RUN DEEP</button>
          <button class="btn-save" onclick="memCollect('auto')">RUN AUTO</button>
          <button class="btn-save" onclick="refreshMem()">REFRESH</button>
        </div>
        <div id="mem-msg" style="font-size:11px;color:#7a8aa0;margin-top:8px">Status updated</div>
      </div>

      <!-- ══ XGBoost Model Training ══ -->
      <div class="section-card">
        <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
          <span>XGBoost Model Training</span>
          <span class="badge idle" id="train-badge">IDLE</span>
        </div>

        <div style="margin-bottom:10px">
          <label>Markets to train</label>
          <div class="chip-group" id="market-chips">
            <label class="chip checked"><input type="checkbox" value="hits" checked onchange="syncChip(this)"> Hits</label>
            <label class="chip checked"><input type="checkbox" value="hr" checked onchange="syncChip(this)"> HR</label>
            <label class="chip checked"><input type="checkbox" value="tb" checked onchange="syncChip(this)"> Tot Bases</label>
            <label class="chip checked"><input type="checkbox" value="rbi" checked onchange="syncChip(this)"> RBI</label>
            <label class="chip checked"><input type="checkbox" value="k_3.5" checked onchange="syncChip(this)"> K 3.5</label>
            <label class="chip checked"><input type="checkbox" value="k_4.5" checked onchange="syncChip(this)"> K 4.5</label>
            <label class="chip checked"><input type="checkbox" value="k_5.5" checked onchange="syncChip(this)"> K 5.5</label>
          </div>
        </div>

        <div style="margin-bottom:12px">
          <label>Training seasons</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px" id="szn-select">
            <span class="szn" data-year="2021">2021</span>
            <span class="szn on" data-year="2022">2022</span>
            <span class="szn on" data-year="2023">2023</span>
            <span class="szn on" data-year="2024">2024</span>
            <span class="szn on" data-year="2025">2025</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <button class="train-btn" id="train-btn" onclick="startTraining()">▶ RUN TRAINING</button>
          <span id="train-elapsed" style="font-size:11px;color:#7a8aa0"></span>
        </div>

        <div id="train-progress" style="display:none">
          <div style="display:flex;justify-content:space-between;font-size:10px;color:#7a8aa0;margin-bottom:4px">
            <span id="train-phase">Starting…</span><span id="train-pct">0%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="train-fill" style="width:0%"></div></div>
        </div>

        <div class="market-grid" id="train-market-grid" style="display:none"></div>
        <div class="log-box" id="train-log" style="display:none"></div>
      </div>
    </div>

  </div>
  `;

  // Init season chips
  document.querySelectorAll('.szn').forEach(c => {
    c.addEventListener('click', () => {
      c.classList.toggle('on');
      if (!document.querySelectorAll('.szn.on').length) c.classList.add('on');
    });
  });

  // Load live data
  loadCacheStatus();
  loadBrainStatus();
  loadMemStatus();
  loadUploadedFiles();
  loadSummary();

  // Auto-attach if training already running
  fetch('/api/training/status').then(r=>r.json()).then(d=>{
    if(d.status==='running') attachTrainingPoll();
  }).catch(()=>{});
}

// ── Cache ──────────────────────────────────────────────────────────────────
async function loadCacheStatus() {
  try {
    const r = await fetch('/api/cache/status'); const d = await r.json();
    const el = document.getElementById('cache-rows');
    if (d.ready) { el.innerHTML=''; document.getElementById('cache-ready').textContent='✓ READY'; }
    else { el.innerHTML = Object.entries(d.loaders||{}).map(([k,v])=>`<div style="color:${v?'#00ff88':'#ff4444'}">${v?'✓':'✗'} ${k}</div>`).join('') || 'Status unavailable'; }
  } catch(e) {}
}

// ── Brain ──────────────────────────────────────────────────────────────────
async function loadBrainStatus() {
  try {
    const r = await fetch('/api/brain/status'); const d = await r.json();
    document.getElementById('brain-stats').innerHTML = [
      d.statscast ? `Statscast/Savant: <span style="color:#c8d0e0">${d.statscast}</span>` : '',
      d.fangraphs ? `FanGraphs: <span style="color:#c8d0e0">${d.fangraphs}</span>` : '',
      d.mlb_api ? `MLB API Players: <span style="color:#c8d0e0">${d.mlb_api}</span>` : '',
      d.manual_uploads ? `Manual Uploads: <span style="color:#c8d0e0">${d.manual_uploads}</span>` : '',
      d.total ? `Total Data Points: <span style="color:#00d4ff;font-weight:700">${d.total}</span>` : '',
    ].filter(Boolean).join('<br>') || JSON.stringify(d);

    if(d.status) document.getElementById('brain-status-msg').textContent = 'Status: '+d.status;

// ── Upload ─────────────────────────────────────────────────────────────────
async function uploadFile() {
  const file = document.getElementById('upload-file').files[0];
  if(!file){document.getElementById('upload-msg').textContent='Select a file first.';return;}
  const fd = new FormData();
  fd.append('file', file);
  fd.append('file_type', document.getElementById('upload-type').value);
  try {
    const r = await fetch('/api/brain/upload',{method:'POST',body:fd});
    const d = await r.json();
    document.getElementById('upload-msg').textContent = d.success ? '✓ Uploaded' : (d.error||'Error');
    loadUploadedFiles();
  } catch(e){ document.getElementById('upload-msg').textContent='Error: '+e; }
}
async function loadUploadedFiles() {
  try {
    const r = await fetch('/api/brain/files'); const d = await r.json();
    const files = d.files||[];
    document.getElementById('upload-list').innerHTML = files.map(f=>`
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;padding:8px;background:#0d1220;border-radius:4px;border:1px solid #1e2a3a">
        <div>
          <div style="font-weight:700;margin-bottom:2px">${f.name||f.filename}</div>
          <div style="color:#7a8aa0;font-size:10px">${f.type||''} · ${f.format||''} · ${f.size||''} · ${f.records||''} records</div>
          ${f.status==='INGESTED'?'<div style="color:#00ff88;font-size:10px">INGESTED</div>':''}
        </div>
        <button class="btn-save" onclick="deleteFile('${f.id||f.name}')" style="font-size:10px;padding:4px 10px">DELETE</button>
      </div>`).join('') || '<div style="color:#7a8aa0">No files uploaded</div>';
  } catch(e){}
}
async function deleteFile(id) {
  try { await fetch('/api/brain/files/'+id,{method:'DELETE'}); loadUploadedFiles(); } catch(e){}
}

// ── XGBoost Training ───────────────────────────────────────────────────────
let _pt = null, _ll = 0;

function startTraining() {
  const markets = [...document.querySelectorAll('#market-chips input:checked')].map(c=>c.value);
  const seasons = [...document.querySelectorAll('.szn.on')].map(c=>+c.dataset.year);
  if(!markets.length){alert('Select at least one market.');return;}

  document.getElementById('train-btn').disabled = true;
  document.getElementById('train-progress').style.display = 'block';
  document.getElementById('train-market-grid').style.display = 'grid';
  document.getElementById('train-log').style.display = 'block';
  document.getElementById('train-log').innerHTML = '';
  _ll = 0;

  document.getElementById('train-market-grid').innerHTML = markets.map(m=>
    `<div class="mc" id="mc-${m.replace('.','_')}"><div class="mc-name">${m}</div><div class="mc-stat">Waiting…</div></div>`
  ).join('');

  fetch('/api/training/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({markets,seasons})})
    .then(r=>r.json()).then(d=>{
      if(!d.success){alert(d.error);document.getElementById('train-btn').disabled=false;return;}
      attachTrainingPoll();
    }).catch(e=>{alert(e);document.getElementById('train-btn').disabled=false;});
}

function attachTrainingPoll() {
  _pt = setInterval(pollTraining, 2000);
  pollTraining();
}

function pollTraining() {
  fetch('/api/training/status').then(r=>r.json()).then(d=>{
    if(!d.success) return;
    const badge = document.getElementById('train-badge');
    badge.className = 'badge '+d.status;
    badge.textContent = d.status.toUpperCase();

    const fill = document.getElementById('train-fill');
    fill.style.width = d.progress_pct+'%';
    fill.style.background = d.status==='done'?'#00ff88':d.status==='error'?'#ff4444':'#00d4ff';
    document.getElementById('train-phase').textContent = d.phase||'…';
    document.getElementById('train-pct').textContent = d.progress_pct+'%';

    if(d.elapsed_s!=null){
      const m=Math.floor(d.elapsed_s/60),s=Math.round(d.elapsed_s%60);
      document.getElementById('train-elapsed').textContent = m>0?`${m}m ${s}s elapsed`:`${s}s elapsed`;
    }

    Object.entries(d.market_results||{}).forEach(([k,res])=>{
      const card = document.getElementById('mc-'+k.replace('.','_'));
      if(!card) return;
      card.className = 'mc '+(res.status||'');
      const stat = card.querySelector('.mc-stat');
      if(res.status==='done') stat.innerHTML=`AUC <b>${res.auc?.toFixed(4)||'—'}</b> Brier <b>${res.brier?.toFixed(4)||'—'}</b>`;
      else if(res.status==='training') stat.innerHTML='<span style="color:#00d4ff">Training…</span>';
      else if(res.status==='failed') stat.innerHTML='<span style="color:#ff4444">Failed</span>';
      else stat.textContent='Waiting…';
    });

    const box = document.getElementById('train-log');
    const lines = d.log_tail||[];
    if(lines.length>_ll){
      lines.slice(_ll).forEach(l=>{
        const div=document.createElement('div');
        div.className = l.startsWith('✓')||l.toLowerCase().includes('complete') ? 'log-ok'
          : l.startsWith('✗')||l.toLowerCase().includes('error') ? 'log-err'
          : l.startsWith('──') ? 'log-head' : '';
        div.textContent=l; box.appendChild(div);
      });
      _ll=lines.length; box.scrollTop=box.scrollHeight;
    }

    if(d.status==='done'||d.status==='error'){
      clearInterval(_pt); document.getElementById('train-btn').disabled=false;
    }
  }).catch(()=>{});
}
