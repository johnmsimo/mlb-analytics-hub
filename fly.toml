# fly.toml app configuration file generated for mlb-analytics-hub on 2026-05-09T07:07:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mlb-analytics-hub'
primary_region = 'ord'

[build]

[env]
  PORT = '8080'
  PYBASEBALL_CACHE = '1'
  XGB_MODEL_DIR = './models'

[[mounts]]
  source = 'mlb_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '30s'
    grace_period = '10m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
