# fly.toml — MLB Analytics App
# Deploy with: fly deploy

app = "your-app-name"   # ← replace with your actual fly.io app name
primary_region = "ewr"

[build]

[env]
  PORT = "8080"
XGB_MODEL_DIR = "./models"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "myapp_data"
  destination = "/data"
