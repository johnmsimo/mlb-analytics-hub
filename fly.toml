# fly.toml — MLB Analytics App
# Deploy with: fly deploy

app = "your-app-name"   # ← replace with your actual fly.io app name
primary_region = "ewr"

[build]

[env]
  PORT = "8080"
  XGB_MODEL_DIR = "./models"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Concurrency limits prevent request pile-up from exhausting the thread
  # pool. With 8 gunicorn threads, a soft limit of 6 lets Fly's load
  # balancer route new requests elsewhere before all threads are consumed.
  # Hard limit of 10 acts as the absolute ceiling before Fly queues/drops.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 6
    hard_limit = 10

  [[http_service.checks]]
    grace_period = "300s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "mlb_data"
  destination = "/app/data"
