# fly.toml app configuration file for mlb-analytics-hub
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'mlb-analytics-hub'
primary_region = 'ewr'

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "120s"
  interval = "30s"
  method = "GET"
  path = "/api/status"
  timeout = "10s"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
