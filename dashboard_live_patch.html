
<!-- ═══════════════════════════════════════════════════════
     LIVE GAMEPLAY PATCH — game card live scoreboard
═══════════════════════════════════════════════════════ -->
<style>
/* ── Live scoreboard section in game card ── */
.ls-wrap {
  margin: 10px 0 8px;
  background: rgba(0,229,255,.04);
  border: 1px solid rgba(0,229,255,.14);
  border-radius: 10px;
  overflow: hidden;
  font-size: .72rem;
}
.ls-inning {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px 4px;
  background: rgba(0,229,255,.07);
  border-bottom: 1px solid rgba(0,229,255,.1);
}
.ls-inn-lbl {
  font-family: Orbitron, monospace;
  font-size: .68rem;
  color: #00e5ff;
  letter-spacing: 1.5px;
  font-weight: 700;
}
.ls-outs {
  display: flex;
  gap: 4px;
  align-items: center;
}
.ls-out-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid rgba(0,229,255,.4);
  background: transparent;
  transition: background .2s;
}
.ls-out-dot.on {
  background: #ff9800;
  border-color: #ff9800;
  box-shadow: 0 0 6px rgba(255,152,0,.5);
}
.ls-count {
  font-family: Orbitron, monospace;
  font-size: .62rem;
  color: #8b949e;
  letter-spacing: 1px;
}
.ls-count span {
  color: #00e5ff;
  font-weight: 700;
}

/* ── R/H/E score table ── */
.ls-score {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0;
  padding: 8px 12px 6px;
}
.ls-teams { flex: 1; }
.ls-right {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-left: 10px;
}
.ls-rhe {
  width: 100%;
}
.ls-rhe-hdr {
  display: grid;
  grid-template-columns: 56px repeat(3, 32px);
  font-family: Orbitron, monospace;
  font-size: .55rem;
  color: #4a5a6a;
  letter-spacing: 1px;
  padding-bottom: 2px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  margin-bottom: 4px;
}
.ls-rhe-row {
  display: grid;
  grid-template-columns: 56px repeat(3, 32px);
  align-items: center;
  padding: 2px 0;
}
.ls-rhe-row.batting .ls-rhe-abbr {
  color: #00e5ff;
}
.ls-rhe-abbr {
  font-family: Orbitron, monospace;
  font-size: .65rem;
  color: #8b9eb0;
  font-weight: 700;
  letter-spacing: .5px;
}
.ls-rhe-val {
  font-family: Orbitron, monospace;
  font-size: .75rem;
  color: #e0eaff;
  font-weight: 700;
  text-align: center;
}
.ls-rhe-val.runs {
  color: #00e5ff;
  font-size: .82rem;
}

/* ── Base diamond ── */
.ls-diamond {
  position: relative;
  width: 46px;
  height: 46px;
  flex-shrink: 0;
}
.ls-diamond svg {
  width: 46px;
  height: 46px;
}

/* ── Pitcher / Batter row ── */
.ls-players {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 5px 10px 8px;
  border-top: 1px solid rgba(255,255,255,.05);
}
.ls-player {
  background: rgba(0,0,0,.25);
  border-radius: 7px;
  padding: 6px 8px;
}
.ls-player-lbl {
  font-family: Orbitron, monospace;
  font-size: .5rem;
  color: #4a5a7a;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.ls-player-name {
  font-size: .68rem;
  color: #c9d8e8;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 120px;
}
.ls-player-stat {
  font-size: .6rem;
  color: #5a7a9a;
  margin-top: 1px;
}

/* ── Due up row ── */
.ls-dueup {
  padding: 4px 10px 7px;
  border-top: 1px solid rgba(255,255,255,.04);
  font-size: .58rem;
  color: #4a6a8a;
  font-family: Orbitron, monospace;
  letter-spacing: .8px;
}
.ls-dueup span {
  color: #7090a8;
  margin-left: 6px;
}

/* ── Loading state ── */
.ls-loading {
  padding: 10px;
  text-align: center;
  font-family: Orbitron, monospace;
  font-size: .58rem;
  color: rgba(0,229,255,.4);
  letter-spacing: 2px;
  animation: ls-pulse 1.4s ease-in-out infinite;
}
@keyframes ls-pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
</style>

<script>
// ─────────────────────────────────────────────────────────
//  LIVE GAME DATA — injects scoreboard into active cards
// ─────────────────────────────────────────────────────────
(function () {

  // Track polling timers
  const _liveTimers = {};

  // ── Diamond SVG builder ──────────────────────────────
  function diamondSVG(bases) {
    const on  = 'rgba(0,229,255,1)';
    const off = 'rgba(0,229,255,.15)';
    const shadow = 'filter:drop-shadow(0 0 4px rgba(0,229,255,.9))';

    // Positions in 46x46 viewBox: second=top, third=left, first=right, home=bottom
    const pts = {
      second: { x: 23, y: 4  },
      third:  { x: 5,  y: 23 },
      first:  { x: 41, y: 23 },
      home:   { x: 23, y: 42 },
    };

    function sq(k, filled) {
      const p = pts[k];
      const c = filled ? on : off;
      const s = filled ? shadow : '';
      return `<rect x="${p.x-5}" y="${p.y-5}" width="10" height="10"
        rx="1.5" transform="rotate(45,${p.x},${p.y})"
        fill="${c}" style="${s}"/>`;
    }

    return `<svg viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg">
      <polyline points="23,4 41,23 23,42 5,23 23,4"
        fill="none" stroke="rgba(0,229,255,.12)" stroke-width="1"/>
      ${sq('second', bases.second)}
      ${sq('third',  bases.third)}
      ${sq('first',  bases.first)}
      ${sq('home',   false)}
    </svg>`;
  }

  // ── Render live scoreboard HTML ──────────────────────
  function renderLiveScore(d, awayAbbr, homeAbbr) {
    if (!d.success) return `<div class="ls-loading">UPDATING…</div>`;

    const outDots = [0,1,2].map(i =>
      `<div class="ls-out-dot ${i < d.outs ? 'on' : ''}"></div>`
    ).join('');

    // Who is batting — infer from inning label
    const batSide  = d.inningLabel.startsWith('BOT') ? 'home' : 'away';
    const awayBat  = batSide === 'away';
    const homeBat  = batSide === 'home';

    const pitchName = (d.pitcher.name || '').split(' ').pop();
    const batName   = (d.batter.name  || '').split(' ').pop();

    const pitchStat = `${d.pitcher.ip || '—'} IP  ·  ${d.pitcher.er !== '—' ? d.pitcher.er+' ER' : '—'}`;
    const batStat   = `${d.batter.h || 0}-${d.batter.ab || 0}  ·  ${d.batter.ops || '—'} OPS`;

    const dueNames = d.dueUp.filter(Boolean).map(n => n.split(' ').pop()).join(', ');

    return `
    <div class="ls-wrap">
      <div class="ls-inning">
        <div class="ls-inn-lbl">${d.inningLabel}</div>
        <div class="ls-outs">${outDots}</div>
        <div class="ls-count">B<span>${d.balls}</span> S<span>${d.strikes}</span></div>
      </div>

      <div class="ls-score">
        <div>
          <div class="ls-rhe">
            <div class="ls-rhe-hdr"><span></span><span>R</span><span>H</span><span>E</span></div>
            <div class="ls-rhe-row ${awayBat ? 'batting' : ''}">
              <div class="ls-rhe-abbr">${awayAbbr}</div>
              <div class="ls-rhe-val runs">${d.awayRuns}</div>
              <div class="ls-rhe-val">${d.awayHits}</div>
              <div class="ls-rhe-val">${d.awayErrors}</div>
            </div>
            <div class="ls-rhe-row ${homeBat ? 'batting' : ''}">
              <div class="ls-rhe-abbr">${homeAbbr}</div>
              <div class="ls-rhe-val runs">${d.homeRuns}</div>
              <div class="ls-rhe-val">${d.homeHits}</div>
              <div class="ls-rhe-val">${d.homeErrors}</div>
            </div>
          </div>
        </div>
        <div class="ls-right">
          <div class="ls-diamond">${diamondSVG(d.bases)}</div>
        </div>
      </div>

      <div class="ls-players">
        <div class="ls-player">
          <div class="ls-player-lbl">PITCHING</div>
          <div class="ls-player-name">${d.pitcher.name || '—'}</div>
          <div class="ls-player-stat">${pitchStat}</div>
        </div>
        <div class="ls-player">
          <div class="ls-player-lbl">AT BAT</div>
          <div class="ls-player-name">${d.batter.name || '—'}</div>
          <div class="ls-player-stat">${batStat}</div>
        </div>
      </div>

      ${dueNames ? `<div class="ls-dueup">DUE UP <span>${dueNames}</span></div>` : ''}
    </div>`;
  }

  // ── Fetch + inject live data for one card ────────────
  function fetchAndInject(gamePk, awayAbbr, homeAbbr) {
    const el = document.getElementById(`ls-${gamePk}`);
    if (!el) return;

    fetch(`/api/game/livedata/${gamePk}`)
      .then(r => r.json())
      .then(d => {
        if (el) el.innerHTML = renderLiveScore(d, awayAbbr, homeAbbr);
      })
      .catch(() => {
        if (el) el.innerHTML = `<div class="ls-loading">LIVE DATA UNAVAILABLE</div>`;
      });
  }

  // ── Start polling for a live game ─────────────────────
  function startPolling(gamePk, awayAbbr, homeAbbr) {
    if (_liveTimers[gamePk]) return; // already polling
    fetchAndInject(gamePk, awayAbbr, homeAbbr);
    _liveTimers[gamePk] = setInterval(() => {
      // Stop if card is gone
      if (!document.getElementById(`ls-${gamePk}`)) {
        clearInterval(_liveTimers[gamePk]);
        delete _liveTimers[gamePk];
        return;
      }
      fetchAndInject(gamePk, awayAbbr, homeAbbr);
    }, 30000);
  }

  // ── Stop all polling (called when view refreshes) ─────
  window.stopAllLivePolling = function () {
    Object.keys(_liveTimers).forEach(k => {
      clearInterval(_liveTimers[k]);
      delete _liveTimers[k];
    });
  };

  // ── Hook into the game load cycle ─────────────────────
  // Override mkCard to inject the live slot and wire polling
  const _origLoad = window.load;
  window.load = function (dateStr) {
    stopAllLivePolling();
    if (_origLoad) _origLoad(dateStr);
  };

  // Called by the games render loop — public entry point
  window.initLiveCards = function (games) {
    stopAllLivePolling();
    (games || []).forEach(g => {
      if (g.status !== 'Live') return;
      const el = document.getElementById(`ls-${g.gamePk}`);
      if (el) {
        el.innerHTML = `<div class="ls-loading">● FETCHING LIVE DATA…</div>`;
        startPolling(g.gamePk, g.awayAbbr, g.homeAbbr);
      }
    });
  };

})();
</script>
