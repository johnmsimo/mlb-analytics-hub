<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLB Analytics Hub - Batter vs Pitcher</title>
  <style>
    :root{--bg:#070d18;--card:#101a2a;--card2:#0b1322;--b:#223149;--t:#dfe9ff;--mu:#8ea4c8;--c:#00e5ff;--g:#00e676;--o:#ff9800;--r:#ff5252;--y:#f5c542}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 10% 0%,#0f1d36,transparent 45%),var(--bg);color:var(--t);font-family:Segoe UI,Arial,sans-serif;min-height:100vh}
    .wrap{max-width:1500px;margin:0 auto;padding:18px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .brand{font-weight:700;letter-spacing:.08em}
    .sub{color:var(--mu);font-size:.85rem;margin-top:2px}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    a.toplink{color:var(--c);text-decoration:none;padding:7px 11px;border:1px solid rgba(0,229,255,.2);border-radius:999px;font-size:.82rem}
    .btn{border:1px solid rgba(0,229,255,.35);background:rgba(0,229,255,.08);color:var(--c);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.82rem}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    /* Game pills */
    .game-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
    .game-strip::-webkit-scrollbar{height:4px}
    .game-strip::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}
    .gpill{flex-shrink:0;border:1px solid var(--b);background:rgba(255,255,255,.03);border-radius:12px;padding:8px 14px;cursor:pointer;transition:.15s;min-width:130px;text-align:center}
    .gpill:hover{border-color:rgba(0,229,255,.3);background:rgba(0,229,255,.05)}
    .gpill.sel{border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.1)}
    .gpill-match{font-weight:700;font-size:.85rem;color:var(--t)}
    .gpill-time{font-size:.7rem;color:var(--mu);margin-top:2px}
    .gpill-sp{font-size:.66rem;color:var(--mu);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Main layout */
    .main{display:grid;grid-template-columns:280px 1fr;gap:14px;min-height:500px}
    @media(max-width:900px){.main{grid-template-columns:1fr}}

    /* Lineup panel */
    .lineup-panel{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--b);border-radius:14px;padding:12px;height:fit-content}
    .lp-header{font-size:.72rem;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .lp-team{font-size:.78rem;font-weight:700;color:var(--c);margin:10px 0 6px 0;padding:4px 0;border-bottom:1px solid var(--b)}
    .lp-pitcher{font-size:.72rem;color:var(--mu);margin-bottom:8px;padding:4px 8px;background:rgba(0,229,255,.05);border-radius:6px;border-left:2px solid rgba(0,229,255,.3)}
    .batter-row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;cursor:pointer;transition:.12s;border:1px solid transparent}
    .batter-row:hover{background:rgba(0,229,255,.05);border-color:rgba(0,229,255,.15)}
    .batter-row.sel{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.35)}
    .b-slot{font-size:.7rem;color:var(--mu);min-width:16px;text-align:center}
    .b-name{font-size:.82rem;font-weight:600;flex:1}
    .b-ops{font-size:.7rem;color:var(--mu)}
    .b-grade{font-size:.65rem;font-weight:700;padding:1px 5px;border-radius:5px;min-width:22px;text-align:center}
    .grade-A\+,.grade-A{background:rgba(0,230,118,.15);color:var(--g);border:1px solid rgba(0,230,118,.3)}
    .grade-B{background:rgba(0,229,255,.12);color:var(--c);border:1px solid rgba(0,229,255,.3)}
    .grade-C{background:rgba(245,197,66,.12);color:var(--y);border:1px solid rgba(245,197,66,.3)}
    .grade-D,.grade-\?{background:rgba(255,82,82,.1);color:var(--r);border:1px solid rgba(255,82,82,.25)}

    /* Detail panel */
    .detail-panel{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--b);border-radius:14px;padding:16px}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;color:var(--mu);text-align:center;gap:8px}
    .empty-icon{font-size:2.5rem;opacity:.4}

    /* BvP Header */
    .bvp-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
    .bvp-names{flex:1}
    .bvp-batter{font-size:1.25rem;font-weight:800;color:var(--t)}
    .bvp-vs{font-size:.8rem;color:var(--mu);margin:2px 0}
    .bvp-pitcher{font-size:1rem;font-weight:600;color:var(--c)}
    .grade-badge{font-size:1.4rem;font-weight:900;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
    .gb-A\+,.gb-A{background:rgba(0,230,118,.12);color:var(--g);border:2px solid rgba(0,230,118,.4)}
    .gb-B{background:rgba(0,229,255,.1);color:var(--c);border:2px solid rgba(0,229,255,.35)}
    .gb-C{background:rgba(245,197,66,.1);color:var(--y);border:2px solid rgba(245,197,66,.3)}
    .gb-D,.gb-\?{background:rgba(255,82,82,.08);color:var(--r);border:2px solid rgba(255,82,82,.25)}

    /* Stats row */
    .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
    @media(max-width:600px){.stat-row{grid-template-columns:repeat(3,1fr)}}
    .stat-box{background:rgba(255,255,255,.03);border:1px solid var(--b);border-radius:10px;padding:10px;text-align:center}
    .stat-val{font-size:1.1rem;font-weight:700;color:var(--c)}
    .stat-lbl{font-size:.65rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin-top:3px}

    /* Projection probs */
    .prob-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    @media(max-width:600px){.prob-row{grid-template-columns:repeat(2,1fr)}}
    .prob-box{background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.15);border-radius:10px;padding:10px;text-align:center;position:relative}
    .prob-val{font-size:1rem;font-weight:700;color:var(--t)}
    .prob-lbl{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-top:3px}
    /* Bet/Lean/Fade verdict pill */
    .verdict-pill{display:inline-block;font-size:.56rem;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:8px;margin-top:6px;text-transform:uppercase}
    .v-bet  {color:var(--g);background:rgba(0,230,118,.14);border:1px solid rgba(0,230,118,.4)}
    .v-lean {color:var(--y);background:rgba(245,197,66,.12);border:1px solid rgba(245,197,66,.4)}
    .v-pass {color:var(--mu);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10)}
    .v-fade {color:var(--r);background:rgba(255,82,82,.10);border:1px solid rgba(255,82,82,.35)}
    .prob-box.bet  {border-color:rgba(0,230,118,.45);background:rgba(0,230,118,.05)}
    .prob-box.lean {border-color:rgba(245,197,66,.45);background:rgba(245,197,66,.05)}
    .prob-box.fade {border-color:rgba(255,82,82,.40);background:rgba(255,82,82,.04)}
    /* Pitcher K projection panel */
    .pk-panel{background:rgba(0,229,255,.03);border:1px solid rgba(0,229,255,.18);border-radius:10px;padding:12px;margin:12px 0}
    .pk-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
    .pk-head .ek{font-size:1.4rem;font-weight:800;color:var(--c)}
    .pk-lines{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
    @media(max-width:600px){.pk-lines{grid-template-columns:repeat(3,1fr)}}
    .pk-line{background:rgba(0,0,0,.18);border-radius:8px;padding:6px;text-align:center;border:1px solid transparent}
    .pk-line.bet  {border-color:rgba(0,230,118,.45);background:rgba(0,230,118,.06)}
    .pk-line.lean {border-color:rgba(245,197,66,.45);background:rgba(245,197,66,.06)}
    .pk-line .lv{font-size:.95rem;font-weight:800;color:var(--t)}
    .pk-line .lp{font-size:.62rem;color:var(--mu);margin-top:2px}
    .pk-line .lb{font-size:.55rem;font-weight:800;letter-spacing:.06em;margin-top:3px}
    /* Drivers + divergence + MC + game context strip */
    .driver-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
    .driver-pill{font-size:.62rem;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--t);display:inline-flex;align-items:center;gap:4px}
    .driver-pill .arrow{font-weight:800}
    .driver-pill.pos .arrow{color:var(--g)}
    .driver-pill.neg .arrow{color:var(--r)}
    .div-bar{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:center;background:rgba(0,0,0,.18);border-radius:8px;padding:8px 10px;margin:8px 0}
    .div-bar .lbl{font-size:.6rem;color:var(--mu);text-transform:uppercase}
    .div-bar .val{font-size:.85rem;font-weight:800;color:var(--t)}
    .div-bar .mid{height:6px;border-radius:3px;background:linear-gradient(to right,var(--c),rgba(255,255,255,.15),var(--y));position:relative}
    .div-bar .mid .marker{position:absolute;top:-3px;width:2px;height:12px;background:var(--t)}
    .mc-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 12px}
    .mc-cell{background:rgba(0,0,0,.20);border-radius:8px;padding:6px 8px;text-align:center;border:1px solid rgba(255,255,255,.06)}
    .mc-cell .v{font-size:.85rem;font-weight:800;color:var(--t)}
    .mc-cell .l{font-size:.55rem;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
    .mc-cell .b{font-size:.55rem;color:var(--c);margin-top:2px}
    .ctx-strip{display:flex;flex-wrap:wrap;gap:6px;font-size:.62rem;color:var(--mu);margin:0 0 12px}
    .ctx-chip{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:2px 8px;color:var(--mu)}
    .ctx-chip strong{color:var(--c);font-weight:700}

    /* Sample note */
    .sample-note{font-size:.75rem;color:var(--mu);background:rgba(255,255,255,.03);border-radius:8px;padding:8px 12px;margin-bottom:14px;border-left:3px solid rgba(0,229,255,.25)}
    .sample-note.stale-note{border-left-color:rgba(255,152,0,.55);color:rgba(255,172,50,.9);background:rgba(255,152,0,.04)}

    /* ── Context Sections (Last 10, Splits, Arsenal) ────────────────────── */
    .context-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media(max-width: 900px) {
      .context-grid { grid-template-columns: 1fr; }
    }
    
    .context-card {
      background: rgba(255,255,255,.02);
      border: 1px solid var(--b);
      border-radius: 10px;
      padding: 12px;
    }
    
    .context-card-header {
      font-size: .68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mu);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--b);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .context-badge {
      background: rgba(0,229,255,.08);
      color: var(--c);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: .65rem;
      font-weight: 600;
    }
    
    .context-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,.03);
    }
    .context-stat-row:last-child {
      border-bottom: none;
    }
    
    .context-stat-label {
      font-size: .75rem;
      color: var(--mu);
    }
    
    .context-stat-value {
      font-size: .85rem;
      font-weight: 700;
      color: var(--t);
    }
    
    .context-stat-value.good { color: var(--g); }
    .context-stat-value.warn { color: var(--y); }
    .context-stat-value.bad { color: var(--r); }
    
    .split-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    
    .split-box {
      background: rgba(0,0,0,.15);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    
    .split-label {
      font-size: .65rem;
      color: var(--mu);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }
    
    .split-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--t);
    }
    
    .split-sub {
      font-size: .68rem;
      color: var(--mu);
      margin-top: 2px;
    }
    
    .arsenal-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    
    .arsenal-pill {
      background: rgba(0,229,255,.06);
      border: 1px solid rgba(0,229,255,.15);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: .65rem;
      color: var(--c);
      white-space: nowrap;
    }
    
    .context-loading {
      text-align: center;
      padding: 16px;
      color: var(--mu);
      font-size: .78rem;
    }

    /* Game log */
    .section-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
    .tbl-wrap{overflow-x:auto;border:1px solid var(--b);border-radius:10px;margin-bottom:14px}
    table{width:100%;border-collapse:collapse;min-width:480px}
    th,td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.78rem;text-align:left;white-space:nowrap}
    th{font-size:.68rem;letter-spacing:.07em;color:var(--mu);background:rgba(0,0,0,.18);text-transform:uppercase}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(0,229,255,.03)}
    .good{color:var(--g)} .warn{color:var(--o)} .bad{color:var(--r)}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,229,255,.2);border-top-color:var(--c);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-row{padding:20px;text-align:center;color:var(--mu)}
    .pill{display:inline-block;border:1px solid rgba(0,229,255,.3);border-radius:999px;padding:2px 8px;font-size:.68rem;color:var(--c)}
    
    /* Performance Badges */
    .badge-row {
      display: flex;
      gap: 3px;
      margin-top: 3px;
      flex-wrap: wrap;
    }
    
    .perf-badge {
      font-size: .58rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    
    .perf-green {
      background: rgba(0,230,118,.15);
      color: var(--g);
      border: 1px solid rgba(0,230,118,.3);
    }
    
    .perf-yellow {
      background: rgba(245,197,66,.12);
      color: var(--y);
      border: 1px solid rgba(245,197,66,.3);
    }
    
    .perf-orange {
      background: rgba(255,152,0,.12);
      color: var(--o);
      border: 1px solid rgba(255,152,0,.3);
    }
    
    .perf-red {
      background: rgba(255,82,82,.1);
      color: var(--r);
      border: 1px solid rgba(255,82,82,.25);
    }
    
    .perf-blue {
      background: rgba(0,229,255,.12);
      color: var(--c);
      border: 1px solid rgba(0,229,255,.3);
    }
    
    .perf-purple {
      background: rgba(156,39,176,.12);
      color: #ce93d8;
      border: 1px solid rgba(156,39,176,.3);
    }

    /* Grade basis label under the badge */
    .grade-basis-lbl {
      font-size: .56rem;
      letter-spacing: .06em;
      text-align: center;
      color: var(--mu);
      margin-top: 4px;
      text-transform: uppercase;
    }
    .grade-badge-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    /* Prop signal section */
    .prop-signal-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    @media(max-width: 700px) {
      .prop-signal-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .prop-signal-box {
      background: rgba(0,0,0,.2);
      border: 1px solid var(--b);
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }
    .prop-signal-type {
      font-size: .62rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--mu);
      margin-bottom: 5px;
    }
    .prop-signal-val {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .prop-signal-sub {
      font-size: .6rem;
      color: var(--mu);
      margin-top: 3px;
    }
    .sig-strong { color: var(--g); }
    .sig-mod    { color: var(--c); }
    .sig-lean   { color: var(--y); }
    .sig-fade   { color: var(--r); }

    /* Injury indicators (Phase 1) */
    .inj-badge{display:inline-block;font-size:.55rem;font-weight:800;letter-spacing:.05em;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:middle;text-transform:uppercase}
    .inj-il60{background:rgba(255,82,82,.18);color:var(--r);border:1px solid rgba(255,82,82,.45)}
    .inj-il10{background:rgba(255,82,82,.12);color:var(--r);border:1px solid rgba(255,82,82,.35)}
    .inj-dtd {background:rgba(255,152,0,.14);color:var(--o);border:1px solid rgba(255,152,0,.4)}
    .inj-gtd {background:rgba(245,197,66,.12);color:var(--y);border:1px solid rgba(245,197,66,.4)}
    .injury-alert{background:rgba(255,82,82,.06);border:1px solid rgba(255,82,82,.3);border-left:3px solid var(--r);border-radius:8px;padding:9px 12px;margin:6px 0 14px;font-size:.78rem;color:rgba(255,200,200,.95)}
    .injury-alert strong{color:var(--r);font-weight:800}
    .injury-alert.gtd{border-left-color:var(--y);border-color:rgba(245,197,66,.3);background:rgba(245,197,66,.05);color:rgba(245,220,150,.95)}
    .injury-alert.gtd strong{color:var(--y)}
    .injury-alert.dtd{border-left-color:var(--o);border-color:rgba(255,152,0,.3);background:rgba(255,152,0,.05);color:rgba(255,210,150,.95)}
    .injury-alert.dtd strong{color:var(--o)}

    /* Sample size warning (Phase 1) */
    .h2h-sample-warn{background:rgba(245,197,66,.05);border:1px solid rgba(245,197,66,.25);border-left:3px solid var(--y);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:.74rem;color:rgba(245,220,150,.95);display:flex;align-items:baseline;gap:8px}
    .h2h-sample-warn .warn-icon{font-size:.9rem;color:var(--y)}
    .h2h-sample-warn strong{color:var(--y);font-weight:700}

    /* Ensemble model agreement grid (Phase 2) */
    .ensemble-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
    @media(max-width:600px){.ensemble-grid{grid-template-columns:repeat(2,1fr)}}
    .ensemble-cell{background:rgba(0,0,0,.18);border:1px solid var(--b);border-radius:8px;padding:7px 8px;text-align:center}
    .ensemble-cell.agree{border-color:rgba(0,230,118,.35);background:rgba(0,230,118,.04)}
    .ensemble-cell.mixed{border-color:rgba(245,197,66,.35);background:rgba(245,197,66,.04)}
    .ensemble-cell.split{border-color:rgba(255,82,82,.35);background:rgba(255,82,82,.04)}
    .ec-market{font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:700;margin-bottom:3px}
    .ec-vals{font-size:.7rem;color:var(--t);display:flex;justify-content:center;gap:4px;align-items:baseline}
    .ec-arrow{color:var(--mu);font-size:.7rem}
    .ec-flag{font-size:.58rem;font-weight:800;letter-spacing:.06em;margin-top:3px;padding:1px 5px;border-radius:4px;display:inline-block}

    /* Weather chip variants */
    .ctx-chip strong.good{color:var(--g)}
    .ctx-chip strong.bad{color:var(--r)}

    /* Lineup star rating */
    .b-stars{display:inline-block;font-size:.7rem;letter-spacing:1px;color:var(--y);line-height:1;margin-top:3px}
    .b-stars .empty{color:rgba(255,255,255,.12)}
    .b-stars.s5{color:var(--g)}
    .b-stars.s4{color:var(--c)}
    .b-stars.s3{color:var(--y)}
    .b-stars.s2{color:var(--o)}
    .b-stars.s1{color:var(--r)}
    .b-stars.s0{color:rgba(255,255,255,.25)}

    /* Quick Take reasoning summary */
    .reasoning-summary{
      background:linear-gradient(135deg,rgba(0,229,255,.06),rgba(0,230,118,.03));
      border:1px solid rgba(0,229,255,.2);
      border-left:3px solid var(--c);
      border-radius:10px;
      padding:11px 14px;
      margin:6px 0 14px;
    }
    .reasoning-header{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
    .reasoning-title{font-size:.6rem;font-weight:800;letter-spacing:.12em;color:var(--c);text-transform:uppercase}
    .reasoning-lead{font-size:.85rem;font-weight:700;color:var(--t);flex:1}
    .reasoning-lead.good{color:var(--g)}
    .reasoning-lead.warn{color:var(--y)}
    .reasoning-lead.bad{color:var(--r)}
    .reasoning-body{display:flex;flex-direction:column;gap:5px}
    .reasoning-line{display:flex;align-items:baseline;gap:8px;font-size:.78rem;line-height:1.35}
    .reasoning-icon{font-weight:800;font-size:.95rem;min-width:14px;text-align:center}
    .reasoning-icon.good{color:var(--g)}
    .reasoning-icon.warn{color:var(--y)}
    .reasoning-icon.bad{color:var(--r)}
    .reasoning-icon.mu{color:var(--mu)}
    .reasoning-label{font-weight:800;font-size:.66rem;letter-spacing:.07em;color:var(--mu);text-transform:uppercase;min-width:75px}
    .reasoning-detail{color:var(--t);flex:1}
    .reasoning-why{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
    .why-chip{font-size:.66rem;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:2px 8px;color:var(--mu)}
    .why-chip strong{color:var(--c);font-weight:700}
    .why-chip.pos{border-color:rgba(0,230,118,.25);color:rgba(170,240,200,.95)}
    .why-chip.neg{border-color:rgba(255,82,82,.25);color:rgba(255,180,180,.95)}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">MLB ANALYTICS HUB — BATTER VS PITCHER</div>
      <div class="sub" id="statusText">Select a game to explore head-to-head matchup history.</div>
    </div>
    <div class="actions">
      <a class="toplink" href="/">Dashboard</a>
      <a class="toplink" href="/props">Props</a>
      <a class="toplink" href="/value-bets">Value Bets</a>
      <a class="toplink" href="/nrfi">NRFI</a>
      <a class="toplink" href="/tracker">Tracker</a>
      <button class="btn" onclick="loadGames()">Refresh</button>
    </div>
  </div>

  <div class="game-strip" id="gameStrip">
    <div style="padding:12px 0;color:var(--mu);font-size:.82rem">Loading today's games…</div>
  </div>

  <div class="main" id="mainLayout">
    <div class="lineup-panel" id="lineupPanel">
      <div style="color:var(--mu);font-size:.82rem;text-align:center;padding:24px 0">Select a game above.</div>
    </div>
    <div class="detail-panel" id="detailPanel">
      <div class="empty-state">
        <div class="empty-icon">⚾</div>
        <div style="font-size:.9rem;font-weight:600">Select a batter from the lineup</div>
        <div style="font-size:.78rem">Career matchup history, grade, and projected probabilities will appear here.</div>
      </div>
    </div>
  </div>
</div>

<script>
let gamesData = [];
let currentGame = null;
let currentLineup = null;
let selectedBatter = null;
let bvpCache = {};
let gradeCache = {};

async function loadGames() {
  const strip = document.getElementById('gameStrip');
  strip.innerHTML = '<div style="padding:12px 0;color:var(--mu);font-size:.82rem">Loading…</div>';
  try {
    const r = await fetch('/api/games/today');
    const d = await r.json();
    gamesData = (d.games || []).filter(g => !g.isPostponed && !g.isCancelled);
    renderGameStrip();
    document.getElementById('statusText').textContent = `${gamesData.length} games today — click a matchup to explore BvP data.`;
  } catch(e) {
    strip.innerHTML = '<div style="color:var(--r);padding:10px">Failed to load games.</div>';
  }
}

function renderGameStrip() {
  const strip = document.getElementById('gameStrip');
  if (!gamesData.length) { strip.innerHTML = '<div style="padding:10px;color:var(--mu)">No games today.</div>'; return; }
  strip.innerHTML = gamesData.map((g,i) => `
    <div class="gpill${currentGame && currentGame.gamePk === g.gamePk ? ' sel' : ''}" onclick="selectGame(${i})">
      <div class="gpill-match">${g.awayAbbr} @ ${g.homeAbbr}</div>
      <div class="gpill-time">${g.gameTime || ''}</div>
      <div class="gpill-sp">${(g.awayPitcher||'TBD').split(' ').pop()} v ${(g.homePitcher||'TBD').split(' ').pop()}</div>
    </div>
  `).join('');
}

async function selectGame(idx) {
  currentGame = gamesData[idx];
  selectedBatter = null;
  renderGameStrip();
  document.getElementById('detailPanel').innerHTML = `<div class="empty-state"><div class="empty-icon">⚾</div><div style="font-size:.9rem">Select a batter from the lineup</div></div>`;

  const lp = document.getElementById('lineupPanel');
  lp.innerHTML = '<div class="loading-row"><div class="spinner" style="margin:auto"></div></div>';

  try {
    const pitcherParams = new URLSearchParams({
      away_name: currentGame.awayPitcher || '',
      home_name: currentGame.homePitcher || '',
    });
    const [lineupRes, pitcherRes] = await Promise.all([
      fetch(`/api/lineup/${currentGame.gamePk}`).then(r => r.json()),
      fetch(`/api/pitchers/${currentGame.gamePk}?${pitcherParams}`).then(r => r.json())
    ]);
    currentLineup = { lineup: lineupRes, pitchers: pitcherRes };
    renderLineup();
  } catch(e) {
    lp.innerHTML = '<div style="color:var(--r);padding:10px">Failed to load lineup.</div>';
  }
}

function gradeClass(g) {
  if (!g || g === '?') return 'grade-?';
  return 'grade-' + g.replace('+','\\+');
}

// Map matchup grade letter to a 1–5 star rating for the lineup panel.
// 5★ = elite spot, 1★ = avoid. Returns {stars, label} for tooltip + class.
function gradeToStars(g) {
  if (!g || g === '?') return { n: 0, label: 'No data' };
  const up = String(g).toUpperCase();
  if (up === 'A+' || up === 'A') return { n: 5, label: 'Elite matchup' };
  if (up === 'B+' || up === 'B') return { n: 4, label: 'Strong matchup' };
  if (up === 'C+' || up === 'C') return { n: 3, label: 'Average matchup' };
  if (up === 'D+' || up === 'D') return { n: 2, label: 'Weak matchup' };
  if (up === 'F'  || up === 'E') return { n: 1, label: 'Avoid — poor matchup' };
  return { n: 0, label: 'No data' };
}

function starsHtml(g) {
  const s = gradeToStars(g);
  const filled = '★'.repeat(s.n);
  const empty  = '<span class="empty">' + '☆'.repeat(5 - s.n) + '</span>';
  return `<span class="b-stars s${s.n}" title="${s.label}">${filled}${empty}</span>`;
}

// Injury badge for the lineup panel (compact, color-coded by severity).
function injuryBadgeHtml(injury) {
  if (!injury || !injury.status) return '';
  const cls = ({ IL_60:'inj-il60', IL_10:'inj-il10', DTD:'inj-dtd', GTD:'inj-gtd' })[injury.status] || 'inj-dtd';
  const lbl = ({ IL_60:'IL-60', IL_10:'IL', DTD:'DTD', GTD:'GTD' })[injury.status] || injury.status;
  const ttl = (injury.description || injury.type || injury.status).replace(/"/g,'&quot;');
  return `<span class="inj-badge ${cls}" title="${ttl}">${lbl}</span>`;
}

// Full injury alert for the detail panel header (more verbose).
function injuryAlertHtml(injury, playerLabel) {
  if (!injury || !injury.status) return '';
  const cls  = ({ IL_60:'', IL_10:'', DTD:'dtd', GTD:'gtd' })[injury.status] || 'dtd';
  const lbl  = ({ IL_60:'60-DAY IL', IL_10:'INJURED LIST', DTD:'DAY-TO-DAY', GTD:'GAME-TIME DECISION' })[injury.status] || injury.status;
  const desc = (injury.description || injury.type || '').trim();
  return `<div class="injury-alert ${cls}">
    ⚠ <strong>${playerLabel} — ${lbl}</strong>${desc ? ` · ${desc}` : ''}
  </div>`;
}

function renderLineup() {
  const { lineup, pitchers } = currentLineup;
  const g = currentGame;
  const away = lineup.away || [];
  const home = lineup.home || [];
  const awayP = pitchers.awayPitcher || {};
  const homeP = pitchers.homePitcher || {};

  const makeRows = (batters, oppPitcherId) => batters.map(b => {
    const cKey = `${b.id}_${oppPitcherId}`;
    const grade = gradeCache[cKey] || '?';
    return `<div class="batter-row" id="br_${b.id}_${oppPitcherId}" onclick="selectBatter(${b.id},'${esc(b.name)}',${oppPitcherId},'${esc((oppPitcherId === awayP.id ? awayP.name : homeP.name) || '')}')">
      <span class="b-slot">${b.slot||'?'}</span>
      <span class="b-name">
        ${b.name}${injuryBadgeHtml(b.injury)}
        <span id="stars_${b.id}_${oppPitcherId}">${starsHtml(grade)}</span>
        <div class="badge-row" id="badges_${b.id}"></div>
      </span>
      <span class="b-ops">${b.ops||'—'}</span>
      <span class="b-grade ${gradeClass(grade)}">${grade}</span>
    </div>`;
  }).join('');

  document.getElementById('lineupPanel').innerHTML = `
    <div class="lp-header"><span>${g.awayAbbr} @ ${g.homeAbbr}</span><span class="pill">${g.gameTime||''}</span></div>
    <div class="lp-team">${g.awayAbbr} BATTERS</div>
    <div class="lp-pitcher" id="pitcher_away">vs ${homeP.name || g.homePitcher || 'TBD'}${injuryBadgeHtml(homeP.injury)}</div>
    ${makeRows(away, homeP.id)}
    <div class="lp-team" style="margin-top:12px">${g.homeAbbr} BATTERS</div>
    <div class="lp-pitcher" id="pitcher_home">vs ${awayP.name || g.awayPitcher || 'TBD'}${injuryBadgeHtml(awayP.injury)}</div>
    ${makeRows(home, awayP.id)}
  `;

  prefetchGrades(away, homeP.id || null);
  prefetchGrades(home, awayP.id || null);
  
  // Load batter badges
  loadBatterBadges(away);
  loadBatterBadges(home);
  
  // Load pitcher badges
  if (homeP.id) loadPitcherBadge(homeP.id, 'pitcher_away');
  if (awayP.id) loadPitcherBadge(awayP.id, 'pitcher_home');
}

async function prefetchGrades(batters, pitcherId) {
  if (!pitcherId || pitcherId === 0) return;
  for (const b of batters) {
    const cKey = `${b.id}_${pitcherId}`;
    if (gradeCache[cKey]) continue;
    try {
      const r = await fetch(`/api/bvp/${b.id}/${pitcherId}`);
      const d = await r.json();
      gradeCache[cKey] = d.grade || '?';
      const el = document.getElementById(`br_${b.id}_${pitcherId}`);
      if (el) {
        const span = el.querySelector('.b-grade');
        if (span) {
          span.className = `b-grade ${gradeClass(d.grade || '?')}`;
          span.textContent = d.grade || '?';
        }
        const starEl = document.getElementById(`stars_${b.id}_${pitcherId}`);
        if (starEl) starEl.innerHTML = starsHtml(d.grade || '?');
      }
    } catch(e) { gradeCache[cKey] = '?'; }
  }
}

async function selectBatter(batterId, batterName, pitcherId, pitcherName) {
  selectedBatter = { batterId, batterName, pitcherId, pitcherName };

  document.querySelectorAll('.batter-row').forEach(r => r.classList.remove('sel'));
  const el = document.getElementById(`br_${batterId}_${pitcherId}`);
  if (el) el.classList.add('sel');

  // Look up injury info from the cached lineup so we can surface it
  // immediately without re-fetching.
  let batterInjury = null, pitcherInjury = null;
  if (currentLineup) {
    const allBatters = [...(currentLineup.lineup?.away || []), ...(currentLineup.lineup?.home || [])];
    const b = allBatters.find(x => x.id === batterId);
    if (b && b.injury) batterInjury = b.injury;
    const ps = currentLineup.pitchers || {};
    if (ps.awayPitcher && ps.awayPitcher.id === pitcherId) pitcherInjury = ps.awayPitcher.injury || null;
    else if (ps.homePitcher && ps.homePitcher.id === pitcherId) pitcherInjury = ps.homePitcher.injury || null;
  }

  const dp = document.getElementById('detailPanel');
  dp.innerHTML = '<div class="loading-row"><div class="spinner" style="margin:auto"></div><div style="margin-top:8px;color:var(--mu);font-size:.8rem">Loading BvP data…</div></div>';

  const cKey = `detail_${batterId}_${pitcherId}`;
  if (bvpCache[cKey]) { renderDetail(bvpCache[cKey]); return; }

  try {
    const gamePk = currentGame ? currentGame.gamePk : '';
    const [summaryRes, logsRes, projRes] = await Promise.all([
      fetch(`/api/bvp/${batterId}/${pitcherId}`).then(r => r.json()),
      fetch(`/api/player/${batterId}/bvp/${pitcherId}`).then(r => r.json()).catch(() => ({})),
      fetch(`/api/bvp/${batterId}/${pitcherId}/projection${gamePk ? '?game_pk='+gamePk : ''}`).then(r => r.json()).catch(() => ({}))
    ]);
    const data = { summary: summaryRes, logs: logsRes, proj: projRes, batterName, pitcherName, batterInjury, pitcherInjury };
    bvpCache[cKey] = data;
    renderDetail(data);
  } catch(e) {
    dp.innerHTML = '<div style="color:var(--r);padding:16px">Failed to load BvP data.</div>';
  }
}

function fmtPct(v) { return v != null ? (v * 100).toFixed(1) + '%' : '—'; }
function fmtAvg(v) { return v != null ? Number(v).toFixed(3) : '—'; }
function fmtOps(v) { return v != null ? Number(v).toFixed(3) : '—'; }

function esc(s) { return (s||'').replace(/'/g, "\\'"); }

// ── Stat quality colour helpers ──────────────────────────────────────────────
function xstatColor(val, lg, higherIsBetter = true) {
  if (val == null) return '';
  const delta = higherIsBetter ? val - lg : lg - val;
  if (delta >  0.025) return 'good';
  if (delta > -0.010) return '';
  return 'bad';
}
function pctColor(pct) {
  if (pct == null) return '';
  if (pct >= 70) return 'good';
  if (pct >= 40) return '';
  return 'bad';
}
function fmtPct2(v, dec=1) { return v != null ? Number(v*100).toFixed(dec)+'%' : '—'; }
function pctBadge(pct) {
  if (pct == null) return '';
  const cls = pctColor(pct);
  return `<span style="font-size:.58rem;margin-left:4px;color:var(--${cls==='good'?'g':cls==='bad'?'r':'mu'})">${pct}th</span>`;
}

// ── Phase 2 helpers ───────────────────────────────────────────────────────

// Score weather impact on HR/TB props. Returns {label, score, direction}
// where score is the multiplier (1.0 = neutral, >1 favors hitters).
// Research: <55°F = -% carry; 65-75°F neutral; >80°F +% carry; wind 10+mph
// in/out is one of the strongest predictors in MLB betting.
function scoreWeather(wx, parkFactor) {
  if (!wx || typeof wx !== 'object') return null;
  if (wx.dome) return { label: '<strong>Dome</strong> · neutral conditions', score: 1.0 };
  const temp = (typeof wx.temp === 'number') ? wx.temp : null;
  const wind = (typeof wx.wind_speed === 'number') ? wx.wind_speed : null;
  const dir  = (wx.wind_dir || '').toUpperCase();
  if (temp == null && wind == null) return null;

  // Temperature multiplier on carry distance
  let tempMult = 1.0;
  if (temp != null) {
    if (temp < 50)      tempMult = 0.93;
    else if (temp < 60) tempMult = 0.97;
    else if (temp < 75) tempMult = 1.00;
    else if (temp < 85) tempMult = 1.03;
    else                tempMult = 1.06;
  }
  // Wind multiplier (crude — only the outfield direction matters most)
  // 'Out' winds (S/SW/SE typically for many parks) boost HR; 'In' wind suppresses.
  // We treat NE/N/NW as headwind, S/SE/SW as tailwind, others neutral.
  let windMult = 1.0;
  let windHint = '';
  if (wind != null && wind >= 8) {
    if (/^S/.test(dir))      { windMult = 1.0 + Math.min(0.18, wind * 0.013); windHint = ' out'; }
    else if (/^N/.test(dir)) { windMult = 1.0 - Math.min(0.18, wind * 0.013); windHint = ' in'; }
  }
  const combined = tempMult * windMult;
  const pct = (combined - 1) * 100;
  // Build chip label
  const parts = [];
  if (temp != null) parts.push(`${temp}°F`);
  if (wind != null && wind >= 1) parts.push(`${wind}mph ${dir || ''}${windHint}`.trim());
  if (wx.condition && wx.condition !== 'N/A') parts.push(wx.condition);
  const tone = pct >= 2.5 ? 'good' : pct <= -2.5 ? 'bad' : '';
  const tag  = Math.abs(pct) >= 1 ? `<strong class="${tone}">${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</strong>` : '<strong>neutral</strong>';
  const label = `Wx: ${parts.join(' · ')} → ${tag} carry`;
  return { label, score: combined, direction: pct };
}

// Compute per-market ensemble agreement between XGB and the blended projection.
// Returns array of {market, label, blended, xgb, divergence, flag, flagCls}.
// flag: 'AGREE' (Δ<8pts), 'MIXED' (Δ8-15pts), 'SPLIT' (Δ>15pts).
function computeEnsembleAgreement(probs) {
  if (!probs) return [];
  const rows = [];
  const markets = [
    { key: 'hit1', label: '1+ Hit', xgbKey: 'xgbHitProb' },
    { key: 'tb2',  label: '2+ TB',  xgbKey: 'xgbTbProb' },
    { key: 'hr',   label: 'HR',     xgbKey: 'xgbHrProb' },
    { key: 'rbi1', label: '1+ RBI', xgbKey: 'xgbRbiProb' },
  ];
  for (const m of markets) {
    const blended = probs[m.key];
    const xgb     = probs[m.xgbKey];
    if (blended == null || xgb == null) continue;
    const div = Math.abs(blended - xgb);
    let flag, flagCls;
    if (div < 0.08)      { flag = 'AGREE'; flagCls = 'v-bet'; }
    else if (div < 0.15) { flag = 'MIXED'; flagCls = 'v-lean'; }
    else                 { flag = 'SPLIT'; flagCls = 'v-fade'; }
    rows.push({ market: m.label, blended, xgb, divergence: div, flag, flagCls });
  }
  return rows;
}

// Synthesizes BET/LEAN/FADE verdicts + drivers + context into a 1-glance
// "Quick Take" panel that tells the user which props to play and why.
function buildReasoningSummary(proj, summary, batterName, pitcherName, batterInjury, pitcherInjury) {
  if (!proj) return '';
  const verdicts = proj.verdicts || {};
  const probs    = proj.projectedProbs || {};
  const drivers  = Array.isArray(proj.drivers) ? proj.drivers : [];
  const mc       = proj.matchupContext || {};
  const pp       = proj.pitcherProfile || {};
  const bq       = proj.batterQuality  || {};
  const adj      = proj.adjustments    || {};
  const gctx     = proj.gameContext    || {};
  const vsSP     = proj.vsStarter || null;

  // Injury severity: IL_60 / IL_10 = blocking, DTD = warning, GTD = caution
  const batterIlBlocking = batterInjury && (batterInjury.status === 'IL_60' || batterInjury.status === 'IL_10');
  const pitcherIlBlocking = pitcherInjury && (pitcherInjury.status === 'IL_60' || pitcherInjury.status === 'IL_10');
  const anyInjuryWarning = !!(batterInjury || pitcherInjury);

  // H2H sample-size unreliability flag
  const careerPA = (summary && summary.pa) || 0;
  const smallSample = careerPA > 0 && careerPA < 50;

  const labels = { hit1:'1+ Hit', tb2:'2+ TB', hr:'Home Run', rbi1:'1+ RBI' };
  const bets = [], leans = [], fades = [];
  for (const k of ['hit1','tb2','hr','rbi1']) {
    const v = verdicts[k], p = probs[k];
    if (!v || p == null) continue;
    const tile = { market: labels[k], prob: p };
    if (v.key === 'bet')       bets.push(tile);
    else if (v.key === 'lean') leans.push(tile);
    else if (v.key === 'fade') fades.push(tile);
  }
  bets.sort((a,b) => b.prob - a.prob);
  leans.sort((a,b) => b.prob - a.prob);

  // Lead headline — tone down if quality/H2H/pitcher context conflicts with verdicts
  const weakQuality = bq.xwoba_pct != null && bq.xwoba_pct <= 35;
  const weakH2H     = summary && summary.avg != null && summary.avg <= 0.240 && (summary.pa || 0) >= 15;
  const elitePitcher= pp.xera != null && pp.xera <= 3.10;
  const badPlatoon  = mc.platoonNote && mc.platoonNote.includes('(—)');
  const cautionFlags = (weakQuality ? 1 : 0) + (weakH2H ? 1 : 0) + (elitePitcher ? 1 : 0) + (badPlatoon ? 1 : 0);
  const shouldTemper = cautionFlags >= 2 || (weakH2H && bets.length <= 1) || smallSample;

  let lead, leadCls = '';
  // Injury blocking takes precedence over all other signals
  if (batterIlBlocking) {
    lead = `Avoid — ${batterName} on the IL. Bet not playable.`;
    leadCls = 'bad';
  } else if (pitcherIlBlocking) {
    lead = `Pitcher matchup invalid — ${pitcherName} on the IL. Wait for confirmed SP.`;
    leadCls = 'bad';
  } else if (bets.length >= 3 && !shouldTemper)      { lead = `Smash spot — ${bets.length} BET-grade markets for ${batterName}.`; leadCls = 'good'; }
  else if (bets.length >= 2 && !shouldTemper) { lead = `Strong spot — multi-market edge on ${batterName}.`; leadCls = 'good'; }
  else if (bets.length >= 2 && shouldTemper)  { lead = `Lean opp. — BET markets identified, but quality/matchup context is mixed.`; leadCls = 'warn'; }
  else if (bets.length === 1 && !shouldTemper){ lead = `Targeted play — ${bets[0].market} stands out.`; leadCls = 'good'; }
  else if (bets.length === 1 && shouldTemper) { lead = `Lean angle — projection edge, but sample/quality tempers.`; leadCls = 'warn'; }
  else if (leans.length >= 2)                 { lead = `Lean spot — moderate edges, not a hammer.`; leadCls = 'warn'; }
  else if (fades.length >= 2)                 { lead = `Tough matchup — multiple fades indicated.`; leadCls = 'bad'; }
  else if (fades.length === 1)                { lead = `Mixed signals — one fade, no clear bet.`; leadCls = 'warn'; }
  else                                        { lead = `Neutral spot — no clear edge identified.`; leadCls = 'warn'; }

  // Action lines (BEST / LEAN / AVOID)
  const actions = [];
  if (bets.length) actions.push({
    icon:'✓', cls:'good', label:'Best Plays',
    detail: bets.map(b => `<strong>${b.market}</strong> (${(b.prob*100).toFixed(0)}%)`).join(' · ')
  });
  if (leans.length) actions.push({
    icon:'○', cls:'warn', label:'Lean',
    detail: leans.map(l => `${l.market} (${(l.prob*100).toFixed(0)}%)`).join(' · ')
  });
  if (fades.length) actions.push({
    icon:'✗', cls:'bad', label:'Avoid',
    detail: fades.map(f => `${f.market} (${(f.prob*100).toFixed(0)}%)`).join(' · ')
  });
  if (!actions.length) actions.push({
    icon:'·', cls:'mu', label:'Pass',
    detail: 'No graded edges — better spots elsewhere on the slate.'
  });

  const actionsHtml = actions.map(a =>
    `<div class="reasoning-line">
       <span class="reasoning-icon ${a.cls}">${a.icon}</span>
       <span class="reasoning-label">${a.label}</span>
       <span class="reasoning-detail">${a.detail}</span>
     </div>`
  ).join('');

  // Context "why" chips — pull from drivers, quality, pitcher, platoon, form
  const whys = [];

  // Injury chips first so they're visible at the top of the chip strip
  if (batterInjury && !batterIlBlocking) {
    whys.push(`<span class="why-chip neg">⚠ ${batterName.split(' ').pop()} ${batterInjury.status === 'GTD' ? 'GTD' : 'DTD'}</span>`);
  }
  if (pitcherInjury && !pitcherIlBlocking) {
    whys.push(`<span class="why-chip neg">⚠ Pitcher ${pitcherInjury.status === 'GTD' ? 'GTD' : 'DTD'}</span>`);
  }

  // Small sample warning chip
  if (smallSample) {
    whys.push(`<span class="why-chip neg">Small H2H sample — <strong>${careerPA} PA</strong></span>`);
  }

  if (bq.xwoba_pct != null && bq.xwoba_pct >= 75) {
    whys.push(`<span class="why-chip pos">Elite quality — <strong>${bq.xwoba_pct}th</strong> xwOBA</span>`);
  } else if (bq.xwoba_pct != null && bq.xwoba_pct <= 35) {
    whys.push(`<span class="why-chip neg">Below-avg quality — <strong>${bq.xwoba_pct}th</strong> xwOBA</span>`);
  }
  if (adj.pitch_mix != null && adj.pitch_mix > 0.01) {
    whys.push(`<span class="why-chip pos">Favorable arsenal <strong>+${(adj.pitch_mix*100).toFixed(1)}%</strong></span>`);
  } else if (adj.pitch_mix != null && adj.pitch_mix < -0.01) {
    whys.push(`<span class="why-chip neg">Unfavorable arsenal <strong>${(adj.pitch_mix*100).toFixed(1)}%</strong></span>`);
  }
  if (pp.xera != null) {
    if (pp.xera <= 3.10)      whys.push(`<span class="why-chip neg">Elite SP — xERA <strong>${pp.xera.toFixed(2)}</strong></span>`);
    else if (pp.xera >= 4.50) whys.push(`<span class="why-chip pos">Hittable SP — xERA <strong>${pp.xera.toFixed(2)}</strong></span>`);
  }
  if (mc.platoonNote) {
    const cls = mc.platoonNote.includes('(—)') ? 'neg' : '';
    whys.push(`<span class="why-chip ${cls}">${mc.platoonNote}</span>`);
  }
  if (gctx.ttopBatterMult != null && gctx.ttopBatterMult > 1.01) {
    whys.push(`<span class="why-chip pos">TTOP boost <strong>+${((gctx.ttopBatterMult-1)*100).toFixed(1)}%</strong></span>`);
  }
  if (gctx.umpire && gctx.umpire.tendency) {
    const t = gctx.umpire.tendency;
    if (t === 'HITTER')       whys.push(`<span class="why-chip pos">Hitter-friendly ump</span>`);
    else if (t === 'PITCHER') whys.push(`<span class="why-chip neg">Pitcher-friendly ump</span>`);
  }
  // Weather impact chip — surface when materially affecting carry
  const wxImpact = scoreWeather(gctx.weather, gctx.parkFactor);
  if (wxImpact && Math.abs(wxImpact.direction) >= 2.5) {
    const cls = wxImpact.direction > 0 ? 'pos' : 'neg';
    const dir = wxImpact.direction > 0 ? '+' : '';
    whys.push(`<span class="why-chip ${cls}">Weather <strong>${dir}${wxImpact.direction.toFixed(1)}%</strong> HR/TB carry</span>`);
  }
  // Park favorability chip (extreme parks only — Coors / pitcher parks)
  if (gctx.parkFactor != null) {
    if (gctx.parkFactor >= 1.06) whys.push(`<span class="why-chip pos">Hitter park <strong>+${((gctx.parkFactor-1)*100).toFixed(1)}%</strong></span>`);
    else if (gctx.parkFactor <= 0.94) whys.push(`<span class="why-chip neg">Pitcher park <strong>${((gctx.parkFactor-1)*100).toFixed(1)}%</strong></span>`);
  }
  if (summary && summary.avg != null && (summary.pa || 0) >= 15) {
    const avgClass = summary.avg <= 0.240 ? 'neg' : summary.avg >= 0.300 ? 'pos' : '';
    whys.push(`<span class="why-chip ${avgClass}">Career H2H <strong>${summary.avg.toFixed(3)}</strong> (${summary.pa} PA)</span>`);
  }
  if (vsSP && vsSP.paVsSp != null) {
    // Only surface this when game-total and starter-only meaningfully diverge.
    const gameHit = probs.hit1, spHit = vsSP.probs && vsSP.probs.hit1;
    if (gameHit != null && spHit != null && Math.abs(gameHit - spHit) >= 0.08) {
      const dir = spHit > gameHit ? 'pos' : 'neg';
      whys.push(`<span class="why-chip ${dir}">SP-only 1+H <strong>${(spHit*100).toFixed(0)}%</strong> vs game ${(gameHit*100).toFixed(0)}%</span>`);
    }
  }
  // Top driver bullets (if anything is left to add)
  drivers.slice(0,2).forEach(d => {
    const cls = d.contribution > 0 ? 'pos' : 'neg';
    const arrow = d.contribution > 0 ? '▲' : '▼';
    whys.push(`<span class="why-chip ${cls}">${arrow} ${d.label} <strong>${(d.contribution*100).toFixed(1)}%</strong></span>`);
  });

  const whysHtml = whys.length ? `<div class="reasoning-why">${whys.join('')}</div>` : '';

  return `
    <div class="reasoning-summary">
      <div class="reasoning-header">
        <span class="reasoning-title">Quick Take</span>
        <span class="reasoning-lead ${leadCls}">${lead}</span>
      </div>
      <div class="reasoning-body">${actionsHtml}</div>
      ${whysHtml}
    </div>`;
}

function renderDetail(data) {
  const { summary, logs, proj, batterName, pitcherName, batterInjury, pitcherInjury } = data;
  const { batterId, pitcherId } = selectedBatter;
  const grade   = summary.grade || '?';
  const gbClass = 'gb-' + grade.replace('+','\\+');
  const pa      = summary.pa || 0;
  const games   = logs.games || [];

  // Use projection probs (Feature #1); fallback to legacy logs field
  const probs = (proj && proj.projectedProbs) || logs.projectedProbs || null;
  const ev    = (proj && proj.expectedValues)  || {};
  const bq    = (proj && proj.batterQuality)   || {};
  const pp    = (proj && proj.pitcherProfile)  || {};
  const mc    = (proj && proj.matchupContext)  || {};

  const ratioColor = (r) => {
    if (r == null) return '';
    if (r >= 1.20) return 'class="good"';
    if (r >= 1.00) return '';
    return 'class="bad"';
  };

  // Grade basis label — append staleness indicator when data is old
  const _staleCapped = summary.is_stale && (summary.grade === 'B') && pa >= 10;
  const gradeBasis = (summary.grade_basis === 'platoon'
    ? `vs ${summary.pitcher_hand === 'L' ? 'LHP' : 'RHP'}`
    : (pa >= 10 ? 'H2H' : pa > 0 ? 'H2H*' : 'vs RHP/LHP'))
    + (_staleCapped ? ' · capped' : (summary.is_stale && pa > 0 ? ' · stale' : ''));

  const gameRows = games.slice(0, 10).map(g => {
    const hitColor = g.hits >= 1 ? 'class="good"' : 'class="bad"';
    const pitcherDisplay = g.pitcher && g.pitcher !== '—' ? g.pitcher : (pitcherName || '—');
    const teamDisplay = g.team ? `<span style="color:var(--mu);font-size:.68rem">${g.team}</span> ` : '';
    return `<tr>
      <td>${g.date||'—'}</td>
      <td>${teamDisplay}${pitcherDisplay}</td>
      <td ${hitColor}>${g.ab??'—'}/${g.hits??'—'}</td>
      <td>${g.hr||0}</td>
      <td>${g.rbi||0}</td>
      <td>${g.bb||0}</td>
      <td>${g.k||0}</td>
      <td style="color:var(--mu);font-size:.7rem">${g.score||'—'} ${g.result||''}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" style="color:var(--mu);text-align:center;padding:12px">No game logs available</td></tr>';

  // ── xStats / quality row (Feature #2) ────────────────────────────────────
  const _bqSrc = bq.source || 'fg';
  const xstatsHtml = bq.xba != null ? `
    <div class="section-label" style="margin-top:12px">Expected Stats <span style="font-size:.58rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">— Statcast / season</span></div>
    <div class="stat-row" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-box">
        <div class="stat-val ${xstatColor(bq.xba, 0.250)}">${fmtAvg(bq.xba)}</div>
        <div class="stat-lbl">xBA${pctBadge(bq.xba_pct)}</div>
      </div>
      <div class="stat-box">
        <div class="stat-val ${xstatColor(bq.xslg, 0.390)}">${fmtOps(bq.xslg)}</div>
        <div class="stat-lbl">xSLG</div>
      </div>
      <div class="stat-box">
        <div class="stat-val ${xstatColor(bq.xwoba, 0.310)}">${fmtOps(bq.xwoba)}</div>
        <div class="stat-lbl">xwOBA${pctBadge(bq.xwoba_pct)}</div>
      </div>
      <div class="stat-box">
        <div class="stat-val ${xstatColor(bq.ev, 88.5)}">${bq.ev != null ? bq.ev.toFixed(1) : '—'}</div>
        <div class="stat-lbl">EV mph${pctBadge(bq.ev_pct)}</div>
      </div>
      <div class="stat-box">
        <div class="stat-val ${xstatColor(bq.brl_pct, 6.3)}">${bq.brl_pct != null ? bq.brl_pct.toFixed(1)+'%' : '—'}</div>
        <div class="stat-lbl">BRL%${pctBadge(bq.brl_pct_rank)}</div>
      </div>
    </div>` : (bq.fg_woba != null ? `
    <div class="section-label" style="margin-top:12px">Season Rates <span style="font-size:.58rem;color:var(--y);font-weight:400;text-transform:none;letter-spacing:0">— FanGraphs / MLB (Statcast unavailable)</span></div>
    <div class="stat-row" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-box">
        <div class="stat-val ${xstatColor(bq.fg_woba, 0.310)}">${bq.fg_woba != null ? bq.fg_woba.toFixed(3) : '—'}</div>
        <div class="stat-lbl">wOBA</div>
      </div>
      <div class="stat-box">
        <div class="stat-val ${xstatColor(bq.fg_iso, 0.150)}">${bq.fg_iso != null ? bq.fg_iso.toFixed(3) : '—'}</div>
        <div class="stat-lbl">ISO</div>
      </div>
      <div class="stat-box">
        <div class="stat-val ${bq.fg_kpct <= 0.18 ? 'good' : bq.fg_kpct >= 0.26 ? 'bad' : ''}">${bq.fg_kpct != null ? (bq.fg_kpct*100).toFixed(1)+'%' : '—'}</div>
        <div class="stat-lbl">K%</div>
      </div>
      <div class="stat-box">
        <div class="stat-val ${bq.fg_bbpct >= 0.10 ? 'good' : bq.fg_bbpct < 0.06 ? 'bad' : ''}">${bq.fg_bbpct != null ? (bq.fg_bbpct*100).toFixed(1)+'%' : '—'}</div>
        <div class="stat-lbl">BB%</div>
      </div>
    </div>` : '');

  // ── Pitcher profile compact note ───────────────────────────────────────────
  const pitNotes = [];
  if (pp.xera   != null) pitNotes.push(`xERA ${pp.xera.toFixed(2)}`);
  if (pp.whiff_pct != null) pitNotes.push(`Whiff ${(pp.whiff_pct).toFixed(1)}%`);
  if (pp.k_pct  != null) pitNotes.push(`K% ${(pp.k_pct*100).toFixed(1)}%`);
  if (pp.xwoba_against != null) pitNotes.push(`xwOBA-against ${pp.xwoba_against.toFixed(3)}`);
  const pitProfileHtml = pitNotes.length ? `
    <div style="font-size:.65rem;color:var(--mu);background:rgba(0,0,0,.2);border-radius:6px;padding:5px 10px;margin-bottom:12px;border-left:2px solid rgba(0,229,255,.2)">
      <span style="color:var(--c);margin-right:4px">Pitcher:</span>${pitNotes.join(' · ')}
      ${mc.platoonNote ? `<span style="margin-left:8px;color:var(--y)">${mc.platoonNote}</span>` : ''}
    </div>` : '';

  // ── Projected probs section ───────────────────────────────────────────────
  // Renders BOTH game-level probabilities (what props clear on) and the
  // PA-vs-this-starter slice (what truly reflects this matchup). Each tile
  // is colored by Bet/Lean/Pass/Fade verdict.
  const verdicts = (proj && proj.verdicts) || {};
  const vsSP     = (proj && proj.vsStarter) || null;

  function probTile(prob, evVal, evSuffix, label, market, verdict) {
    if (prob == null) return '';
    const v = verdict || {key:'pass', label:'—', cls:''};
    const tone = v.key === 'bet' ? 'bet' : v.key === 'lean' ? 'lean' : v.key === 'fade' ? 'fade' : '';
    const valColor = v.key === 'bet' ? 'good' : v.key === 'fade' ? 'bad' : v.key === 'lean' ? 'warn' : '';
    return `<div class="prob-box ${tone}">
      <div class="prob-val ${valColor}">${fmtPct2(prob)}</div>
      <div class="prob-lbl">${label}</div>
      ${evVal != null ? `<div style="font-size:.58rem;color:var(--mu);margin-top:2px">E: ${Number(evVal).toFixed(market==='hr'?3:2)}${evSuffix?' '+evSuffix:''}</div>` : ''}
      ${v.label && v.label !== '—' ? `<div class="verdict-pill ${v.cls}">${v.label}</div>` : ''}
    </div>`;
  }

  const probHtml = probs ? `
    <div class="section-label">Game-Total Projection <span style="font-size:.58rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">— full game · BATX engine · how the prop clears</span></div>
    <div class="prob-row">
      ${probTile(probs.hit1, ev.hits, 'H',   '1+ Hit',   'hit1', verdicts.hit1)}
      ${probTile(probs.tb2,  ev.tb,   'TB',  '2+ TB',    'tb2',  verdicts.tb2)}
      ${probTile(probs.hr,   ev.hr,   'HR',  'Home Run', 'hr',   verdicts.hr)}
      ${probTile(probs.rbi1, ev.rbi,  'RBI', '1+ RBI',   'rbi1', verdicts.rbi1)}
    </div>` : '';

  // ── Ensemble model agreement panel (Phase 2) ─────────────────────────────
  // Show XGB vs Blended agreement per market so users can spot when models
  // disagree (i.e., the projection is less reliable).
  const ensembleRows = computeEnsembleAgreement(probs);
  const agreeCount = ensembleRows.filter(r => r.flag === 'AGREE').length;
  const ensembleHtml = ensembleRows.length ? `
    <div class="section-label">Ensemble Model Agreement <span style="font-size:.58rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">— XGB vs Blended · ${agreeCount}/${ensembleRows.length} markets agree</span></div>
    <div class="ensemble-grid">
      ${ensembleRows.map(r => `
        <div class="ensemble-cell ${r.flag.toLowerCase()}">
          <div class="ec-market">${r.market}</div>
          <div class="ec-vals"><span>XGB ${(r.xgb*100).toFixed(0)}%</span><span class="ec-arrow">↔</span><span>Blend ${(r.blended*100).toFixed(0)}%</span></div>
          <div class="ec-flag ${r.flagCls}">${r.flag} · Δ${(r.divergence*100).toFixed(0)}pts</div>
        </div>`).join('')}
    </div>` : '';

  // PA vs This Pitcher (Starter only) — shows the slice of the game that
  // actually pits this batter against this pitcher.
  const vsSpHtml = (vsSP && vsSP.probs) ? `
    <div class="section-label">vs ${pitcherName||'Starter'} <span style="font-size:.58rem;color:var(--c);font-weight:400;text-transform:none;letter-spacing:0">— ${vsSP.paVsSp} PAs vs SP only · ~${vsSP.starterTBF} TBF</span></div>
    <div class="prob-row">
      ${probTile(vsSP.probs.hit1, vsSP.expected?.hits, 'H',   '1+ Hit',   'hit1', vsSP.verdicts?.hit1)}
      ${probTile(vsSP.probs.tb2,  vsSP.expected?.tb,   'TB',  '2+ TB',    'tb2',  vsSP.verdicts?.tb2)}
      ${probTile(vsSP.probs.hr,   vsSP.expected?.hr,   'HR',  'Home Run', 'hr',   vsSP.verdicts?.hr)}
      ${probTile(vsSP.probs.rbi1, vsSP.expected?.rbi,  'RBI', '1+ RBI',   'rbi1', vsSP.verdicts?.rbi1)}
    </div>` : '';

  // Pitcher K total vs the actual lineup he's facing today.
  const pkProj = (proj && proj.pitcherKProjection) || null;
  const pkHtml = pkProj ? `
    <div class="section-label">Pitcher K's vs Lineup <span style="font-size:.58rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">— Log5 matchup · ${pkProj.lineupSize}-man lineup · ~${pkProj.expectedTBF} TBF</span></div>
    <div class="pk-panel">
      <div class="pk-head">
        <div><span style="font-size:.66rem;color:var(--mu);text-transform:uppercase;letter-spacing:.08em">Projected K Total</span></div>
        <div class="ek">${pkProj.expectedK.toFixed(1)}</div>
      </div>
      <div class="pk-lines">
        ${(pkProj.lineProjections||[]).map(l => {
          const tone = l.verdictCls === 'v-bet' ? 'bet' : l.verdictCls === 'v-lean' ? 'lean' : '';
          const sideArrow = l.side === 'over' ? '▲' : l.side === 'under' ? '▼' : '·';
          const sideProb = l.side === 'over' ? l.pOver : l.side === 'under' ? l.pUnder : Math.max(l.pOver,l.pUnder);
          return `<div class="pk-line ${tone}">
            <div class="lv">${l.line.toFixed(1)}</div>
            <div class="lp">O ${(l.pOver*100).toFixed(0)}% · U ${(l.pUnder*100).toFixed(0)}%</div>
            <div class="lb ${l.verdictCls}">${sideArrow} ${l.verdict}</div>
          </div>`;
        }).join('')}
      </div>
      ${pkProj.perBatter && pkProj.perBatter.length ? `
        <details style="margin-top:8px">
          <summary style="cursor:pointer;color:var(--mu);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em">Per-batter breakdown</summary>
          <div style="margin-top:6px;display:grid;grid-template-columns:24px 1fr 50px 60px;gap:2px 8px;font-size:.66rem">
            <span style="color:var(--mu);font-size:.55rem">#</span>
            <span style="color:var(--mu);font-size:.55rem">Batter</span>
            <span style="color:var(--mu);font-size:.55rem">K%/PA</span>
            <span style="color:var(--mu);font-size:.55rem">xK</span>
            ${pkProj.perBatter.map(b => `
              <span>${b.slot}</span>
              <span style="color:var(--t)">${b.name}</span>
              <span>${(b.kPerPa*100).toFixed(1)}%</span>
              <span style="color:var(--c)">${b.expK.toFixed(2)}</span>
            `).join('')}
          </div>
        </details>` : ''}
    </div>` : '';

  // ── Game-context strip: TTOP, umpire, park, weather (Phase 2) ─────────────
  const gctx = (proj && proj.gameContext) || {};
  const ctxChips = [];
  if (gctx.ttopBatterMult != null && gctx.ttopBatterMult !== 1) {
    const pct = ((gctx.ttopBatterMult - 1) * 100).toFixed(1);
    ctxChips.push(`<span class="ctx-chip">TTOP <strong>${pct >= 0 ? '+' : ''}${pct}%</strong> wOBA boost</span>`);
  }
  if (gctx.umpire && gctx.umpire.name) {
    const ump = gctx.umpire;
    const tendency = ump.tendency || (ump.zone >= 60 ? 'PITCHER' : ump.zone <= 40 ? 'HITTER' : 'NEUTRAL');
    const kpct = gctx.umpireKMult != null ? ` · K×${gctx.umpireKMult.toFixed(2)}` : '';
    ctxChips.push(`<span class="ctx-chip">HP Ump: <strong>${ump.name||''}</strong> ${ump.zone!=null?`(${tendency} ${ump.zone})`:''}${kpct}</span>`);
  }
  if (proj && proj.parkFactor != null && proj.parkFactor !== 1) {
    const pf = proj.parkFactor;
    const dir = pf > 1 ? '+' : '';
    ctxChips.push(`<span class="ctx-chip">Park <strong>${dir}${((pf-1)*100).toFixed(1)}%</strong></span>`);
  }
  // Weather chip — temperature + wind direction/speed with implied carry effect
  const wxScore = scoreWeather(gctx.weather, proj && proj.parkFactor);
  if (wxScore && wxScore.label) {
    ctxChips.push(`<span class="ctx-chip">${wxScore.label}</span>`);
  }
  const ctxStripHtml = ctxChips.length ? `<div class="ctx-strip">${ctxChips.join('')}</div>` : '';

  // ── Pitch-mix adjustment panel ────────────────────────────────────────────
  const _adjt = (proj && proj.adjustments) || {};
  const _pmCtx = (proj && proj.matchupContext) || {};
  const pitchMixHtml = (() => {
    const pm     = _adjt.pitch_mix;
    const pmNote = _adjt.pitch_mix_note;
    const fgScore = _pmCtx.mixScoreFg;
    const svScore = _pmCtx.mixScoreSv;
    const blended = _pmCtx.mixScore;
    const fgRows  = Array.isArray(_pmCtx.mixRowsFg) ? _pmCtx.mixRowsFg : [];
    if (pm == null && fgScore == null) return '';
    const sign  = (pm ?? 0) >= 0 ? '+' : '';
    const col   = (pm ?? 0) > 0.002 ? 'var(--g)' : (pm ?? 0) < -0.002 ? '#ff7070' : 'var(--mu)';
    const label = (pm ?? 0) > 0.005 ? 'Favorable' : (pm ?? 0) < -0.005 ? 'Unfavorable' : 'Neutral';

    // Per-pitch FG RV/100 rows
    const fgRowsHtml = fgRows.length ? `
      <div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06)">
        <div style="font-size:.6rem;color:var(--mu);letter-spacing:.06em;margin-bottom:4px">PITCH-BY-PITCH RV/100 (FanGraphs)</div>
        <div style="display:grid;grid-template-columns:60px 1fr 55px;gap:3px 8px;align-items:center">
          <span style="font-size:.58rem;color:var(--dim)">Pitch</span>
          <span style="font-size:.58rem;color:var(--dim)">Usage</span>
          <span style="font-size:.58rem;color:var(--dim);text-align:right">RV/100</span>
          ${fgRows.map(r => {
            const rv = r.batter_rv100 ?? 0;
            const rvCol = rv > 1 ? 'var(--g)' : rv < -1 ? '#ff7070' : 'var(--mu)';
            const barW = Math.min(60, Math.abs(rv) * 10);
            const barCol = rv >= 0 ? 'rgba(0,229,255,.45)' : 'rgba(255,80,80,.45)';
            return `<span style="font-size:.68rem;color:var(--t)">${r.pitch}</span>
              <span style="display:flex;align-items:center;gap:4px">
                <span style="font-size:.64rem;color:var(--dim)">${r.usage_pct}%</span>
                <span style="display:inline-block;width:${barW}px;height:4px;border-radius:2px;background:${barCol}"></span>
              </span>
              <span style="font-size:.7rem;color:${rvCol};text-align:right;font-family:Orbitron,monospace">${rv >= 0 ? '+' : ''}${rv.toFixed(1)}</span>`;
          }).join('')}
        </div>
      </div>` : '';

    const scoresHtml = (fgScore != null || svScore != null) ? `
      <div style="margin-top:6px;display:flex;gap:10px;font-size:.66rem;color:var(--mu)">
        ${fgScore != null ? `<span>FG RV: <strong style="color:${fgScore>=1?'var(--g)':'#ff7070'}">${fgScore.toFixed(3)}</strong></span>` : ''}
        ${svScore != null ? `<span>SV SLG: <strong style="color:${svScore>=1?'var(--g)':'#ff7070'}">${svScore.toFixed(3)}</strong></span>` : ''}
        ${blended != null ? `<span style="opacity:.6">→ blended ${blended.toFixed(3)}</span>` : ''}
      </div>` : '';

    return `
    <div class="section-label">Pitch-Mix Matchup <span style="font-size:.58rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">— arsenal-weighted RV/100</span></div>
    <div style="background:rgba(0,229,255,.03);border:1px solid rgba(0,229,255,.1);border-left:3px solid ${col};border-radius:8px;padding:10px 12px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:.74rem;color:var(--mu)">${label} arsenal matchup</span>
        ${pm != null ? `<span style="font-family:Orbitron,monospace;font-size:.8rem;color:${col}">${sign}${((pm)*100).toFixed(1)}%</span>` : ''}
      </div>
      ${scoresHtml}
      ${pmNote && pmNote !== 'no data' ? `<div style="margin-top:4px;font-size:.64rem;color:var(--mu)">${pmNote}</div>` : ''}
      ${fgRowsHtml}
    </div>`;
  })();

  // ── Why-this-projection drivers (top BATX components) ─────────────────────
  const drivers = (proj && Array.isArray(proj.drivers)) ? proj.drivers : [];
  const driversHtml = drivers.length ? `
    <div class="section-label">Why This Projection <span style="font-size:.58rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">— top contributing factors</span></div>
    <div class="driver-row">
      ${drivers.map(d => {
        const tone = d.contribution > 0 ? 'pos' : 'neg';
        const arrow = d.contribution > 0 ? '▲' : '▼';
        return `<span class="driver-pill ${tone}"><span class="arrow">${arrow}</span>${d.label} <span style="opacity:.7">${(d.contribution*100).toFixed(1)}%</span></span>`;
      }).join('')}
    </div>` : '';

  // ── Model divergence (XGB vs BATX) ────────────────────────────────────────
  const md = (proj && proj.modelDivergence) || {};
  const _relPct  = md.reliability != null ? Math.round(md.reliability * 100) : null;
  const _covPct  = md.coverage    != null ? Math.round(md.coverage    * 100) : null;
  const _relCls  = _relPct == null ? ''
                   : (_relPct >= 75 ? 'v-bet' : (_relPct >= 50 ? 'v-lean' : 'v-fade'));
  const _shrTxt  = (md.shrinkApplied && md.shrinkApplied > 0.02)
                   ? ` · <span class="lbl" title="Blended pulled toward league prior because models disagreed or XGB inputs were thin">↘ shrink ${Math.round(md.shrinkApplied*100)}%</span>`
                   : '';
  const _covTxt  = _covPct == null ? '' : ` · <span class="lbl" title="XGB input coverage — % of key Statcast/FG fields populated">cov ${_covPct}%</span>`;
  const divergenceHtml = md.available ? `
    <div class="div-bar" title="Reliability ${_relPct}% — combines model agreement and XGB input coverage">
      <div>
        <div class="lbl">XGB</div>
        <div class="val">${(md.xgb*100).toFixed(0)}%</div>
      </div>
      <div>
        <div class="lbl" style="text-align:center;margin-bottom:4px">1+ Hit Models · <span class="${md.flagCls}">${md.flagLabel}</span> (Δ${(md.divergence*100).toFixed(0)}pts)${_covTxt}${_shrTxt}</div>
        <div class="mid"><div class="marker" style="left:${Math.min(100,Math.max(0,md.blended*100))}%"></div></div>
        ${_relPct != null ? `<div class="lbl" style="text-align:center;margin-top:4px">Reliability <span class="${_relCls}">${_relPct}%</span></div>` : ''}
      </div>
      <div style="text-align:right">
        <div class="lbl">BATX</div>
        <div class="val">${(md.batx*100).toFixed(0)}%</div>
      </div>
    </div>` : (md.batx != null ? `
    <div class="div-bar" title="XGB hit model unavailable — showing BATX only">
      <div><div class="lbl">XGB</div><div class="val" style="opacity:.4">—</div></div>
      <div>
        <div class="lbl" style="text-align:center;margin-bottom:4px">1+ Hit Models · <span class="v-pass">${md.flagLabel || 'XGB UNAVAILABLE'}</span></div>
        <div class="mid"><div class="marker" style="left:${Math.min(100,Math.max(0,(md.blended||md.batx)*100))}%"></div></div>
      </div>
      <div style="text-align:right"><div class="lbl">BATX</div><div class="val">${(md.batx*100).toFixed(0)}%</div></div>
    </div>` : '');

  // ── Monte Carlo distribution bands ────────────────────────────────────────
  const mcSim = (proj && proj.monteCarlo) || null;
  const mcHtml = mcSim ? `
    <div class="section-label">Monte Carlo · ${mcSim.nPa} PAs vs SP <span style="font-size:.58rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">— ${(mcSim.nSims/1000).toFixed(0)}k sims · 50/75/90 percentile</span></div>
    <div class="mc-strip">
      <div class="mc-cell">
        <div class="v">${mcSim.hits.p50}–${mcSim.hits.p90}</div>
        <div class="l">Hits range</div>
        <div class="b">μ ${mcSim.hits.mean} · P(2+H) ${(mcSim.hits.p_ge_2*100).toFixed(0)}%</div>
      </div>
      <div class="mc-cell">
        <div class="v">${mcSim.tb.p50}–${mcSim.tb.p90}</div>
        <div class="l">TB range</div>
        <div class="b">μ ${mcSim.tb.mean} · P(3+TB) ${(mcSim.tb.p_ge_3*100).toFixed(0)}%</div>
      </div>
      <div class="mc-cell">
        <div class="v">${(mcSim.hr.p_ge_1*100).toFixed(1)}%</div>
        <div class="l">Any HR</div>
        <div class="b">μ ${mcSim.hr.mean.toFixed(2)} HR</div>
      </div>
      <div class="mc-cell">
        <div class="v">${mcSim.k.p_ge_1*100|0}% / ${mcSim.bb.p_ge_1*100|0}%</div>
        <div class="l">K / BB risk</div>
        <div class="b">μ ${mcSim.k.mean.toFixed(2)} K · ${mcSim.bb.mean.toFixed(2)} BB</div>
      </div>
    </div>` : '';

  // ── vs Bullpen slice ──────────────────────────────────────────────────────
  const vsRP = (proj && proj.vsBullpen) || null;
  const vsRpHtml = vsRP ? `
    <div class="section-label">vs Bullpen <span style="font-size:.58rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">— ${vsRP.note}</span></div>
    <div class="prob-row">
      ${probTile(vsRP.probs.hit1, vsRP.expected?.hits, 'H',   '1+ Hit',   'hit1', null)}
      ${probTile(vsRP.probs.tb2,  vsRP.expected?.tb,   'TB',  '2+ TB',    'tb2',  null)}
      ${probTile(vsRP.probs.hr,   vsRP.expected?.hr,   'HR',  'Home Run', 'hr',   null)}
      ${probTile(vsRP.probs.rbi1, vsRP.expected?.rbi,  'RBI', '1+ RBI',   'rbi1', null)}
    </div>` : '';

  // Render layout
  document.getElementById('detailPanel').innerHTML = `
    <div class="bvp-header">
      <div class="bvp-names">
        <div class="bvp-batter">${batterName}</div>
        <div class="bvp-vs">career history vs.</div>
        <div class="bvp-pitcher">${pitcherName}</div>
      </div>
      <div class="grade-badge-wrap">
        <div class="grade-badge ${gbClass}">${grade}</div>
        <div class="grade-basis-lbl">${gradeBasis}</div>
      </div>
    </div>

    ${summary.sample_note ? `<div class="sample-note${summary.is_stale ? ' stale-note' : ''}">${summary.sample_note}</div>` : ''}

    ${(() => {
      const conf = mc.confidence || {};
      if (conf.value == null) return '';
      const confCls = conf.value >= 70 ? 'good' : conf.value >= 40 ? '' : 'bad';
      return `<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;font-size:.66rem;color:var(--mu)">
        <span><strong style="color:var(--c)">Confidence:</strong> <span class="${confCls}">${conf.label||'—'} ${conf.value}/100</span></span>
        <span style="font-size:.6rem">${conf.basis||''}</span>
      </div>`;
    })()}

    ${injuryAlertHtml(batterInjury, batterName)}
    ${injuryAlertHtml(pitcherInjury, pitcherName)}

    ${(() => {
      // H2H sample-size warning: <50 career PA is statistically unreliable.
      // Research: industry threshold is 50–100 PA before BvP is signal vs noise.
      if (pa <= 0 || pa >= 50) return '';
      return `<div class="h2h-sample-warn">
        <span class="warn-icon">⚠</span>
        <span><strong>Small H2H sample (${pa} PA)</strong> — below the 50-PA reliability threshold. Lean on platoon splits (vs ${summary.pitcher_hand === 'L' ? 'LHP' : 'RHP'}) and Statcast quality metrics instead of H2H stats.</span>
      </div>`;
    })()}

    ${buildReasoningSummary(proj, summary, batterName, pitcherName, batterInjury, pitcherInjury)}

    <div class="section-label">
      Career H2H Stats
      ${(mc.bvpFirstSeason && mc.bvpLastSeason)
        ? `<span style="font-size:.58rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">${mc.bvpFirstSeason === mc.bvpLastSeason ? mc.bvpFirstSeason : mc.bvpFirstSeason + '–' + mc.bvpLastSeason}</span>`
        : ''}
    </div>
    <div class="stat-row" style="grid-template-columns:repeat(6,1fr)">
      <div class="stat-box"><div class="stat-val">${pa}</div><div class="stat-lbl">Career PA</div></div>
      <div class="stat-box"><div class="stat-val ${(summary.recent_pa??0) >= 5 ? '' : 'bad'}">${summary.recent_pa??0}</div><div class="stat-lbl">Recent PA</div></div>
      <div class="stat-box"><div class="stat-val">${fmtAvg(summary.avg)}</div><div class="stat-lbl">AVG</div></div>
      <div class="stat-box"><div class="stat-val">${fmtOps(summary.ops)}</div><div class="stat-lbl">OPS</div></div>
      <div class="stat-box"><div class="stat-val">${summary.hr??'—'}</div><div class="stat-lbl">HR</div></div>
      <div class="stat-box"><div class="stat-val" ${ratioColor(summary.ops_ratio)}>${summary.ops_ratio!=null ? Number(summary.ops_ratio).toFixed(2)+'x' : '—'}</div><div class="stat-lbl">OPS Ratio</div></div>
    </div>

    ${(Array.isArray(mc.bvpSeasons) && mc.bvpSeasons.length > 1) ? `
      <details style="margin:6px 0 10px;font-size:.7rem">
        <summary style="cursor:pointer;color:var(--mu);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em">Season breakdown</summary>
        <div style="margin-top:6px;display:grid;grid-template-columns:48px repeat(5,1fr);gap:2px 8px;padding:6px 8px;background:rgba(0,0,0,.18);border-radius:6px">
          <span style="font-size:.6rem;color:var(--mu)">Year</span>
          <span style="font-size:.6rem;color:var(--mu)">PA</span>
          <span style="font-size:.6rem;color:var(--mu)">AB/H</span>
          <span style="font-size:.6rem;color:var(--mu)">HR</span>
          <span style="font-size:.6rem;color:var(--mu)">BB/K</span>
          <span style="font-size:.6rem;color:var(--mu)">AVG</span>
          ${mc.bvpSeasons.map(s => `
            <span>${s.season ?? '—'}</span>
            <span>${s.pa}</span>
            <span>${s.ab}/${s.h}</span>
            <span>${s.hr}</span>
            <span>${s.bb}/${s.so}</span>
            <span>${(s.avg!=null ? s.avg.toFixed(3).replace(/^0/,'') : '—')}</span>
          `).join('')}
        </div>
      </details>` : ''}

    ${xstatsHtml}

    ${pitProfileHtml}

    ${ctxStripHtml}

    ${vsSpHtml}

    ${vsRpHtml}

    ${probHtml}

    ${ensembleHtml}

    ${divergenceHtml}

    ${mcHtml}

    ${driversHtml}

    ${pitchMixHtml}

    ${pkHtml}

    <div class="section-label">Recent Form & Matchup Context</div>
    <div class="context-grid" id="contextGrid">
      <div class="context-card"><div class="context-loading">Loading last 10 games...</div></div>
      <div class="context-card"><div class="context-loading">Loading platoon splits...</div></div>
      <div class="context-card"><div class="context-loading">Loading arsenal matchup...</div></div>
      <div class="context-card"><div class="context-loading">Loading quality metrics...</div></div>
    </div>

    <div class="section-label">Prop Signals <span style="font-size:.6rem;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">— recent form based</span></div>
    <div class="prop-signal-grid" id="propSignalGrid">
      <div class="prop-signal-box"><div class="prop-signal-type">HIT</div><div class="prop-signal-val" style="color:var(--mu)">—</div></div>
      <div class="prop-signal-box"><div class="prop-signal-type">TOTAL BASES</div><div class="prop-signal-val" style="color:var(--mu)">—</div></div>
      <div class="prop-signal-box"><div class="prop-signal-type">HOME RUN</div><div class="prop-signal-val" style="color:var(--mu)">—</div></div>
      <div class="prop-signal-box"><div class="prop-signal-type">K RISK</div><div class="prop-signal-val" style="color:var(--mu)">—</div></div>
    </div>

    <div class="section-label">Last 5 Games</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Pitcher (Team)</th><th>AB/H</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>Score</th>
        </tr></thead>
        <tbody>${gameRows}</tbody>
      </table>
    </div>
  `;

  // Fetch context cards + prop signals (pass proj for quality card)
  loadContextData(batterId, pitcherId, proj);
}

async function loadContextData(batterId, pitcherId, proj) {
  try {
    const [recent, splits, arsenal] = await Promise.all([
      fetch(`/api/player/${batterId}/recent-games`).then(r => r.json()),
      fetch(`/api/player/${batterId}/platoon-splits`).then(r => r.json()),
      fetch(`/api/bvp/${batterId}/${pitcherId}/arsenal`).then(r => r.json()).catch(() => ({}))
    ]);

    const contextGrid = document.getElementById('contextGrid');
    if (!contextGrid) return;

    // Card 1: Last 10 Games + sparkline
    const last10 = recent.last10 || {};
    const opsClass = last10.ops >= 0.800 ? 'good' : last10.ops >= 0.700 ? '' : 'bad';
    const avgClass = last10.avg >= 0.280 ? 'good' : last10.avg >= 0.240 ? '' : 'bad';

    // Build hit-rate sparkline bars from game list
    const sparkGames = (recent.games || []);
    const sparkW = 120, sparkH = 24, barW = Math.max(6, Math.floor(sparkW / Math.max(sparkGames.length, 1)) - 2);
    const sparkBars = sparkGames.map((g, i) => {
      const hasHit = g.hits >= 1;
      const hasHR  = g.hr   >= 1;
      const col = hasHR ? 'var(--g)' : hasHit ? 'rgba(0,229,255,.85)' : 'rgba(255,255,255,.12)';
      const x = i * (barW + 2);
      return `<rect x="${x}" y="${hasHit ? 6 : 14}" width="${barW}" height="${hasHit ? sparkH - 6 : sparkH - 14}" fill="${col}" rx="1"/>`;
    }).join('');
    const sparkSvg = sparkGames.length ? `
      <svg viewBox="0 0 ${sparkGames.length * (barW+2)} ${sparkH}" style="width:100%;height:${sparkH}px;margin-top:6px;display:block">
        ${sparkBars}
      </svg>
      <div style="display:flex;gap:8px;margin-top:3px">
        <span style="font-size:.6rem;color:var(--dim)"><span style="color:rgba(0,229,255,.85)">■</span> Hit</span>
        <span style="font-size:.6rem;color:var(--dim)"><span style="color:var(--g)">■</span> HR</span>
        <span style="font-size:.6rem;color:var(--dim)"><span style="color:rgba(255,255,255,.18)">■</span> 0H</span>
      </div>` : '';

    const card1 = `
      <div class="context-card">
        <div class="context-card-header">
          <span>Last 10 Games</span>
          <span class="context-badge">${last10.games || 0}G</span>
        </div>
        <div class="context-stat-row">
          <span class="context-stat-label">AVG</span>
          <span class="context-stat-value ${avgClass}">${fmtAvg(last10.avg)}</span>
        </div>
        <div class="context-stat-row">
          <span class="context-stat-label">OPS</span>
          <span class="context-stat-value ${opsClass}">${fmtOps(last10.ops)}</span>
        </div>
        <div class="context-stat-row">
          <span class="context-stat-label">HR</span>
          <span class="context-stat-value">${last10.hr || 0}</span>
        </div>
        <div class="context-stat-row">
          <span class="context-stat-label">Hits</span>
          <span class="context-stat-value">${last10.hits || 0}/${last10.ab || 0}</span>
        </div>
        ${sparkSvg}
      </div>
    `;

    // Card 2: Platoon Splits
    const vsLHP = splits.vsLHP || {};
    const vsRHP = splits.vsRHP || {};
    const pitcherHand = arsenal.pitcherHand || 'R';
    const relevantSplit = pitcherHand === 'L' ? vsLHP : vsRHP;
    const otherSplit = pitcherHand === 'L' ? vsRHP : vsLHP;
    
    const card2 = `
      <div class="context-card">
        <div class="context-card-header">
          <span>Platoon Splits</span>
          <span class="context-badge">vs ${pitcherHand}HP</span>
        </div>
        <div class="split-compare">
          <div class="split-box" style="border: 2px solid rgba(0,229,255,.35);">
            <div class="split-label">vs ${pitcherHand}HP</div>
            <div class="split-value">${fmtOps(relevantSplit.ops)}</div>
            <div class="split-sub">${fmtAvg(relevantSplit.avg)} AVG</div>
            <div class="split-sub">${relevantSplit.pa || 0} PA</div>
          </div>
          <div class="split-box">
            <div class="split-label">vs ${pitcherHand === 'L' ? 'R' : 'L'}HP</div>
            <div class="split-value">${fmtOps(otherSplit.ops)}</div>
            <div class="split-sub">${fmtAvg(otherSplit.avg)} AVG</div>
            <div class="split-sub">${otherSplit.pa || 0} PA</div>
          </div>
        </div>
      </div>
    `;

    // Card 3: Pitch Arsenal Breakdown
    // Prefer blended mix score from projection endpoint when available
    const pitches     = arsenal.pitches || [];
    const primaryPitch = arsenal.primaryPitch || '—';
    const projMC      = (proj && proj.matchupContext) || {};
    const mixScore    = projMC.mixScore || arsenal.mixScore || 1.0;
    const mixScoreFg  = projMC.mixScoreFg;
    const mixScoreSv  = projMC.mixScoreSv;
    const mixRowsFg   = Array.isArray(projMC.mixRowsFg) ? projMC.mixRowsFg : [];
    const mixCls = mixScore >= 1.10 ? 'good' : mixScore <= 0.91 ? 'bad' : '';
    const mixLbl = mixScore >= 1.10 ? 'Favorable' : mixScore <= 0.91 ? 'Unfavorable' : 'Neutral';

    function fmtStat(v, dec) {
      if (v == null) return '—';
      return Number(v).toFixed(dec != null ? dec : 3);
    }
    function pitchRatioClass(r) {
