      if (r == null) return '';
      return r >= 1.15 ? 'good' : r <= 0.85 ? 'bad' : '';
    }

    const pitchRows = pitches.slice(0, 5).map(p => {
      const usagePct = p.usage != null ? Math.round(p.usage) + '%' : '—';
      const veloStr  = p.velo  != null ? p.velo.toFixed(1)         : '—';
      const batWoba  = p.bat_woba != null ? fmtStat(p.bat_woba) : (p.pit_woba != null ? `<span style="color:var(--dim)">${fmtStat(p.pit_woba)}</span>` : '—');
      const whiffStr = p.bat_whiff != null ? Math.round(p.bat_whiff) + '%' : (p.pit_whiff != null ? `<span style="color:var(--dim)">${Math.round(p.pit_whiff)}%</span>` : '—');
      const rCls = pitchRatioClass(p.ratio);
      return `<div style="display:grid;grid-template-columns:1fr 28px 42px 44px 44px;gap:2px 4px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)">
        <span style="font-size:.72rem;color:var(--t)">${p.label}</span>
        <span style="font-size:.68rem;color:var(--dim)">${usagePct}</span>
        <span style="font-size:.68rem;color:var(--dim)">${veloStr}</span>
        <span style="font-size:.72rem;color:var(--t)">${batWoba}</span>
        <span style="font-size:.72rem;color:var(--t)" class="${rCls}">${whiffStr}</span>
      </div>`;
    }).join('');

    // Sub-scores line (FG RV + Statcast SLG)
    const mixSubHtml = (mixScoreFg != null || mixScoreSv != null) ? `
      <div style="display:flex;gap:8px;font-size:.62rem;color:var(--dim);margin-bottom:6px;flex-wrap:wrap">
        ${mixScoreFg != null ? `<span>FG RV: <strong style="color:${mixScoreFg>=1?'var(--g)':'#ff7070'}">${mixScoreFg.toFixed(3)}</strong></span>` : ''}
        ${mixScoreSv != null ? `<span>SV SLG: <strong style="color:${mixScoreSv>=1?'var(--g)':'#ff7070'}">${mixScoreSv.toFixed(3)}</strong></span>` : ''}
        <span style="opacity:.5">blended ${mixScore.toFixed(3)}</span>
      </div>` : '';

    // FG per-pitch RV/100 mini table
    const fgCard3Rows = mixRowsFg.length ? `
      <div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06)">
        <div style="font-size:.58rem;color:var(--dim);letter-spacing:.05em;margin-bottom:3px">RV/100 vs PITCH TYPE (FanGraphs)</div>
        ${mixRowsFg.map(r => {
          const rv = r.batter_rv100 ?? 0;
          const rvCol = rv > 1.5 ? 'var(--g)' : rv < -1.5 ? '#ff7070' : 'var(--mu)';
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)">
            <span style="font-size:.66rem;color:var(--t)">${r.pitch}</span>
            <span style="font-size:.6rem;color:var(--dim)">${r.usage_pct}%</span>
            <span style="font-size:.66rem;font-family:Orbitron,monospace;color:${rvCol}">${rv>=0?'+':''}${rv.toFixed(1)}</span>
          </div>`;
        }).join('')}
      </div>` : '';

    const card3 = `
      <div class="context-card">
        <div class="context-card-header">
          <span>Pitch Arsenal</span>
          <span class="context-badge ${mixCls}">${mixLbl} ${mixScore.toFixed(3)}</span>
        </div>
        ${mixSubHtml}
        ${pitches.length ? `
          <div style="display:grid;grid-template-columns:1fr 28px 42px 44px 44px;gap:2px 4px;padding:2px 0 4px;border-bottom:1px solid rgba(255,255,255,.12)">
            <span style="font-size:.62rem;color:var(--dim)">Pitch</span>
            <span style="font-size:.62rem;color:var(--dim)">Use%</span>
            <span style="font-size:.62rem;color:var(--dim)">Velo</span>
            <span style="font-size:.62rem;color:var(--dim)">wOBA</span>
            <span style="font-size:.62rem;color:var(--dim)">Whiff%</span>
          </div>
          ${pitchRows}
          <div style="font-size:.64rem;color:var(--dim);margin-top:6px">wOBA/Whiff% = batter vs pitch type (Statcast)</div>
        ` : `<div class="context-stat-row" style="color:var(--dim);font-size:.75rem;padding:8px 0">No Statcast arsenal data</div>`}
        ${fgCard3Rows}
      </div>
    `;

    // Card 4: Quality Metrics (from projection endpoint)
    const bq = (proj && proj.batterQuality) || {};
    const evVal   = bq.ev    != null ? bq.ev.toFixed(1)    : null;
    const brlVal  = bq.brl_pct != null ? bq.brl_pct.toFixed(1) : null;
    const hhVal   = bq.hh_pct  != null ? bq.hh_pct.toFixed(1)  : null;
    const xwobaVal = bq.xwoba  != null ? bq.xwoba.toFixed(3)           : null;

    function qualRow(label, val, suffix, pctRank) {
      if (val == null) return '';
      const pctStr = pctRank != null ? pctBadge(pctRank) : '';
      const cls = pctRank != null ? pctColor(pctRank) : '';
      return `<div class="context-stat-row">
        <span class="context-stat-label">${label}</span>
        <span class="context-stat-value ${cls}">${val}${suffix}${pctStr}</span>
      </div>`;
    }

    // Card 4: Quality Metrics — Savant preferred, FanGraphs fallback
    const hasSavant = bq.ev != null || bq.xba != null;
    const hasFG     = bq.fg_woba != null || bq.fg_iso != null;

    function fmtPct3(v) { return v != null ? Number(v * 100).toFixed(1) + '%' : '—'; }

    let card4;
    if (hasSavant) {
      card4 = `
        <div class="context-card">
          <div class="context-card-header">
            <span>Quality Metrics</span>
            <span class="context-badge">Statcast</span>
          </div>
          ${qualRow('Exit Velo', evVal, ' mph', bq.ev_pct)}
          ${qualRow('Barrel%', brlVal, '%', bq.brl_pct_rank)}
          ${qualRow('Hard Hit%', hhVal, '%', bq.hh_pct_rank)}
          ${qualRow('xwOBA', xwobaVal, '', bq.xwoba_pct)}
        </div>`;
    } else if (hasFG) {
      const fgWobaClass = bq.fg_woba >= 0.340 ? 'good' : bq.fg_woba >= 0.310 ? '' : 'bad';
      const fgIsoClass  = bq.fg_iso  >= 0.180 ? 'good' : bq.fg_iso  >= 0.120 ? '' : 'bad';
      const fgKClass    = bq.fg_kpct <= 0.180 ? 'good' : bq.fg_kpct <= 0.240 ? '' : 'bad';
      const fgBBClass   = bq.fg_bbpct >= 0.100 ? 'good' : bq.fg_bbpct >= 0.070 ? '' : 'bad';
      card4 = `
        <div class="context-card">
          <div class="context-card-header">
            <span>Quality Metrics</span>
            <span class="context-badge" style="color:var(--y);border-color:rgba(255,215,0,.3)">FanGraphs</span>
          </div>
          <div class="context-stat-row">
            <span class="context-stat-label">wOBA</span>
            <span class="context-stat-value ${fgWobaClass}">${bq.fg_woba != null ? bq.fg_woba.toFixed(3) : '—'}</span>
          </div>
          <div class="context-stat-row">
            <span class="context-stat-label">ISO</span>
            <span class="context-stat-value ${fgIsoClass}">${bq.fg_iso != null ? bq.fg_iso.toFixed(3) : '—'}</span>
          </div>
          <div class="context-stat-row">
            <span class="context-stat-label">K%</span>
            <span class="context-stat-value ${fgKClass}">${fmtPct3(bq.fg_kpct)}</span>
          </div>
          <div class="context-stat-row">
            <span class="context-stat-label">BB%</span>
            <span class="context-stat-value ${fgBBClass}">${fmtPct3(bq.fg_bbpct)}</span>
          </div>
          <div style="font-size:.6rem;color:var(--dim);margin-top:4px">Statcast unavailable — using MLB/FG rates</div>
        </div>`;
    } else {
      card4 = `
        <div class="context-card">
          <div class="context-card-header"><span>Quality Metrics</span></div>
          <div class="context-stat-row" style="color:var(--dim);font-size:.75rem;padding:8px 0">Stats loading…</div>
        </div>`;
    }

    contextGrid.innerHTML = card1 + card2 + card3 + card4;

    // ── Prop Signals ────────────────────────────────────────────────────────
    const propGrid = document.getElementById('propSignalGrid');
    if (!propGrid) return;

    const recentGames = recent.games || [];
    const totalK  = recentGames.reduce((s, g) => s + (g.k  || 0), 0);
    const totalAB = recentGames.reduce((s, g) => s + (g.ab || 0), 0);
    const kRate   = totalAB > 0 ? totalK / totalAB : 0;

    // Consecutive hits streak from game list (most-recent last)
    let streak = 0;
    const revGames = [...recentGames].reverse();
    for (const g of revGames) {
      if (g.hits >= 1) streak++;
      else break;
    }

    const l10 = recent.last10 || {};
    const hitAvg = l10.avg || 0;
    const l10HR  = l10.hr  || 0;
    const l10H   = l10.hits || 0;
    const l10AB  = l10.ab  || 0;

    // HIT signal
    let hitSig, hitCls, hitSub;
    if (hitAvg >= 0.340 || streak >= 5)         { hitSig = '🔥 HOT';    hitCls = 'sig-strong'; hitSub = `${streak}G streak · .${Math.round(hitAvg*1000)} AVG`; }
    else if (hitAvg >= 0.280 || streak >= 3)    { hitSig = '↑ HEATING'; hitCls = 'sig-mod';    hitSub = `${streak}G streak · .${Math.round(hitAvg*1000)} AVG`; }
    else if (hitAvg >= 0.240)                   { hitSig = '→ NEUTRAL'; hitCls = 'sig-lean';   hitSub = `.${Math.round(hitAvg*1000)} AVG L10`; }
    else                                         { hitSig = '❄ COLD';   hitCls = 'sig-fade';   hitSub = `.${Math.round(hitAvg*1000)} AVG L10`; }

    // TOTAL BASES signal (combine avg + HR rate)
    const hPerAB = l10AB > 0 ? l10H / l10AB : 0;
    let tbSig, tbCls, tbSub;
    if (l10HR >= 4 || hPerAB > 0.370)          { tbSig = '🔥 SURGE';  tbCls = 'sig-strong'; tbSub = `${l10HR} HR · .${Math.round(hPerAB*1000)} H/AB`; }
    else if (l10HR >= 2 || hPerAB > 0.290)     { tbSig = '↑ SOLID';  tbCls = 'sig-mod';    tbSub = `${l10HR} HR · .${Math.round(hPerAB*1000)} H/AB`; }
    else if (hPerAB > 0.230)                   { tbSig = '→ LEAN';   tbCls = 'sig-lean';   tbSub = `${l10HR} HR · .${Math.round(hPerAB*1000)} H/AB`; }
    else                                        { tbSig = '↓ WEAK';   tbCls = 'sig-fade';   tbSub = `${l10HR} HR · .${Math.round(hPerAB*1000)} H/AB`; }

    // HOME RUN signal
    let hrSig, hrCls, hrSub;
    if (l10HR >= 4)                             { hrSig = '🔥 ON FIRE'; hrCls = 'sig-strong'; hrSub = `${l10HR} HR last 10G`; }
    else if (l10HR >= 2)                        { hrSig = '↑ IN FORM'; hrCls = 'sig-mod';    hrSub = `${l10HR} HR last 10G`; }
    else if (l10HR >= 1)                        { hrSig = '→ LEAN';   hrCls = 'sig-lean';   hrSub = `${l10HR} HR last 10G`; }
    else                                        { hrSig = '↓ COLD';   hrCls = 'sig-fade';   hrSub = `0 HR last ${l10.games||10}G`; }

    // K RISK (batter K rate — high = pitcher K prop target)
    let kSig, kCls, kSub;
    if (kRate >= 0.32)                          { kSig = 'HIGH K RISK'; kCls = 'sig-fade';   kSub = `${Math.round(kRate*100)}% K rate`; }
    else if (kRate >= 0.22)                     { kSig = 'MODERATE';    kCls = 'sig-lean';   kSub = `${Math.round(kRate*100)}% K rate`; }
    else if (kRate >= 0.12)                     { kSig = 'LOW RISK';    kCls = 'sig-mod';    kSub = `${Math.round(kRate*100)}% K rate`; }
    else if (totalAB > 0)                       { kSig = 'CONTACT';     kCls = 'sig-strong'; kSub = `${Math.round(kRate*100)}% K rate`; }
    else                                        { kSig = '—';           kCls = '';            kSub = 'Insufficient data'; }

    propGrid.innerHTML = `
      <div class="prop-signal-box">
        <div class="prop-signal-type">HIT (1+H)</div>
        <div class="prop-signal-val ${hitCls}">${hitSig}</div>
        <div class="prop-signal-sub">${hitSub}</div>
      </div>
      <div class="prop-signal-box">
        <div class="prop-signal-type">TOTAL BASES</div>
        <div class="prop-signal-val ${tbCls}">${tbSig}</div>
        <div class="prop-signal-sub">${tbSub}</div>
      </div>
      <div class="prop-signal-box">
        <div class="prop-signal-type">HOME RUN</div>
        <div class="prop-signal-val ${hrCls}">${hrSig}</div>
        <div class="prop-signal-sub">${hrSub}</div>
      </div>
      <div class="prop-signal-box">
        <div class="prop-signal-type">K RISK</div>
        <div class="prop-signal-val ${kCls}">${kSig}</div>
        <div class="prop-signal-sub">${kSub}</div>
      </div>
    `;

  } catch(err) {
    console.error('Context data failed:', err);
    const contextGrid = document.getElementById('contextGrid');
    if (contextGrid) {
      contextGrid.innerHTML = '<div class="context-card"><div style="color:var(--r);padding:12px;text-align:center">Failed to load context data</div></div>';
    }
  }
}
async function loadBatterBadges(batters) {
  for (const b of batters) {
    try {
      const r = await fetch(`/api/player/${b.id}/performance-badges`);
      const data = await r.json();
      const badgeEl = document.getElementById(`badges_${b.id}`);
      if (badgeEl && data.badges && data.badges.length) {
        badgeEl.innerHTML = data.badges.slice(0, 2).map(badge => 
          `<span class="perf-badge perf-${badge.color}" title="${badge.props.join(', ')}">${badge.label}</span>`
        ).join('');
      }
    } catch(e) { console.error('Badge fetch failed:', e); }
  }
}

async function loadPitcherBadge(pitcherId, elementId) {
  try {
    const r = await fetch(`/api/pitcher/${pitcherId}/performance-badges`);
    const data = await r.json();
    const el = document.getElementById(elementId);
    if (el && data.badges && data.badges.length) {
      const badgeHtml = data.badges.slice(0, 1).map(badge =>
        `<span class="perf-badge perf-${badge.color}" style="margin-left:6px" title="${badge.props.join(', ')}">${badge.label}</span>`
      ).join('');
      el.innerHTML += badgeHtml;
    }
  } catch(e) { console.error('Pitcher badge failed:', e); }
}

loadGames();
</script>
