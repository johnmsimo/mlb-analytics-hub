<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB Picks</title>
<style>:root{color-scheme:dark;--bg:#050a18;--card:#0a1628;--line:rgba(0,229,255,.18);--text:#e0f0ff;--muted:#7895b2;--cyan:#00e5ff;--green:#00e676;--orange:#ffb300}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.eyebrow{color:var(--cyan);font:700 11px monospace;letter-spacing:2px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.refresh{border:1px solid var(--line);background:#0c2036;color:var(--cyan);border-radius:8px;padding:9px 12px}.audit{border:1px solid rgba(0,229,255,.2);background:#071b2d;border-radius:9px;padding:9px 10px;margin:0 0 12px;color:var(--muted);font:11px monospace;line-height:1.5}.state{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;color:var(--muted)}.pick{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.pickhead{display:flex;justify-content:space-between;gap:10px}.market{color:var(--muted);font:11px monospace;letter-spacing:1px}.grade{color:var(--green);font:700 11px monospace}.selection{font-size:18px;font-weight:750;margin:11px 0 4px}.price{color:var(--cyan);font-family:monospace}.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.metric{border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 7px;color:var(--muted);font:11px monospace}.metric b{color:var(--text)}.why{color:var(--text);font-size:13px;line-height:1.4}.risk{color:var(--orange);font-size:12px;margin-top:8px}.foot{color:var(--muted);font-size:11px;margin-top:12px}</style></head><body><main><div class="top"><div><div class="eyebrow">MLB ANALYTICS HUB · PICKS</div><div class="sub">One validated shortlist for today</div></div><button class="refresh" onclick="load()">Refresh</button></div><div id="app" class="state">Loading validated picks…</div></main><script>
async function load(){const el=document.getElementById('app');el.className='state';el.textContent='Loading validated picks…';try{const r=await fetch('/api/picks/today');const d=await r.json();if(!d.success)throw Error(d.error||'Unavailable');const audit=d.evidenceAudit||{};const shown=audit.displayedCount!=null?audit.displayedCount:d.picks.length;const accepted=audit.acceptedCount||0;const rejected=audit.rejectedCount||0;const rejectionText=Object.entries(audit.rejectionReasons||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(function(item){return item[1]+'× '+item[0]}).join(' · ');const withheld=audit.withheldCount||0;const capText=withheld?' · '+withheld+' held by cap':'';const ranked=audit.rankedCandidateCount!=null?audit.rankedCandidateCount:accepted;const rankingVersion=audit.rankingVersion?' · ranking v'+audit.rankingVersion:'';const rankingText=audit.rankingMethod?' · ranked '+ranked+' · '+audit.rankingMethod+rankingVersion:'';const auditHtml='<div class="audit">Evidence audit: '+shown+' shown · '+accepted+' validated · '+rejected+' rejected'+capText+rankingText+(rejectionText?' · '+rejectionText:'')+'</div>';if(!d.picks.length){el.innerHTML=auditHtml+'<b>No actionable picks</b><br><span> '+d.message+'</span>';return}el.className='';el.innerHTML=auditHtml+d.picks.map((p,i)=>{const prob=Number(p.probabilityPct??p.modelProbabilityPct??p.blendedProb??0);const edge=Number(p.edgePct??p.estimatedEdgePct??p.edge??0);const price=p.price??p.bestAvailablePrice??p.marketPrice;const name=p.player||p.team||'Game pick';const side=p.recommendedSide||p.side||'';const line=p.line!=null?' '+p.line:'';const book=p.book||p.bestAvailableBook||'';const reasons=(p.topReasons||p.supportingEvidence||[]);const why=typeof reasons[0]==='string'?reasons[0]:(reasons[0]||{}).label||p.decisionSummary||'Validated model and market evidence.';const risk=(p.topRisks||[])[0];const clv=p.clvProvenance||{status:'unverified'};const evidence=p.evidence||{};const evidenceCheck=p.evidenceIntegrity||{status:'unverified'};const selection=p.selectionAudit||{};return '<article class="pick"><div class="pickhead"><span class="market">#'+(i+1)+' · '+(p.categoryLabel||p.intelligenceCategory||'PLAY')+'</span><span class="grade">'+(p.recommendationGrade||'PLAY')+'</span></div><div class="selection">'+name+' · '+side+line+' <span class="price">'+(price!=null?(Number(price)>0?'+':'')+price:'No price')+(book?' · '+book:'')+'</span></div><div class="metrics"><span class="metric">RANK <b>#'+(selection.rank||i+1)+'</b></span><span class="metric">WIN <b>'+prob.toFixed(1)+'%</b></span><span class="metric">EDGE <b>'+(edge>=0?'+':'')+edge.toFixed(1)+'%</b></span><span class="metric">CONF <b>'+Number(p.confidenceScore||p.modelReliabilityScore||0).toFixed(0)+'</b></span><span class="metric">LINEUP <b>'+(p.lineupStatus||'Checked')+'</b></span><span class="metric">CLV <b style="color:'+(clv.status==='verified'?'var(--green)':clv.status==='rejected'?'var(--orange)':'var(--muted)')+'">'+(clv.edge!=null?((Number(clv.edge)>=0?'+':'')+(Number(clv.edge)*100).toFixed(1)+'%'):clv.status)+'</b></span><span class="metric">EVIDENCE <b style="color:'+(evidenceCheck.status==='verified'?'var(--green)':'var(--orange)')+'">'+evidenceCheck.status+'</b></span></div><div class="why">'+why+'</div>'+(risk?'<div class="risk">⚠ '+risk+'</div>':'')+'<div class="foot">'+(p.freshnessSeconds!=null?'Price age '+Math.round(Number(p.freshnessSeconds)/60)+'m · ':'')+(p.gameSimN?'Simulation '+Number(p.gameSimN).toLocaleString()+' trials':'')+(clv.source?' · CLV source '+clv.source:'')+(evidence.market?' · Evidence '+evidence.market:'')+(evidenceCheck.status?' · Evidence status '+evidenceCheck.status:'')+(selection.rank?' · Selection rank '+selection.rank:'')+'</div></article>'}).join('')}catch(e){el.textContent='Picks unavailable: '+e.message}}load();</script></body></html>
