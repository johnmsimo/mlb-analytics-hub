<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Analytics Hub - Cheatsheets</title>
<style>
:root {
  --bg:#070d18; --card:#101a2a; --card2:#0b1322; --b:#223149;
  --t:#dfe9ff; --mu:#8ea4c8; --c:#00e5ff; --g:#00e676; --o:#ff9800; --r:#ff5252;
  --gold:#f5c542; --dim:#1a2840;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 10% 0%,#0f1d36,transparent 45%),var(--bg);color:var(--t);font-family:'Segoe UI',Arial,sans-serif;min-height:100dvh}
.wrap{max-width:1400px;margin:0 auto;padding:16px}

/* ── Top bar ── */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-weight:700;letter-spacing:.08em;font-size:1rem}
.sub{color:var(--mu);font-size:.78rem;margin-top:2px}
.btn{border:1px solid rgba(0,229,255,.35);background:rgba(0,229,255,.08);color:var(--c);padding:7px 12px;border-radius:10px;cursor:pointer;font-size:.78rem;transition:background .15s}
.btn:hover{background:rgba(0,229,255,.16)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
a.toplink{color:var(--c);text-decoration:none;font-size:.82rem}

/* ── Tabs ── */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--b);background:rgba(255,255,255,.03);color:var(--mu);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.8rem;transition:all .15s}
.tab.on{color:var(--c);border-color:rgba(0,229,255,.45);background:rgba(0,229,255,.12)}

/* ── Panels ── */
.panel{display:none;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--b);border-radius:14px;padding:14px}
.panel.on{display:block}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:.75rem;margin-bottom:12px}
.pill{display:inline-block;border:1px solid rgba(0,229,255,.3);border-radius:999px;padding:2px 9px;font-size:.7rem;color:var(--c)}

/* ── Tables ── */
.tbl-wrap{overflow:auto;border:1px solid var(--b);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:960px}
th,td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.8rem;text-align:left;white-space:nowrap}
th{font-size:.68rem;letter-spacing:.07em;color:var(--mu);background:rgba(0,0,0,.25);text-transform:uppercase}
tr:hover td{background:rgba(0,229,255,.03)}
.good{color:var(--g)} .warn{color:var(--o)} .bad{color:var(--r)}
.empty{padding:28px;text-align:center;color:var(--mu);font-size:.85rem}

/* ════════════════════════════════════════════
   PITCHER WEAKSPOTS — game-grouped layout
   ════════════════════════════════════════════ */

/* Game group wrapper */
.game-group{margin-bottom:26px}

/* Game header banner */
.game-header{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(90deg,rgba(0,229,255,.09),rgba(0,229,255,.02));
  border:1px solid rgba(0,229,255,.22);border-radius:12px;
  padding:10px 16px;margin-bottom:12px;
}
.gh-vs{font-size:.78rem;color:var(--mu);font-weight:400}
.gh-away,.gh-home{font-weight:800;font-size:.95rem;color:var(--t);letter-spacing:.05em}
.gh-away{color:var(--c)}
.gh-divider{color:var(--mu);font-size:.85rem;margin:0 2px}
.gh-time{
  font-size:.75rem;color:var(--gold);font-weight:600;
  border:1px solid rgba(245,197,66,.3);border-radius:999px;padding:2px 10px;
  margin-left:auto;
}
.gh-count{font-size:.72rem;color:var(--mu)}

/* Two-column pitcher pair grid */
.pitcher-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.pitcher-pair{grid-template-columns:1fr}}

/* ── Individual pitcher card ── */
.ws-card{
  border:1px solid var(--b);border-radius:12px;
  background:rgba(255,255,255,.025);padding:14px;
  display:flex;flex-direction:column;gap:5px;
}
.ws-card:hover{border-color:rgba(0,229,255,.28);background:rgba(0,229,255,.03)}

/* Card header */
.ws-card-header{display:flex;align-items:center;margin-bottom:6px;gap:6px;flex-wrap:wrap}
.ws-pitcher-name{font-weight:700;font-size:.88rem;color:var(--c)}
.ws-pitcher-team{font-weight:400;font-size:.82rem;color:var(--mu)}
.ws-role-badge{
  font-size:.65rem;letter-spacing:.07em;text-transform:uppercase;
  background:rgba(0,229,255,.1);color:var(--c);
  border:1px solid rgba(0,229,255,.25);border-radius:999px;padding:1px 7px;
}

/* Row: label / value */
.ws-row{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;gap:8px;padding:2px 0}
.ws-label{color:var(--mu);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.ws-val{text-align:right;font-size:.78rem}
.ws-divider{border-top:1px solid rgba(255,255,255,.06);margin:7px 0}

/* Batter targets */
.ws-section-label{font-size:.65rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin-bottom:5px}
.ws-batter{display:flex;align-items:baseline;gap:6px;font-size:.76rem;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.ws-batter:last-child{border-bottom:none}
.ws-slot{color:var(--c);font-weight:700;font-size:.72rem;min-width:38px;flex-shrink:0}
.ws-bname{color:var(--t);font-weight:600;flex:1}
.ws-bstats{color:var(--mu);font-size:.7rem;white-space:nowrap}
.ws-bscore{font-size:.7rem;color:var(--g);font-weight:600;white-space:nowrap}

/* K-Prop box */
.ws-kprop{
  background:rgba(0,229,255,.06);
  border:1px solid rgba(0,229,255,.18);
  border-radius:8px;padding:8px 10px;font-size:.76rem;margin:4px 0;
}
.ws-kprop-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ws-kprop-badge{font-size:.65rem;font-weight:700;background:rgba(0,229,255,.15);color:var(--c);border-radius:999px;padding:1px 7px;letter-spacing:.06em;text-transform:uppercase}
.ws-kprop-line{font-size:.82rem;font-weight:700;color:var(--t)}
.ws-kprop-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--mu)}
.ws-kprop-stats strong{color:var(--t)}

/* Rec + Reasoning */
.ws-rec{font-size:.78rem;font-weight:700;color:var(--o);padding:3px 0;line-height:1.35}
.ws-reason{font-size:.7rem;color:var(--mu);line-height:1.45;padding:2px 0}

/* Parlay button */
.ws-parlay-btn{
  margin-top:8px;width:100%;
  border:1px solid rgba(0,229,255,.3);background:rgba(0,229,255,.07);
  color:var(--c);padding:7px;border-radius:8px;cursor:pointer;font-size:.78rem;
  transition:background .15s;
}
.ws-parlay-btn:hover{background:rgba(0,229,255,.15)}

/* No-game empty state */
.no-games{padding:40px;text-align:center;color:var(--mu);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">

  <!-- Top bar -->
  <div class="top">
    <div>
      <div class="brand">MLB ANALYTICS HUB - CHEATSHEETS</div>
      <div class="sub" id="statusText">Loading today's cheatsheets...</div>
    </div>
    <div class="actions">
      <a class="toplink" href="/">Dashboard</a>
      <a class="toplink" href="/props">Props</a>
      <a class="toplink" href="/tracker">Tracker</a>
      <button class="btn" onclick="exportTracker('csv')">Export CSV</button>
      <button class="btn" onclick="exportTracker('pdf')">Export PDF</button>
      <button class="btn" id="refreshBtn" onclick="loadData(true)">Refresh</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab on"  data-tab="hits"      onclick="switchTab('hits',this)">Hits Board</button>
    <button class="tab"     data-tab="matchups"  onclick="switchTab('matchups',this)">Batting Order Matchups</button>
    <button class="tab"     data-tab="weakspots" onclick="switchTab('weakspots',this)">Pitcher Weakspots</button>
  </div>

  <!-- HITS BOARD -->
  <section class="panel on" id="panel-hits">
    <div class="meta" id="hitsMeta"></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Player</th><th>Team</th><th>Slot</th><th>Matchup</th><th>vs Hand</th>
          <th>L10 %</th><th>BvP</th><th>Hub</th><th>EV %</th><th></th>
        </tr></thead>
        <tbody id="hitsBody"></tbody>
      </table>
    </div>
  </section>

  <!-- BATTING ORDER MATCHUPS -->
  <section class="panel" id="panel-matchups">
    <div class="meta" id="matchMeta"></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Game</th><th>Rank</th><th>Player</th><th>Team</th><th>Slot</th>
          <th>Score</th><th>BvP</th><th>L10 %</th><th>Hub</th><th></th>
        </tr></thead>
        <tbody id="matchBody"></tbody>
      </table>
    </div>
  </section>

  <!-- PITCHER WEAKSPOTS — grouped by game, sorted by time -->
  <section class="panel" id="panel-weakspots">
    <div class="meta" id="weakMeta"></div>
    <div id="weakGrid"></div>
  </section>

</div><!-- .wrap -->

<script>
let DATA = null;

/* ── utils ── */
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pct(v){ return v==null||isNaN(v)?'—':(Number(v)*100).toFixed(1)+'%'; }
function num(v,d=2){ return v==null||isNaN(v)?'—':Number(v).toFixed(d); }
function l10Class(v){ const n=Number(v)||0; return n>0.62?'good':n>0.52?'warn':'bad'; }
function formClass(label){
  if(!label) return '';
  if(label.includes('DEALING')) return 'good';
  if(label.includes('STRUGGLING')) return 'bad';
  return 'warn';
}

/* ── tab switching ── */
function switchTab(name,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('panel-'+name).classList.add('on');
  btn.classList.add('on');
}

/* ── today in ET ── */
function etToday(){
  const d=new Date().toLocaleDateString('en-US',{timeZone:'America/New_York'});
  const [m,dy,y]=d.split('/');
  return `${y}-${m.padStart(2,'0')}-${dy.padStart(2,'0')}`;
}

/* ── export ── */
function exportTracker(format){
  window.location.href=`/api/tracker/export/${etToday()}?format=${format.toLowerCase()}`;
}

/* ════════════════════════════════════════════
   HITS BOARD
   ════════════════════════════════════════════ */
function renderHits(rows){
  const body=document.getElementById('hitsBody');
  const meta=document.getElementById('hitsMeta');
  if(!rows||!rows.length){
    body.innerHTML=`<tr><td colspan="10" class="empty">No hits cheatsheet rows available.</td></tr>`;
    meta.innerHTML=''; return;
  }
  const games=new Set(rows.map(r=>r.gamePk)).size;
  meta.innerHTML=`<span class="pill">${rows.length} Rows</span><span class="pill">${games} Games</span><span class="pill">Sorted by HUB</span>`;
  body.innerHTML=rows.map((r,idx)=>`<tr>
    <td>${esc(r.player)}</td>
    <td>${esc(r.team)}</td>
    <td>${esc(r.slot)}</td>
    <td>${esc(r.matchup)}</td>
    <td>${esc(r.vsHand)}</td>
    <td class="${l10Class(r.l10Pct)}">${pct(r.l10Pct)}</td>
    <td>${esc(r.bvpGrade)}</td>
    <td>${r.hubRating??'—'}</td>
    <td class="${(r.evPct||0)>0?'good':'bad'}">${num(r.evPct,1)}</td>
    <td><button class="btn" onclick="addHitsRowToParlay(${idx})">+ Parlay</button></td>
  </tr>`).join('');
}

/* ════════════════════════════════════════════
   BATTING ORDER MATCHUPS
   ════════════════════════════════════════════ */
function renderMatchups(rows){
  const body=document.getElementById('matchBody');
  const meta=document.getElementById('matchMeta');
  if(!rows||!rows.length){
    body.innerHTML=`<tr><td colspan="10" class="empty">No matchup rows available.</td></tr>`;
    meta.innerHTML=''; return;
  }
  const games=new Set(rows.map(r=>r.matchup)).size;
  meta.innerHTML=`<span class="pill">${games} Games</span><span class="pill">${rows.length} Rows</span>`;
  body.innerHTML=rows.map((r,idx)=>`<tr>
    <td>${esc(r.matchup)}</td>
    <td>${esc(r.rank)}</td>
    <td>${esc(r.player)}</td>
    <td>${esc(r.team)}</td>
    <td>${esc(r.slot)}</td>
    <td>${num(r.matchupScore,1)}</td>
    <td>${esc(r.bvpGrade)}</td>
    <td class="${l10Class(r.l10Pct)}">${pct(r.l10Pct)}</td>
    <td>${r.hubRating??'—'}</td>
    <td><button class="btn" onclick="addMatchupRowToParlay(${idx})">+ Parlay</button></td>
  </tr>`).join('');
}

/* ════════════════════════════════════════════
   PITCHER WEAKSPOTS — game-grouped
   ════════════════════════════════════════════ */

/* Parse gameTime string → sortable ms value */
function parseGameTime(gameTime){
  if(!gameTime) return 9999999999999;
  // Try ISO
  const iso=new Date(gameTime);
  if(!isNaN(iso)) return iso.getTime();
  // Try "H:MM AM/PM ET"
  const m=String(gameTime).match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(m){
    let h=parseInt(m[1]), min=parseInt(m[2]), ampm=m[3].toUpperCase();
    if(ampm==='PM'&&h!==12) h+=12;
    if(ampm==='AM'&&h===12) h=0;
    return h*60+min;
  }
  return 9999999999999;
}

/* Build a pitcher card */
function buildPitcherCard(c, idx){
  // Batter targets
  const batters=c.topBatters||[];
  const battersHtml=batters.length
    ? `<div class="ws-section-label">Top Batter Targets</div>`
      +batters.map(b=>`
        <div class="ws-batter">
          <span class="ws-slot">Slot ${esc(b.slot)}</span>
          <span class="ws-bname">${esc(b.name)}</span>
          <span class="ws-bstats">${b.avg&&b.avg!=='---'?'AVG '+esc(b.avg):''} ${b.woba&&b.woba!=='---'?'wOBA '+esc(b.woba):''}</span>
          <span class="ws-bscore">${b.score!=null?num(b.score,1):''}</span>
        </div>`).join('')
    : '';

  // Weakspot slots row
  const slotsRow=`<div class="ws-row">
    <span class="ws-label">Weakspot Slots</span>
    <span class="ws-val">${esc(c.weakSlots)}</span>
  </div>`;

  // K-Prop (DEALING pitchers only)
  const kp=c.kProp;
  const showK=c.formLabel&&c.formLabel.includes('DEALING')&&kp&&kp.line;
  const kHtml=showK?`
    <div class="ws-kprop">
      <div class="ws-kprop-header">
        <span class="ws-kprop-badge">⚡ K Prop</span>
        <span class="ws-kprop-line">Over ${esc(kp.line)} Ks</span>
      </div>
      <div class="ws-kprop-stats">
        ${kp.k9Blended!=null?`<span><strong>K/9</strong> ${num(kp.k9Blended,1)} blended</span>`:''}
        ${kp.xfip!=null?`<span><strong>xFIP:</strong> ${num(kp.xfip,2)}</span>`:''}
        ${kp.recentKPerStart!=null?`<span><strong>${num(kp.recentKPerStart,1)} K/start</strong> recent</span>`:''}
      </div>
    </div>` : '';

  const reasonHtml=c.parlayReasoning
    ?`<div class="ws-reason">${esc(c.parlayReasoning)}</div>`:'' ;

  return `
    <div class="ws-card">
      <div class="ws-card-header">
        <span class="ws-pitcher-name">${esc(c.pitcherName)}</span>
        <span class="ws-pitcher-team">(${esc(c.team)})</span>
        ${c.role?`<span class="ws-role-badge">${esc(c.role)}</span>`:''}
      </div>
      <div class="ws-row">
        <span class="ws-label">Pitch Vuln</span>
        <span class="ws-val">${esc(c.pitchVulnerability)}</span>
      </div>
      <div class="ws-row">
        <span class="ws-label">Form</span>
        <span class="ws-val ${formClass(c.formLabel)}">${esc(c.formLabel)}</span>
      </div>
      <div class="ws-divider"></div>
      ${battersHtml}
      ${slotsRow}
      ${kHtml}
      <div class="ws-divider"></div>
      <div class="ws-rec">${esc(c.recommendation)}</div>
      ${reasonHtml}
      <button class="ws-parlay-btn" onclick="addWeakspotToParlay(${idx})">+ Parlay</button>
    </div>`;
}

function renderWeakspots(cards){
  const wrap=document.getElementById('weakGrid');
  const meta=document.getElementById('weakMeta');

  if(!cards||!cards.length){
    wrap.innerHTML=`<div class="no-games">No pitcher weakspot cards available.</div>`;
    meta.innerHTML=''; return;
  }

  meta.innerHTML=`<span class="pill">${cards.length} Pitchers</span>`;

  // ── Group by matchup (e.g. "ATH @ PHI") ──
  const groups={};      // matchup → [{card, idx}]
  const groupTime={};   // matchup → gameTime string
  const groupPk={};     // matchup → gamePk

  cards.forEach((c,idx)=>{
    const key=(c.matchup||'Unknown Game').trim();
    if(!groups[key]) groups[key]=[];
    groups[key].push({card:c, idx});
    if(c.gameTime) groupTime[key]=c.gameTime;
    if(c.gamePk)   groupPk[key]=c.gamePk;
  });

  // ── Sort matchup keys by game time ──
  const sortedKeys=Object.keys(groups).sort((a,b)=>
    parseGameTime(groupTime[a]) - parseGameTime(groupTime[b])
  );

  // ── Build HTML ──
  let html='';
  sortedKeys.forEach(key=>{
    const pair=groups[key];
    const timeLabel=groupTime[key]||'';

    // Parse "AWAY @ HOME" from matchup string
    const parts=key.split(/\s*[@vs]\s*/i);
    const awayStr=(parts[0]||key).trim();
    const homeStr=(parts[1]||'').trim();
    const matchupLabel=homeStr
      ? `<span class="gh-away">${esc(awayStr)}</span><span class="gh-divider"> @ </span><span class="gh-home">${esc(homeStr)}</span>`
      : `<span class="gh-away">${esc(key)}</span>`;

    html+=`
      <div class="game-group">
        <div class="game-header">
          ${matchupLabel}
          ${timeLabel?`<span class="gh-time">${esc(timeLabel)}</span>`:''}
          <span class="gh-count">${pair.length} pitcher${pair.length!==1?'s':''}</span>
        </div>
        <div class="pitcher-pair">
          ${pair.map(({card,idx})=>buildPitcherCard(card,idx)).join('')}
        </div>
      </div>`;
  });

  wrap.innerHTML=html;
}

/* ════════════════════════════════════════════
   PARLAY HANDLERS
   ════════════════════════════════════════════ */
function addHitsRowToParlay(idx){
  if(!DATA?.hitsBoard?.rows) return;
  const r=DATA.hitsBoard.rows[idx]; if(!r) return;
  addLegToParlay({player:r.player,marketKey:'batter_hits',line:r.line||0.5,gamePk:r.gamePk,team:r.team,recommendedSide:'Over',savedAt:Date.now(),source:'cheatsheet-hits'});
}
function addMatchupRowToParlay(idx){
  if(!DATA?.battingOrderMatchups?.rows) return;
  const r=DATA.battingOrderMatchups.rows[idx]; if(!r) return;
  addLegToParlay({player:r.player,marketKey:'batter_hits',line:r.line||0.5,gamePk:r.gamePk,team:r.team,recommendedSide:'Over',savedAt:Date.now(),source:'cheatsheet-matchups'});
}
function addWeakspotToParlay(idx){
  if(!DATA?.pitcherWeakspots?.cards) return;
  const c=DATA.pitcherWeakspots.cards[idx]; if(!c) return;
  const kp=c.kProp;
  const isDealing=c.formLabel&&c.formLabel.includes('DEALING');
  addLegToParlay({
    player:c.pitcherName,
    marketKey:isDealing?'pitcher_strikeouts':'pitcher_hits_allowed',
    line:isDealing?(kp?.line||5.5):(c.line||4.5),
    gamePk:c.gamePk,team:c.team,
    recommendedSide:'Over',savedAt:Date.now(),
    source:'cheatsheet-weakspots',reasoning:c.parlayReasoning
  });
}

function addLegToParlay(leg){
  try{
    let legs=[];
    try{legs=JSON.parse(localStorage.getItem('pendingParlayLegs'))||[];}catch(e){}
    legs.push(leg);
    localStorage.setItem('pendingParlayLegs',JSON.stringify(legs));
    window.location.href='/tracker';
  }catch(e){alert('Failed to add to parlay: '+e.message);}
}

/* ════════════════════════════════════════════
   DATA LOAD
   ════════════════════════════════════════════ */
async function loadData(force){
  const btn=document.getElementById('refreshBtn');
  const status=document.getElementById('statusText');
  btn.disabled=true;
  status.textContent='Loading cheatsheets...';
  try{
    const r=await fetch(`/api/cheatsheets/today${force?'?refresh=1':''}`);
    const d=await r.json();
    if(!d.success) throw new Error(d.error||'Failed to load');
    DATA=d;
    renderHits(d.hitsBoard?.rows);
    renderMatchups(d.battingOrderMatchups?.rows);
    renderWeakspots(d.pitcherWeakspots?.cards);
    if(d.computing){
      status.textContent=d.message||'Computing... retrying in 5s';
      setTimeout(()=>loadData(false),5000);
    } else {
      status.textContent=`Updated ${d.generatedAt||'now'} · cache age ${d.cacheAgeSec||0}s`;
    }
  }catch(e){
    status.textContent='Error: '+e.message;
  }finally{
    btn.disabled=false;
  }
}

loadData(false);
</script>
</body>
</html>
