<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLB Analytics Hub - Cheatsheets</title>
  <style>
    :root{--bg:#070d18;--card:#101a2a;--card2:#0b1322;--b:#223149;--t:#dfe9ff;--mu:#8ea4c8;--c:#00e5ff;--g:#00e676;--o:#ff9800;--r:#ff5252;--gold:#f5c542}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 10% 0%,#0f1d36,transparent 45%),var(--bg);color:var(--t);font-family:Segoe UI,Arial,sans-serif}
    .wrap{max-width:1400px;margin:0 auto;padding:18px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .brand{font-weight:700;letter-spacing:.08em}
    .sub{color:var(--mu);font-size:.85rem}
    .btn{border:1px solid rgba(0,229,255,.35);background:rgba(0,229,255,.08);color:var(--c);padding:8px 12px;border-radius:10px;cursor:pointer}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .tab{border:1px solid var(--b);background:rgba(255,255,255,.03);color:var(--mu);padding:8px 12px;border-radius:999px;cursor:pointer}
    .tab.on{color:var(--c);border-color:rgba(0,229,255,.45);background:rgba(0,229,255,.12)}
    .panel{display:none;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--b);border-radius:14px;padding:14px}
    .panel.on{display:block}
    .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:.8rem;margin-bottom:10px}
    .tbl-wrap{overflow:auto;border:1px solid var(--b);border-radius:10px}
    table{width:100%;border-collapse:collapse;min-width:980px}
    th,td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-size:.82rem;text-align:left;white-space:nowrap}
    th{font-size:.7rem;letter-spacing:.08em;color:var(--mu);background:rgba(0,0,0,.2)}
    tr:hover td{background:rgba(0,229,255,.04)}
    .good{color:var(--g)} .warn{color:var(--o)} .bad{color:var(--r)}
    .pill{display:inline-block;border:1px solid rgba(0,229,255,.3);border-radius:999px;padding:2px 8px;font-size:.7rem;color:var(--c)}
    .empty{padding:22px;text-align:center;color:var(--mu)}
    a.toplink{color:var(--c);text-decoration:none}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

    /* ── GAME GROUPS — Pitcher Weakspots tab ── */
    .game-group{margin-bottom:24px}
    .game-header{
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      background:linear-gradient(90deg,rgba(0,229,255,.07),rgba(0,229,255,.02));
      border:1px solid rgba(0,229,255,.18);border-radius:12px;
      padding:10px 16px;margin-bottom:12px;
    }
    .gh-matchup{font-weight:700;font-size:.92rem;color:var(--t);letter-spacing:.04em}
    .gh-time{font-size:.75rem;color:var(--gold);font-weight:600;
             border:1px solid rgba(245,197,66,.35);border-radius:999px;padding:2px 10px}
    .gh-meta{font-size:.72rem;color:var(--mu);margin-left:auto}

    /* Two-column pitcher card grid */
    .pitcher-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:700px){.pitcher-pair{grid-template-columns:1fr}}

    /* Individual pitcher card */
    .ws-card{border:1px solid var(--b);border-radius:12px;
             background:rgba(255,255,255,.025);padding:14px;
             display:flex;flex-direction:column;gap:5px}
    .ws-card:hover{border-color:rgba(0,229,255,.28);background:rgba(0,229,255,.03)}
    .ws-pitcher-name{font-weight:700;font-size:.88rem;color:var(--c)}
    .ws-pitcher-team{font-weight:400;font-size:.82rem;color:var(--mu);margin-left:4px}
    .ws-role-badge{font-size:.65rem;letter-spacing:.07em;text-transform:uppercase;
                   background:rgba(0,229,255,.1);color:var(--c);
                   border:1px solid rgba(0,229,255,.25);border-radius:999px;
                   padding:1px 7px;margin-left:6px}
    .ws-row{display:flex;justify-content:space-between;align-items:baseline;
            font-size:.78rem;gap:8px;padding:2px 0}
    .ws-label{color:var(--mu);font-size:.68rem;letter-spacing:.07em;
              text-transform:uppercase;white-space:nowrap;flex-shrink:0}
    .ws-val{text-align:right;font-size:.78rem}
    .ws-divider{border-top:1px solid rgba(255,255,255,.06);margin:7px 0}

    /* Batter targets */
    .ws-section-label{font-size:.65rem;letter-spacing:.09em;text-transform:uppercase;
                      color:var(--mu);margin-bottom:5px}
    .ws-batter{display:flex;align-items:baseline;gap:6px;font-size:.76rem;
               padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
    .ws-batter:last-child{border-bottom:none}
    .ws-slot{color:var(--c);font-weight:700;font-size:.72rem;min-width:42px;flex-shrink:0}
    .ws-bname{color:var(--t);font-weight:600;flex:1}
    .ws-bstats{color:var(--mu);font-size:.7rem;white-space:nowrap}
    .ws-bscore{font-size:.7rem;color:var(--g);font-weight:600;white-space:nowrap}

    /* K Prop box */
    .ws-kprop{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.18);
              border-radius:8px;padding:8px 10px;font-size:.76rem;margin:4px 0}
    .ws-kprop-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
    .ws-kprop-badge{font-size:.65rem;font-weight:700;background:rgba(0,229,255,.15);
                    color:var(--c);border-radius:999px;padding:1px 7px;
                    letter-spacing:.06em;text-transform:uppercase}
    .ws-kprop-line{font-size:.82rem;font-weight:700;color:var(--t)}
    .ws-kprop-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--mu)}
    .ws-kprop-stats strong{color:var(--t)}

    /* Rec / reasoning */
    .ws-rec{font-size:.78rem;font-weight:700;color:var(--o);padding:3px 0;line-height:1.35}
    .ws-reason{font-size:.7rem;color:var(--mu);line-height:1.45;padding:2px 0}
    .ws-parlay-btn{margin-top:8px;width:100%;border:1px solid rgba(0,229,255,.3);
                   background:rgba(0,229,255,.07);color:var(--c);padding:7px;
                   border-radius:8px;cursor:pointer;font-size:.78rem;transition:background .15s}
    .ws-parlay-btn:hover{background:rgba(0,229,255,.15)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="brand">MLB ANALYTICS HUB - CHEATSHEETS</div>
        <div class="sub" id="statusText">Loading today's cheatsheets...</div>
      </div>
      <div class="actions">
        <a class="toplink" href="/">Dashboard</a>
        <a class="toplink" href="/props">Props</a>
        <a class="toplink" href="/tracker">Tracker</a>
        <button class="btn" id="csvBtn" onclick="exportTracker('csv')">Export CSV</button>
        <button class="btn" id="pdfBtn" onclick="exportTracker('pdf')">Export PDF</button>
        <button class="btn" id="refreshBtn" onclick="loadData(true)">Refresh</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab on" data-tab="hits" onclick="switchTab('hits',this)">Hits Board</button>
      <button class="tab" data-tab="matchups" onclick="switchTab('matchups',this)">Batting Order Matchups</button>
      <button class="tab" data-tab="weakspots" onclick="switchTab('weakspots',this)">Pitcher Weakspots</button>
    </div>

    <section class="panel on" id="panel-hits">
      <div class="meta" id="hitsMeta"></div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Player</th><th>Team</th><th>Slot</th><th>Matchup</th><th>vs Hand</th>
              <th>L10 %</th><th>BvP</th><th>Hub</th><th>EV %</th><th></th>
            </tr>
          </thead>
          <tbody id="hitsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="panel-matchups">
      <div class="meta" id="matchMeta"></div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Game</th><th>Rank</th><th>Player</th><th>Team</th><th>Slot</th>
              <th>Score</th><th>BvP</th><th>L10 %</th><th>Hub</th><th></th>
            </tr>
          </thead>
          <tbody id="matchBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="panel-weakspots">
      <div class="meta" id="weakMeta"></div>
      <div id="weakGrid"></div>
    </section>
  </div>

  <script>
    let DATA = null;

    function esc(s){return String(s??''). replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function pct(v){return (v==null||isNaN(v)) ? '-' : (Number(v)*100).toFixed(1)+'%';}
    function num(v,d=2){return (v==null||isNaN(v)) ? '-' : Number(v).toFixed(d);}
    function l10Class(v){const n=Number(v||0);return n>=0.62?'good':n>=0.52?'warn':'bad';}
    function formClass(label){
      if(!label) return '';
      if(label.includes('DEALING'))    return 'good';
      if(label.includes('STRUGGLING')) return 'bad';
      return 'warn';
    }

    function switchTab(name,btn){
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
      document.getElementById('panel-'+name).classList.add('on');
      btn.classList.add('on');
    }

    function etToday(){
      const d=new Date().toLocaleDateString('en-US',{timeZone:'America/New_York'});
      const [m,dy,y]=d.split('/');
      return y+'-'+m.padStart(2,'0')+'-'+dy.padStart(2,'0');
    }

    function exportTracker(format){
      window.location.href='/api/tracker/export/'+etToday()+'?format='+(format||'csv').toLowerCase();
    }

    // ── Hits Board ─────────────────────────────────────────────────────────
    function renderHits(rows){
      const body=document.getElementById('hitsBody');
      const meta=document.getElementById('hitsMeta');
      if(!rows||!rows.length){
        body.innerHTML='<tr><td colspan="10" class="empty">No hits cheatsheet rows available.</td></tr>';
        meta.innerHTML='';return;
      }
      const games=new Set(rows.map(r=>r.gamePk)).size;
      meta.innerHTML='<span class="pill">Rows: '+rows.length+'</span><span class="pill">Games: '+games+'</span><span class="pill">Sorted by HUB</span>';
      body.innerHTML=rows.map((r,idx)=>'<tr>'+
        '<td>'+esc(r.player||'-')+'</td>'+
        '<td>'+esc(r.team||'-')+'</td>'+
        '<td>'+esc(r.slot||'-')+'</td>'+
        '<td>'+esc(r.matchup||'-')+'</td>'+
        '<td>'+esc(r.vsHand||'-')+'</td>'+
        '<td class="'+l10Class(r.l10Pct)+'">'+pct(r.l10Pct)+'</td>'+
        '<td>'+esc(r.bvpGrade||'-')+'</td>'+
        '<td>'+(r.hubRating==null?'-':r.hubRating)+'</td>'+
        '<td class="'+(( r.evPct||0)>=0?'good':'bad')+'">'+num(r.evPct,1)+'%</td>'+
        '<td><button class="btn" onclick="addHitsRowToParlay('+idx+')">+ Parlay</button></td>'+
      '</tr>').join('');
    }

    // ── Batting Order Matchups ─────────────────────────────────────────────
    function renderMatchups(rows){
      const body=document.getElementById('matchBody');
      const meta=document.getElementById('matchMeta');
      if(!rows||!rows.length){
        body.innerHTML='<tr><td colspan="10" class="empty">No matchup rows available.</td></tr>';
        meta.innerHTML='';return;
      }
      const games=[...new Set(rows.map(r=>r.matchup))].length;
      meta.innerHTML='<span class="pill">Games: '+games+'</span><span class="pill">Rows: '+rows.length+'</span>';
      body.innerHTML=rows.map((r,idx)=>'<tr>'+
        '<td>'+esc(r.matchup||'-')+'</td>'+
        '<td>'+esc(r.rank||'-')+'</td>'+
        '<td>'+esc(r.player||'-')+'</td>'+
        '<td>'+esc(r.team||'-')+'</td>'+
        '<td>'+esc(r.slot||'-')+'</td>'+
        '<td>'+num(r.matchupScore,1)+'</td>'+
        '<td>'+esc(r.bvpGrade||'-')+'</td>'+
        '<td class="'+l10Class(r.l10Pct)+'">'+pct(r.l10Pct)+'</td>'+
        '<td>'+(r.hubRating==null?'-':r.hubRating)+'</td>'+
        '<td><button class="btn" onclick="addMatchupRowToParlay('+idx+')">+ Parlay</button></td>'+
      '</tr>').join('');
    }

    // ── Pitcher Weakspots — grouped by game, sorted by start time ──────────
    function parseGameTime(gameTime){
      if(!gameTime||gameTime==='TBD') return 9999;
      // Primary: "6:40 PM ET" style
      const m=String(gameTime).match(/(\d+):(\d+)\s*(AM|PM)/i);
      if(m){
        let h=parseInt(m[1]),min=parseInt(m[2]),ampm=m[3].toUpperCase();
        if(ampm==='PM'&&h!==12) h+=12;
        if(ampm==='AM'&&h===12) h=0;
        return h*60+min;
      }
      // Fallback: ISO string
      const iso=new Date(gameTime);
      if(!isNaN(iso)) return iso.getTime();
      return 9999;
    }

    function buildPitcherCard(c, idx){
      // Batter targets
      const batters=c.topBatters||[];
      const battersHtml=batters.length
        ? '<div class="ws-section-label">Top Batter Targets</div>'+
          batters.map(b=>
            '<div class="ws-batter">'+
              '<span class="ws-slot">Slot '+esc(b.slot)+'</span>'+
              '<span class="ws-bname">'+esc(b.name)+'</span>'+
              '<span class="ws-bstats">'+(b.avg&&b.avg!=='---'?'AVG '+esc(b.avg):'')+
                (b.woba&&b.woba!=='---'?' &middot; wOBA '+esc(b.woba):'')+'</span>'+
              '<span class="ws-bscore">'+(b.score!=null?'Score: '+esc(String(b.score)):'')+'</span>'+
            '</div>'
          ).join('')
        : '';

      // K Prop — DEALING pitchers only
      const kp=c.kProp||{};
      const showK=c.formLabel&&c.formLabel.includes('DEALING')&&kp.line;
      const kHtml=showK
        ? '<div class="ws-kprop">'+
            '<div class="ws-kprop-header">'+
              '<span class="ws-kprop-badge">&#9889; K Prop</span>'+
              '<span class="ws-kprop-line">Over '+esc(String(kp.line))+' Ks</span>'+
            '</div>'+
            '<div class="ws-kprop-stats">'+
              (kp.k9Blended!=null?'<span><strong>K/9</strong> '+Number(kp.k9Blended).toFixed(1)+' blended</span>':'')+
              (kp.xfip!=null?'<span><strong>xFIP:</strong> '+Number(kp.xfip).toFixed(2)+'</span>':'')+
              (kp.recentKPerStart!=null?'<span><strong>'+Number(kp.recentKPerStart).toFixed(1)+' K/start recent</strong></span>':'')+
            '</div>'+
          '</div>'
        : '';

      const reasonHtml=c.parlayReasoning
        ? '<div class="ws-reason">'+esc(c.parlayReasoning)+'</div>'
        : '';

      return '<div class="ws-card">'+
        '<div style="display:flex;align-items:center;margin-bottom:6px">'+
          '<span class="ws-pitcher-name">'+esc(c.pitcherName||'-')+'</span>'+
          '<span class="ws-pitcher-team"> ('+esc(c.team||'-')+')</span>'+
          (c.role?'<span class="ws-role-badge">'+esc(c.role)+'</span>':'')+
        '</div>'+
        '<div class="ws-row"><span class="ws-label">Pitch Vuln</span><span class="ws-val">'+esc(c.pitchVulnerability||'-')+'</span></div>'+
        '<div class="ws-row"><span class="ws-label">Form</span><span class="ws-val '+formClass(c.formLabel)+'">'+esc(c.formLabel||'-')+'</span></div>'+
        '<div class="ws-divider"></div>'+
        battersHtml+
        '<div class="ws-row"><span class="ws-label">Weakspot Slots</span><span class="ws-val">'+esc(c.weakSlots||'n/a')+'</span></div>'+
        kHtml+
        '<div class="ws-divider"></div>'+
        '<div class="ws-rec">'+esc(c.recommendation||'')+'</div>'+
        reasonHtml+
        '<button class="ws-parlay-btn" onclick="addWeakspotToParlay('+idx+')">+ Parlay</button>'+
      '</div>';
    }

    function renderWeakspots(cards){
      const wrap=document.getElementById('weakGrid');
      const meta=document.getElementById('weakMeta');
      if(!cards||!cards.length){
        wrap.innerHTML='<div class="empty">No pitcher weakspot cards available.</div>';
        meta.innerHTML='';return;
      }
      meta.innerHTML='<span class="pill">Pitchers: '+cards.length+'</span>';

      // Group by gamePk (handles doubleheaders); fall back to matchup string
      const groups={}, groupTime={};
      cards.forEach((c,idx)=>{
        const key=c.gamePk ? String(c.gamePk) : (c.matchup||'Unknown');
        if(!groups[key]) groups[key]=[];
        groups[key].push({card:c,idx});
        if(c.gameTime) groupTime[key]=c.gameTime;
      });

      // Sort game blocks by start time (earliest first)
      const sortedKeys=Object.keys(groups).sort((a,b)=>
        parseGameTime(groupTime[a])-parseGameTime(groupTime[b])
      );

      let html='';
      sortedKeys.forEach(key=>{
        const pair=groups[key];
        const timeLabel=groupTime[key]||'';
        const rawMatchup=(pair[0].card.matchup||key);
        const parts=rawMatchup.split(/\s*@\s*/);
        const awayStr=parts[0]?parts[0].trim():rawMatchup;
        const homeStr=parts[1]?parts[1].trim():'';
        const matchupLabel=homeStr
          ? '<strong>'+esc(awayStr)+'</strong> <span style="color:var(--mu)">@</span> <strong>'+esc(homeStr)+'</strong>'
          : esc(rawMatchup);

        html+='<div class="game-group">'+
          '<div class="game-header">'+
            '<span class="gh-matchup">'+matchupLabel+'</span>'+
            (timeLabel?'<span class="gh-time">'+esc(timeLabel)+'</span>':'')+
            '<span class="gh-meta">'+pair.length+' pitcher'+(pair.length!==1?'s':'')+' &middot; click Parlay to send to tracker</span>'+
          '</div>'+
          '<div class="pitcher-pair">'+
            pair.map(({card:c,idx})=>buildPitcherCard(c,idx)).join('')+
          '</div>'+
        '</div>';
      });

      wrap.innerHTML=html;
    }

    // ── Parlay Handlers ────────────────────────────────────────────────────
    function addHitsRowToParlay(idx){
      if(!DATA||!DATA.hitsBoard||!DATA.hitsBoard.rows) return;
      const r=DATA.hitsBoard.rows[idx]; if(!r) return;
      addLegToPendingParlay({player:r.player,marketKey:'batter_hits',line:r.line||1.5,
        gamePk:r.gamePk,team:r.team,recommendedSide:'Over',savedAt:Date.now(),source:'cheatsheet_hits'});
    }

    function addMatchupRowToParlay(idx){
      if(!DATA||!DATA.battingOrderMatchups||!DATA.battingOrderMatchups.rows) return;
      const r=DATA.battingOrderMatchups.rows[idx]; if(!r) return;
      addLegToPendingParlay({player:r.player,marketKey:'batter_hits',line:r.line||1.5,
        gamePk:r.gamePk,team:r.team,recommendedSide:'Over',savedAt:Date.now(),source:'cheatsheet_matchups'});
    }

    function addWeakspotToParlay(idx){
      if(!DATA||!DATA.pitcherWeakspots||!DATA.pitcherWeakspots.cards) return;
      const c=DATA.pitcherWeakspots.cards[idx]; if(!c) return;
      const kp=c.kProp||{};
      const isDealing=c.formLabel&&c.formLabel.includes('DEALING');
      addLegToPendingParlay({
        player:c.pitcherName,
        marketKey:isDealing?'pitcher_strikeouts':'pitcher_hits_allowed',
        line:isDealing?(kp.line||5.5):(c.line||4.5),
        gamePk:c.gamePk,team:c.team,recommendedSide:'Over',
        savedAt:Date.now(),source:'cheatsheet_weakspots',reasoning:c.parlayReasoning
      });
    }

    function addLegToPendingParlay(leg){
      try{
        let legs=[];
        try{legs=JSON.parse(localStorage.getItem('pendingParlayLegs')||'[]');}catch(e){}
        legs.push(leg);
        localStorage.setItem('pendingParlayLegs',JSON.stringify(legs));
        window.location.href='/tracker';
      }catch(e){alert('Failed to add to parlay: '+e.message);}
    }

    // ── Data Load ──────────────────────────────────────────────────────────
    async function loadData(force){
      const btn=document.getElementById('refreshBtn');
      const status=document.getElementById('statusText');
      btn.disabled=true;
      status.textContent='Loading cheatsheets...';
      try{
        const r=await fetch('/api/cheatsheets/today'+(force?'?refresh=1':''));
        const d=await r.json();
        if(!d.success) throw new Error(d.error||'Failed to load');
        DATA=d;
        renderHits(d.hitsBoard.rows);
        renderMatchups(d.battingOrderMatchups.rows);
        renderWeakspots(d.pitcherWeakspots.cards);
        if(d.computing){
          status.textContent=(d.message||'Computing... auto-refresh in 20s')+' | retrying in 5s';
          setTimeout(()=>loadData(false),5000);
        }else{
          status.textContent='Updated '+(d.generatedAt||'now')+' | cache age '+(d.cacheAgeSec||0)+'s';
        }
      }catch(e){
        status.textContent='Error: '+e.message;
      }finally{
        btn.disabled=false;
      }
    }

    loadData(false);
  </script>
</body>
</html>
