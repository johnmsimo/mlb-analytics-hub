<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Dive — MLB Analytics Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cyan:#00e5ff;--magenta:#e040fb;--green:#00e676;--orange:#ff9800;--bg:#050a18;--card:#0a1628;--border:rgba(0,229,255,.18);--text:#e0f0ff;--muted:#6a8db0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,.012) 2px,rgba(0,229,255,.012) 4px);pointer-events:none;z-index:9999}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:rgba(5,10,24,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:900;color:var(--cyan);text-shadow:0 0 20px rgba(0,229,255,.5)}
.back-btn{display:flex;align-items:center;gap:8px;padding:8px 20px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.25);border-radius:8px;color:var(--cyan);font-family:'Orbitron',monospace;font-size:.72rem;letter-spacing:2px;cursor:pointer;text-decoration:none;transition:all .2s}
.back-btn:hover{background:rgba(0,229,255,.15);border-color:var(--cyan)}

/* MATCHUP HEADER */
.matchup-header{padding:32px;background:linear-gradient(135deg,rgba(0,229,255,.05),rgba(224,64,251,.05));border-bottom:1px solid var(--border)}
.mh-inner{max-width:900px;margin:0 auto;text-align:center}
.mh-teams{display:flex;align-items:center;justify-content:center;gap:32px;margin-bottom:20px}
.mh-team{display:flex;flex-direction:column;align-items:center;gap:10px}
.mh-logo{width:80px;height:80px;border-radius:50%;border:2px solid var(--border);background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mh-logo img{width:56px;height:56px;object-fit:contain}
.mh-abbr{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:700}
.mh-fullname{font-size:.8rem;color:var(--muted)}
.mh-vs{font-family:'Orbitron',monospace;font-size:1.5rem;color:var(--muted);padding:0 8px}
.mh-meta{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.mh-badge{padding:5px 14px;border-radius:20px;font-size:.7rem;letter-spacing:2px;font-family:'Orbitron',monospace}
.badge-cyan{background:rgba(0,229,255,.1);color:var(--cyan);border:1px solid rgba(0,229,255,.25)}
.badge-green{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.25)}
.badge-orange{background:rgba(255,152,0,.1);color:var(--orange);border:1px solid rgba(255,152,0,.25)}

/* GRID LAYOUT */
.dd-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:24px 32px;max-width:1400px;margin:0 auto}
.full-width{grid-column:1/-1}

/* PANEL */
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;position:relative;overflow:hidden}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--magenta))}
.panel-title{font-family:'Orbitron',monospace;font-size:.72rem;color:var(--muted);letter-spacing:3px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.panel-title-icon{font-size:1rem}

/* PITCHER PANEL */
.pitcher-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pitcher-card{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:16px;text-align:center}
.pitcher-card h4{font-family:'Orbitron',monospace;font-size:.78rem;color:var(--cyan);margin-bottom:4px}
.pitcher-card .team-tag{font-size:.65rem;color:var(--muted);margin-bottom:12px;letter-spacing:1px}
.stat-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.stat-row:last-child{border-bottom:none}
.stat-row .sk{font-size:.7rem;color:var(--muted)}
.stat-row .sv{font-size:.78rem;color:var(--text);font-weight:600;font-family:'Orbitron',monospace}
.sv-good{color:var(--green)!important}
.sv-warn{color:var(--orange)!important}
.sv-bad{color:#f44336!important}

/* PARK FACTOR */
.park-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.park-stat{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:12px;text-align:center}
.park-stat .ps-val{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;color:var(--cyan)}
.park-stat .ps-label{font-size:.65rem;color:var(--muted);letter-spacing:1px;margin-top:4px}

/* LINEUP TABLE */
.lineup-table{width:100%;border-collapse:collapse}
.lineup-table th{font-size:.65rem;color:var(--muted);letter-spacing:2px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-family:'Orbitron',monospace}
.lineup-table td{font-size:.78rem;padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.lineup-table tr:last-child td{border-bottom:none}
.lineup-table tr:hover td{background:rgba(0,229,255,.04)}
.order-num{color:var(--muted);font-family:'Orbitron',monospace;font-size:.7rem}
.pos-badge{display:inline-block;padding:2px 7px;border-radius:4px;background:rgba(0,229,255,.08);color:var(--cyan);font-size:.65rem;font-family:'Orbitron',monospace}
.avg-good{color:var(--green)}
.avg-mid{color:var(--orange)}
.avg-low{color:var(--muted)}
.lineup-tabs{display:flex;gap:8px;margin-bottom:14px}
.tab-btn{padding:6px 16px;border-radius:6px;font-size:.7rem;letter-spacing:2px;font-family:'Orbitron',monospace;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);transition:all .2s}
.tab-btn.active{background:rgba(0,229,255,.12);border-color:var(--cyan);color:var(--cyan)}

/* EDGE METER */
.edge-big{text-align:center;padding:16px}
.edge-number{font-family:'Orbitron',monospace;font-size:3rem;font-weight:900;color:var(--cyan);text-shadow:0 0 30px rgba(0,229,255,.5);line-height:1}
.edge-label{font-size:.7rem;color:var(--muted);letter-spacing:3px;margin-top:6px}
.conf-bar-wrap{margin-top:16px}
.conf-bar{height:12px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;margin-top:6px}
.conf-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta));border-radius:6px;transition:width 1.5s cubic-bezier(.16,1,.3,1);box-shadow:0 0 10px rgba(0,229,255,.4)}
.conf-labels{display:flex;justify-content:space-between;margin-top:4px}
.conf-labels span{font-size:.6rem;color:var(--muted);letter-spacing:1px}

/* WEATHER DETAIL */
.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w-stat{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:12px;text-align:center}
.w-stat-icon{font-size:1.4rem;margin-bottom:6px}
.w-stat-val{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--text)}
.w-stat-label{font-size:.65rem;color:var(--muted);letter-spacing:1px;margin-top:3px}
.weather-impact{margin-top:12px;padding:10px 12px;background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.15);border-radius:8px;font-size:.75rem;color:var(--cyan);text-align:center}

/* LOADING */
.spinner{width:32px;height:32px;border:2px solid rgba(0,229,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{text-align:center;font-family:'Orbitron',monospace;font-size:.7rem;color:var(--muted);letter-spacing:3px}

/* RESPONSIVE */
@media(max-width:900px){
  .dd-grid{grid-template-columns:1fr;padding:16px}
  nav{padding:12px 16px}
  .matchup-header{padding:20px 16px}
  .pitcher-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">⚡ MLB ANALYTICS HUB</div>
  <a class="back-btn" href="/">← DASHBOARD</a>
</nav>

<!-- MATCHUP HEADER -->
<div class="matchup-header">
  <div class="mh-inner">
    <div id="mhTeams" class="mh-teams">
      <div class="spinner" style="margin:0 auto"></div>
    </div>
    <div class="mh-meta" id="mhMeta"></div>
  </div>
</div>

<!-- DEEP DIVE GRID -->
<div class="dd-grid">

  <!-- Edge score -->
  <div class="panel">
    <div class="panel-title"><span class="panel-title-icon">🎯</span>MODEL EDGE SCORE</div>
    <div class="edge-big" id="edgePanel">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Weather -->
  <div class="panel">
    <div class="panel-title"><span class="panel-title-icon">🌤️</span>WEATHER CONDITIONS</div>
    <div id="weatherPanel"><div class="spinner"></div></div>
  </div>

  <!-- Pitchers -->
  <div class="panel full-width">
    <div class="panel-title"><span class="panel-title-icon">⚾</span>STARTING PITCHERS</div>
    <div id="pitcherPanel"><div class="spinner"></div><div class="loading-text" style="margin-top:8px">LOADING PITCHER DATA...</div></div>
  </div>

  <!-- Park Factors -->
  <div class="panel">
    <div class="panel-title"><span class="panel-title-icon">🏟️</span>PARK FACTORS</div>
    <div id="parkPanel"><div class="spinner"></div></div>
  </div>

  <!-- Key Matchup Numbers -->
  <div class="panel">
    <div class="panel-title"><span class="panel-title-icon">📊</span>MATCHUP ANALYSIS</div>
    <div id="matchupPanel"><div class="spinner"></div></div>
  </div>

  <!-- Lineups -->
  <div class="panel full-width">
    <div class="panel-title"><span class="panel-title-icon">📋</span>LINEUP ANALYSIS</div>
    <div class="lineup-tabs">
      <button class="tab-btn active" onclick="showTab('away')">AWAY LINEUP</button>
      <button class="tab-btn" onclick="showTab('home')">HOME LINEUP</button>
    </div>
    <div id="lineupPanel"><div class="spinner"></div></div>
  </div>

</div>

<script>
const GAME_PK = parseInt(window.location.pathname.split('/').pop());
let gameData  = null;
let pitchData = null;
let awayLineup = [];
let homeLineup = [];

// ── Helpers ──
function weatherIcon(c=''){
  const s=c.toLowerCase();
  if(s.includes('rain'))return'🌧️';
  if(s.includes('thunder'))return'⛈️';
  if(s.includes('cloud'))return'☁️';
  if(s.includes('clear')||s.includes('sunny'))return'☀️';
  return'🌤️';
}
function eraColor(era){
  const v=parseFloat(era);
  if(isNaN(v))return'';
  if(v<3.0)return'sv-good';
  if(v<4.5)return'';
  return'sv-warn';
}
function avgColor(avg){
  const v=parseFloat(avg);
  if(isNaN(v))return'avg-low';
  if(v>=.280)return'avg-good';
  if(v>=.240)return'avg-mid';
  return'avg-low';
}

// ── Load game detail ──
async function loadGame(){
  try{
    const res  = await fetch(`/api/games/today`);
    const data = await res.json();
    gameData   = (data.games||[]).find(g=>g.gamePk==GAME_PK);
    if(!gameData) throw new Error('Game not found');
    renderHeader();
    renderEdge();
    renderWeather();
    renderPark();
    renderMatchup();
  }catch(e){
    document.getElementById('mhTeams').innerHTML=`<p style="color:var(--magenta);font-family:Orbitron">Error loading game data</p>`;
  }
}

async function loadPitchers(){
  try{
    const res  = await fetch(`/api/pitchers/${GAME_PK}`);
    pitchData  = await res.json();
    renderPitchers();
  }catch(e){
    document.getElementById('pitcherPanel').innerHTML=`<p style="color:var(--muted);font-size:.8rem">Pitcher data unavailable</p>`;
  }
}

async function loadLineups(){
  try{
    const res  = await fetch(`/api/game/${GAME_PK}`);
    const data = await res.json();
    if(data.success){
      awayLineup = data.awayBatters||[];
      homeLineup = data.homeBatters||[];
    }
    showTab('away');
  }catch(e){
    document.getElementById('lineupPanel').innerHTML=`<p style="color:var(--muted);font-size:.8rem">Lineup data unavailable. Lineups post ~3h before first pitch.</p>`;
  }
}

// ── Renders ──
function renderHeader(){
  const g=gameData;
  const awayImg = g.awayLogo?`<img src="${g.awayLogo}" alt="${g.awayAbbr}" width="56" height="56" style="object-fit:contain">`:`<span style="font-family:Orbitron;color:var(--cyan);font-size:1.1rem">${g.awayAbbr}</span>`;
  const homeImg = g.homeLogo?`<img src="${g.homeLogo}" alt="${g.homeAbbr}" width="56" height="56" style="object-fit:contain">`:`<span style="font-family:Orbitron;color:var(--cyan);font-size:1.1rem">${g.homeAbbr}</span>`;
  const statusClass = g.status==='Live'?'badge-green':g.status==='Final'?'':'badge-cyan';

  document.getElementById('mhTeams').innerHTML=`
    <div class="mh-team"><div class="mh-logo">${awayImg}</div><div class="mh-abbr">${g.awayAbbr}</div><div class="mh-fullname">${g.awayName}</div></div>
    <div class="mh-vs">VS</div>
    <div class="mh-team"><div class="mh-logo">${homeImg}</div><div class="mh-abbr">${g.homeAbbr}</div><div class="mh-fullname">${g.homeName}</div></div>`;

  document.getElementById('mhMeta').innerHTML=`
    <span class="mh-badge badge-cyan">${g.gameTime}</span>
    <span class="mh-badge ${statusClass}">${g.status.toUpperCase()}</span>
    <span class="mh-badge badge-orange">PARK: ${g.parkFactor}x</span>
    ${g.venue?`<span class="mh-badge badge-cyan">${g.venue}</span>`:''}`;
}

function renderEdge(){
  const g=gameData;
  const conf = g.edge>=8?'HIGH':g.edge>=5?'MEDIUM':'LOW';
  const color = g.edge>=8?'var(--green)':g.edge>=5?'var(--cyan)':'var(--muted)';
  document.getElementById('edgePanel').innerHTML=`
    <div class="edge-big">
      <div class="edge-number" style="color:${color}">${g.edge}%</div>
      <div class="edge-label">MODEL EDGE SCORE</div>
      <div class="conf-bar-wrap">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:.65rem;color:var(--muted);letter-spacing:2px">CONFIDENCE</span>
          <span style="font-family:Orbitron;font-size:.75rem;color:${color}">${conf}</span>
        </div>
        <div class="conf-bar"><div class="conf-fill" style="width:0%" data-w="${g.barPct}%"></div></div>
        <div class="conf-labels"><span>LOW</span><span>MED</span><span>HIGH</span></div>
      </div>
    </div>`;
  setTimeout(()=>{
    document.querySelectorAll('.conf-fill').forEach(el=>{ el.style.width=el.dataset.w; });
  },200);
}

function renderWeather(){
  const g=gameData;
  const hasW = g.temp && g.temp!=='N/A';
  if(!hasW){
    document.getElementById('weatherPanel').innerHTML=`<p style="color:var(--muted);font-size:.8rem;text-align:center;padding:20px">Weather data not yet available</p>`;
    return;
  }
  const tempVal = parseInt(g.temp)||70;
  const impact = tempVal>80?'🔥 HOT — Favors hitters. Expect elevated scoring.':tempVal<50?'🥶 COLD — Favors pitchers. Ball dies in cold air.':'✅ NEUTRAL — Standard conditions expected.';

  document.getElementById('weatherPanel').innerHTML=`
    <div class="weather-grid">
      <div class="w-stat"><div class="w-stat-icon">${weatherIcon(g.condition)}</div><div class="w-stat-val">${g.temp}°F</div><div class="w-stat-label">TEMPERATURE</div></div>
      <div class="w-stat"><div class="w-stat-icon">💨</div><div class="w-stat-val">${g.wind||'N/A'}</div><div class="w-stat-label">WIND</div></div>
    </div>
    <div class="weather-impact">${impact}</div>`;
}

function renderPitchers(){
  if(!pitchData||!pitchData.success){
    document.getElementById('pitcherPanel').innerHTML=`<p style="color:var(--muted);font-size:.8rem">Pitcher stats unavailable.</p>`;
    return;
  }
  function pitcherCard(p, label){
    const s = p.stats||{};
    const hasStats = s.era && s.era!=='N/A';
    const statsHTML = hasStats?`
      <div class="stat-row"><span class="sk">ERA</span><span class="sv ${eraColor(s.era)}">${s.era}</span></div>
      <div class="stat-row"><span class="sk">WHIP</span><span class="sv">${s.whip}</span></div>
      <div class="stat-row"><span class="sk">K/9</span><span class="sv">${s.k9}</span></div>
      <div class="stat-row"><span class="sk">IP</span><span class="sv">${s.ip}</span></div>
      <div class="stat-row"><span class="sk">W-L</span><span class="sv">${s.wins}-${s.losses}</span></div>`
    :`<p style="color:var(--muted);font-size:.7rem;margin-top:8px">No season stats yet</p>`;
    return `<div class="pitcher-card">
      <h4>${p.name||'TBD'}</h4>
      <div class="team-tag">${label}</div>
      ${statsHTML}
    </div>`;
  }
  const g=gameData||{};
  document.getElementById('pitcherPanel').innerHTML=`
    <div class="pitcher-grid">
      ${pitcherCard(pitchData.awayPitcher, g.awayName||'AWAY')}
      ${pitcherCard(pitchData.homePitcher, g.homeName||'HOME')}
    </div>`;
}

function renderPark(){
  const g=gameData;
  const pf = g.parkFactor||1.0;
  const hrf = pf>=1.05?'Hitter-Friendly':pf<=0.95?'Pitcher-Friendly':'Neutral';
  const pfColor = pf>=1.05?'var(--orange)':pf<=0.95?'var(--green)':'var(--cyan)';
  document.getElementById('parkPanel').innerHTML=`
    <div class="park-grid">
      <div class="park-stat"><div class="ps-val" style="color:${pfColor}">${pf}x</div><div class="ps-label">RUN FACTOR</div></div>
      <div class="park-stat"><div class="ps-val" style="color:${pfColor}">${hrf}</div><div class="ps-label">PARK TYPE</div></div>
    </div>
    <div style="margin-top:12px;padding:10px;background:rgba(0,0,0,.3);border-radius:8px;font-size:.75rem;color:var(--muted);line-height:1.6">
      ${pf>=1.05?`🔥 <strong style="color:var(--orange)">${g.venue||'This park'}</strong> significantly boosts offense. Expect more runs and home runs than league average.`
      :pf<=0.95?`🏔️ <strong style="color:var(--green)">${g.venue||'This park'}</strong> suppresses offense. Expect fewer runs. Favor pitchers and unders.`
      :`✅ <strong style="color:var(--cyan)">${g.venue||'This park'}</strong> plays neutral. Minimal park adjustment needed.`}
    </div>`;
}

function renderMatchup(){
  const g=gameData;
  document.getElementById('matchupPanel').innerHTML=`
    <div class="stat-row" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
      <span style="font-size:.75rem;color:var(--muted)">Away Team</span>
      <span style="font-family:Orbitron;font-size:.8rem;color:var(--text)">${g.awayName}</span>
    </div>
    <div class="stat-row" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
      <span style="font-size:.75rem;color:var(--muted)">Home Team</span>
      <span style="font-family:Orbitron;font-size:.8rem;color:var(--text)">${g.homeName}</span>
    </div>
    <div class="stat-row" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
      <span style="font-size:.75rem;color:var(--muted)">Venue</span>
      <span style="font-size:.8rem;color:var(--text)">${g.venue||'TBD'}</span>
    </div>
    <div class="stat-row" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
      <span style="font-size:.75rem;color:var(--muted)">Model Edge</span>
      <span style="font-family:Orbitron;font-size:.85rem;color:var(--cyan)">${g.edge}%</span>
    </div>
    <div class="stat-row" style="padding:8px 0">
      <span style="font-size:.75rem;color:var(--muted)">Park Factor</span>
      <span style="font-family:Orbitron;font-size:.85rem;color:var(--orange)">${g.parkFactor}x</span>
    </div>`;
}

function showTab(side){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&side==='away')||(i===1&&side==='home')));
  const lineup = side==='away'?awayLineup:homeLineup;
  const teamName = side==='away'?(gameData?.awayName||'Away'):(gameData?.homeName||'Home');
  if(!lineup||lineup.length===0){
    document.getElementById('lineupPanel').innerHTML=`<p style="color:var(--muted);font-size:.8rem;padding:20px 0">Lineup not posted yet. Check back 3 hours before first pitch.</p>`;
    return;
  }
  const rows = lineup.map((p,i)=>`
    <tr>
      <td class="order-num">${i+1}</td>
      <td>${p.name}</td>
      <td><span class="pos-badge">${p.pos}</span></td>
      <td class="${avgColor(p.avg)}">${p.avg}</td>
      <td>${p.ab}</td>
      <td>${p.hits}</td>
      <td>${p.hr}</td>
      <td>${p.rbi}</td>
    </tr>`).join('');
  document.getElementById('lineupPanel').innerHTML=`
    <table class="lineup-table">
      <thead><tr><th>#</th><th>PLAYER</th><th>POS</th><th>AVG</th><th>AB</th><th>H</th><th>HR</th><th>RBI</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Init ──
loadGame();
loadPitchers();
loadLineups();
</script>
</body>
</html>
