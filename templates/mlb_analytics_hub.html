<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Analytics Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cyan:#00e5ff;--magenta:#e040fb;--green:#00e676;
  --bg:#050a18;--card:#0a1628;--border:rgba(0,229,255,.18);
  --text:#e0f0ff;--muted:#6a8db0;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* scanline */
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,.015) 2px,rgba(0,229,255,.015) 4px);pointer-events:none;z-index:9999}

/* ── NAV ── */
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:rgba(5,10,24,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Orbitron',monospace;font-size:1.35rem;font-weight:900;color:var(--cyan);text-shadow:0 0 20px rgba(0,229,255,.6);letter-spacing:3px}
.nav-right{display:flex;align-items:center;gap:20px}
.live-badge{display:flex;align-items:center;gap:6px;font-size:.75rem;letter-spacing:2px;color:var(--green);font-family:'Orbitron',monospace}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#clock{font-family:'Orbitron',monospace;font-size:.95rem;color:var(--cyan);min-width:80px;text-align:right}
.date-display{font-size:.8rem;color:var(--muted);font-family:'Orbitron',monospace}

/* ── HERO STRIP ── */
.hero-strip{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:linear-gradient(90deg,rgba(0,229,255,.06),rgba(224,64,251,.04));border-bottom:1px solid var(--border)}
.hero-title{font-family:'Orbitron',monospace;font-size:1.1rem;color:var(--muted);letter-spacing:4px;text-transform:uppercase}
.hero-stats{display:flex;gap:32px}
.hero-stat{text-align:center}
.hero-stat-val{font-family:'Orbitron',monospace;font-size:1.5rem;font-weight:700;color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.5)}
.hero-stat-label{font-size:.7rem;color:var(--muted);letter-spacing:2px;margin-top:2px}

/* ── GRID ── */
.games-section{padding:28px 32px}
.section-header{font-family:'Orbitron',monospace;font-size:.85rem;color:var(--muted);letter-spacing:4px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.section-header::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}

/* ── GAME CARD ── */
.game-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;cursor:pointer;position:relative;overflow:hidden;transition:all .3s cubic-bezier(.16,1,.3,1)}
.game-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,229,255,.04),rgba(224,64,251,.04));opacity:0;transition:opacity .3s}
.game-card:hover{transform:translateY(-6px) scale(1.01);border-color:var(--cyan);box-shadow:0 0 30px rgba(0,229,255,.25),0 20px 40px rgba(0,0,0,.5)}
.game-card:hover::before{opacity:1}

.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-status{font-size:.65rem;letter-spacing:2px;padding:3px 10px;border-radius:20px;font-family:'Orbitron',monospace;font-weight:700}
.status-preview{background:rgba(0,229,255,.1);color:var(--cyan);border:1px solid rgba(0,229,255,.3)}
.status-live{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.3);animation:pulse-border 2s ease-in-out infinite}
@keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(0,230,118,.4)}50%{box-shadow:0 0 0 4px rgba(0,230,118,0)}}
.status-final{background:rgba(106,141,176,.1);color:var(--muted);border:1px solid rgba(106,141,176,.2)}
.card-time{font-size:.75rem;color:var(--muted);font-family:'Orbitron',monospace}

.matchup{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px}
.team-block{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.team-logo-wrap{width:64px;height:64px;border-radius:50%;border:2px solid var(--border);background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .3s}
.game-card:hover .team-logo-wrap{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,.3)}
.team-logo-wrap img{width:44px;height:44px;object-fit:contain}
.team-abbr{font-family:'Orbitron',monospace;font-size:.85rem;font-weight:700;color:var(--text)}
.vs-divider{font-family:'Orbitron',monospace;font-size:.7rem;color:var(--muted);letter-spacing:2px;padding:0 4px}

.pitcher-row{display:flex;justify-content:space-between;margin-bottom:14px;padding:10px 12px;background:rgba(0,0,0,.3);border-radius:8px;border:1px solid rgba(255,255,255,.04)}
.pitcher-info{text-align:center;flex:1}
.pitcher-label{font-size:.6rem;color:var(--muted);letter-spacing:2px;margin-bottom:3px}
.pitcher-name{font-size:.72rem;color:var(--text);font-weight:600}

.weather-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:8px 12px;background:rgba(0,0,0,.25);border-radius:8px}
.weather-icon{font-size:1.1rem}
.weather-text{font-size:.72rem;color:var(--muted)}
.weather-text span{color:var(--text);font-weight:600}

.edge-bar-wrap{margin-bottom:6px}
.edge-bar-label{display:flex;justify-content:space-between;margin-bottom:5px}
.edge-bar-label span{font-size:.65rem;color:var(--muted);letter-spacing:1px}
.edge-bar-label strong{font-size:.75rem;color:var(--cyan);font-family:'Orbitron',monospace}
.edge-bar{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.edge-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 10px rgba(0,229,255,.4);transition:width 1.2s cubic-bezier(.16,1,.3,1)}

.venue-label{font-size:.65rem;color:var(--muted);text-align:center;margin-top:10px;letter-spacing:1px}
.analyze-pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;width:100%;justify-content:center;padding:9px;border-radius:8px;background:linear-gradient(90deg,rgba(0,229,255,.12),rgba(224,64,251,.08));border:1px solid rgba(0,229,255,.25);font-size:.72rem;color:var(--cyan);letter-spacing:2px;font-family:'Orbitron',monospace;font-weight:700;transition:all .2s}
.game-card:hover .analyze-pill{background:linear-gradient(90deg,rgba(0,229,255,.22),rgba(224,64,251,.15));border-color:var(--cyan)}

/* ── LOADING / ERROR ── */
.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:16px}
.spinner{width:48px;height:48px;border:3px solid rgba(0,229,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state-text{font-family:'Orbitron',monospace;font-size:.85rem;color:var(--muted);letter-spacing:3px}
.error-box{background:rgba(224,64,251,.08);border:1px solid rgba(224,64,251,.3);border-radius:12px;padding:24px 32px;text-align:center;max-width:480px}
.error-box h3{color:var(--magenta);font-family:'Orbitron',monospace;margin-bottom:8px}
.error-box p{color:var(--muted);font-size:.85rem;line-height:1.6}
.no-games{text-align:center;padding:60px 20px}
.no-games-icon{font-size:3rem;margin-bottom:16px;opacity:.5}
.no-games h3{font-family:'Orbitron',monospace;color:var(--muted);margin-bottom:8px;letter-spacing:2px}

/* ── FOOTER STRIP ── */
footer{text-align:center;padding:20px;border-top:1px solid var(--border);font-size:.7rem;color:var(--muted);letter-spacing:2px;font-family:'Orbitron',monospace}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  nav{padding:12px 16px}
  .nav-logo{font-size:1rem}
  .hero-strip{flex-direction:column;gap:14px;padding:14px 16px;align-items:flex-start}
  .hero-stats{gap:20px}
  .games-section{padding:20px 16px}
  .games-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">⚡ MLB ANALYTICS HUB</div>
  <div class="nav-right">
    <div class="date-display" id="dateDisplay"></div>
    <div id="clock"></div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  </div>
</nav>

<div class="hero-strip">
  <div class="hero-title">Command Center</div>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="hero-stat-val" id="statGames">—</div>
      <div class="hero-stat-label">GAMES TODAY</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-val" id="statLive">—</div>
      <div class="hero-stat-label">LIVE NOW</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-val" id="statAvgEdge">—</div>
      <div class="hero-stat-label">AVG EDGE</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-val" id="statHigh">—</div>
      <div class="hero-stat-label">HIGH CONF</div>
    </div>
  </div>
</div>

<div class="games-section">
  <div class="section-header">TODAY'S GAMES</div>
  <div id="gamesGrid">
    <div class="state-wrap">
      <div class="spinner"></div>
      <div class="state-text">LOADING GAMES...</div>
    </div>
  </div>
</div>

<footer>MLB ANALYTICS HUB &nbsp;|&nbsp; DATA POWERED BY MLB STATS API &nbsp;|&nbsp; FOR ENTERTAINMENT PURPOSES</footer>

<script>
// ── Clock ──
function tick(){
  const n=new Date();
  const h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
  document.getElementById('clock').textContent=
    `${(h%12||12).toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}${h>=12?'PM':'AM'}`;
  document.getElementById('dateDisplay').textContent=
    n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
}
setInterval(tick,1000);tick();

// ── Weather icon ──
function weatherIcon(cond=''){
  const c=(cond||'').toLowerCase();
  if(c.includes('rain')||c.includes('drizzle'))return'🌧️';
  if(c.includes('thunder'))return'⛈️';
  if(c.includes('snow'))return'🌨️';
  if(c.includes('cloud'))return'☁️';
  if(c.includes('overcast'))return'🌥️';
  if(c.includes('clear')||c.includes('sunny'))return'☀️';
  if(c.includes('wind'))return'💨';
  return'🌤️';
}

// ── Render card ──
function cardHTML(g){
  const statusClass = g.status==='Live'?'status-live':g.status==='Final'?'status-final':'status-preview';
  const statusLabel = g.status==='Live'?'● LIVE':g.status==='Final'?'FINAL':'SCHEDULED';
  const awayLogo = g.awayLogo?`<img src="${g.awayLogo}" alt="${g.awayAbbr}" loading="lazy" width="44" height="44">`:`<span style="font-family:Orbitron;font-size:1rem;color:var(--cyan)">${g.awayAbbr}</span>`;
  const homeLogo = g.homeLogo?`<img src="${g.homeLogo}" alt="${g.homeAbbr}" loading="lazy" width="44" height="44">`:`<span style="font-family:Orbitron;font-size:1rem;color:var(--cyan)">${g.homeAbbr}</span>`;
  const hasWeather = g.temp && g.temp!=='N/A';
  const weatherHTML = hasWeather?`
    <div class="weather-row">
      <span class="weather-icon">${weatherIcon(g.condition)}</span>
      <span class="weather-text"><span>${g.temp}°F</span> &nbsp;|&nbsp; ${g.wind}</span>
    </div>`:'';

  return `
  <div class="game-card" onclick="location.href='/deep-dive/${g.gamePk}'">
    <div class="card-top">
      <span class="card-status ${statusClass}">${statusLabel}</span>
      <span class="card-time">${g.gameTime}</span>
    </div>
    <div class="matchup">
      <div class="team-block">
        <div class="team-logo-wrap">${awayLogo}</div>
        <div class="team-abbr">${g.awayAbbr}</div>
      </div>
      <div class="vs-divider">VS</div>
      <div class="team-block">
        <div class="team-logo-wrap">${homeLogo}</div>
        <div class="team-abbr">${g.homeAbbr}</div>
      </div>
    </div>
    <div class="pitcher-row">
      <div class="pitcher-info">
        <div class="pitcher-label">AWAY SP</div>
        <div class="pitcher-name">${g.awayPitcher}</div>
      </div>
      <div style="width:1px;background:rgba(255,255,255,.05)"></div>
      <div class="pitcher-info">
        <div class="pitcher-label">HOME SP</div>
        <div class="pitcher-name">${g.homePitcher}</div>
      </div>
    </div>
    ${weatherHTML}
    <div class="edge-bar-wrap">
      <div class="edge-bar-label">
        <span>MODEL EDGE</span>
        <strong>${g.edge}%</strong>
      </div>
      <div class="edge-bar">
        <div class="edge-fill" style="width:0%" data-w="${g.barPct}%"></div>
      </div>
    </div>
    <div class="venue-label">${g.venue}</div>
    <div class="analyze-pill">⚡ DEEP DIVE ANALYSIS</div>
  </div>`;
}

// ── Load games ──
async function loadGames(){
  try{
    const res  = await fetch('/api/games/today');
    const data = await res.json();
    if(!data.success) throw new Error('API error');
    const games = data.games;

    // Stats strip
    const liveCount = games.filter(g=>g.status==='Live').length;
    const avgEdge   = games.length ? (games.reduce((s,g)=>s+g.edge,0)/games.length).toFixed(1) : '—';
    const highConf  = games.filter(g=>g.edge>=8).length;
    document.getElementById('statGames').textContent   = games.length||'0';
    document.getElementById('statLive').textContent    = liveCount;
    document.getElementById('statAvgEdge').textContent = avgEdge+'%';
    document.getElementById('statHigh').textContent    = highConf;

    if(games.length===0){
      document.getElementById('gamesGrid').innerHTML=`
        <div class="no-games">
          <div class="no-games-icon">⚾</div>
          <h3>NO GAMES TODAY</h3>
          <p style="color:var(--muted);font-size:.85rem;margin-top:8px">Check back on a game day.</p>
        </div>`;
      return;
    }

    document.getElementById('gamesGrid').innerHTML=
      `<div class="games-grid">${games.map(cardHTML).join('')}</div>`;

    // Animate bars
    requestAnimationFrame(()=>{
      document.querySelectorAll('.edge-fill').forEach(el=>{
        setTimeout(()=>{ el.style.width=el.dataset.w; },200);
      });
    });

  }catch(e){
    document.getElementById('gamesGrid').innerHTML=`
      <div class="state-wrap">
        <div class="error-box">
          <h3>CONNECTION ERROR</h3>
          <p>Could not load today's games. Check your connection and try again.<br><br>
          <small style="color:var(--muted)">${e.message}</small></p>
        </div>
      </div>`;
  }
}

loadGames();
setInterval(loadGames, 5*60*1000); // refresh every 5 min
</script>
</body>
</html>
