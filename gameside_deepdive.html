<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gameside Prop View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14;--surf:#0f141c;--surf2:#141b26;--surf3:#1a2332;
  --bord:rgba(0,229,255,.14);--bord2:rgba(255,255,255,.06);
  --text:#e6eef7;--mu:#7a8a9e;--fa:#3d4a5e;
  --c:#00e5ff;--g:#00e676;--o:#ff9100;--r:#ff3d5a;--p:#c77dff;--y:#ffd84a;
  --font-d:'Orbitron',monospace;--font-b:'Inter',sans-serif;--font-m:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{min-height:100dvh;font-family:var(--font-b);font-size:14px;color:var(--text);background:var(--bg);line-height:1.5}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(0,229,255,.05),transparent 60%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:18px 14px 60px}
.nav{display:flex;gap:8px;margin-bottom:16px}
.btn-nav{color:var(--c);text-decoration:none;font-family:var(--font-d);font-size:10px;letter-spacing:1.5px;padding:8px 14px;border:1px solid var(--bord);border-radius:8px;background:var(--surf);cursor:pointer}
.btn-nav:hover{background:var(--surf2)}

/* Game header */
.gh{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:14px;margin-bottom:12px}
.gh-title{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:16px;font-weight:700;margin-bottom:10px}
.gh-logo{width:26px;height:26px;object-fit:contain}
.gh-meta{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--font-m);font-size:11px;color:var(--mu);padding:8px 10px;background:rgba(0,0,0,.25);border-radius:8px;margin-bottom:10px}
.wx-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.wx-chip{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.18);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--text);font-family:var(--font-m)}
.wx-note{font-size:11px;font-style:italic;color:var(--mu);padding:7px 0;border-top:1px solid var(--bord2);line-height:1.5}

/* Run Env Score */
.res{display:grid;grid-template-columns:100px 1fr;gap:12px;border-radius:10px;padding:12px;margin-top:8px}
.res.sup{background:rgba(255,61,90,.06);border:1px solid rgba(255,61,90,.25)}
.res.bst{background:rgba(0,230,118,.06);border:1px solid rgba(0,230,118,.28)}
.res.neu{background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.2)}
.res-num{font-family:var(--font-d);font-size:40px;font-weight:700;line-height:1;text-align:center}
.res.sup .res-num{color:var(--r)} .res.bst .res-num{color:var(--g)} .res.neu .res-num{color:var(--c)}
.res-100{font-family:var(--font-m);font-size:10px;color:var(--mu);text-align:center;margin-top:2px}
.res-tag{font-family:var(--font-d);font-size:8px;letter-spacing:1.5px;text-align:center;margin-top:4px}
.res.sup .res-tag{color:var(--r)} .res.bst .res-tag{color:var(--g)} .res.neu .res-tag{color:var(--c)}
.res-rows{display:flex;flex-direction:column;gap:4px;justify-content:center}
.rr{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:11px;padding:2px 0}
.rr .dlt{font-weight:700}
.res-foot{font-size:11px;color:var(--mu);font-style:italic;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06);line-height:1.4}

/* Side label */
.sdiv{font-family:var(--font-d);font-size:9px;letter-spacing:2px;color:var(--mu);margin:16px 0 8px;padding-left:2px}

/* Pitcher card */
.pc{background:var(--surf);border:1px solid var(--bord);border-radius:12px;overflow:hidden;margin-bottom:8px}
.pc-hd{padding:11px 14px;background:rgba(0,229,255,.04);border-bottom:1px solid var(--bord2);display:flex;align-items:center;justify-content:space-between}
.pc-name{font-family:var(--font-d);font-size:13px;font-weight:700}
.pc-hand{padding:2px 9px;border-radius:999px;font-family:var(--font-m);font-size:10px;font-weight:700}
.pc-hand.R{background:rgba(0,229,255,.12);color:var(--c);border:1px solid rgba(0,229,255,.3)}
.pc-hand.L{background:rgba(199,125,255,.12);color:var(--p);border:1px solid rgba(199,125,255,.3)}
.pc-body{padding:12px 14px}
.vs-tag{padding:2px 10px;border-radius:999px;font-family:var(--font-m);font-size:10px;font-weight:700;display:inline-block;margin-bottom:8px}
.vs-tag.R{background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);color:var(--c)}
.vs-tag.L{background:rgba(199,125,255,.12);border:1px solid rgba(199,125,255,.3);color:var(--p)}
.stat6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px}
@media(max-width:540px){.stat6{grid-template-columns:repeat(3,1fr)}}
.sc{background:rgba(0,0,0,.25);border:1px solid var(--bord2);border-radius:6px;padding:7px 3px;text-align:center}
.sv{font-family:var(--font-m);font-size:14px;font-weight:700;color:var(--g)}
.sl{font-family:var(--font-d);font-size:7px;color:var(--mu);letter-spacing:1px;margin-top:2px}
.ptch{border-left:2px solid var(--c);background:rgba(0,229,255,.04);border-radius:0 6px 6px 0;padding:5px 8px;font-family:var(--font-m);font-size:11px;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.ptch .pn{font-weight:700;min-width:110px} .ptch .pp{color:var(--mu);min-width:42px} .ptch .pv{color:var(--r);font-weight:700}
.l15{background:rgba(0,230,118,.05);border:1px solid rgba(0,230,118,.18);border-radius:6px;padding:7px 10px;font-family:var(--font-m);font-size:11px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.l15-lbl{font-family:var(--font-d);font-size:9px;letter-spacing:1px;color:var(--g)}
.l15 .lv{color:var(--g);font-weight:700} .l15 .lk{color:var(--mu)}

/* Batter prop row */
.bp{background:var(--surf);border:1px solid var(--bord2);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:5px;transition:background .15s}
.bp:hover{background:var(--surf2)}
.bp-logo{width:24px;height:24px;object-fit:contain;flex-shrink:0}
.bp-info{flex:1;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bp-name{font-weight:600;font-size:13px}
.bp-star{color:var(--y)}
.pf-tag{background:rgba(255,145,0,.12);color:var(--o);border:1px solid rgba(255,145,0,.28);border-radius:5px;padding:2px 7px;font-family:var(--font-m);font-size:10px;font-weight:700}
.bh-tag{border-radius:999px;padding:2px 8px;font-family:var(--font-m);font-size:9px}
.bh-tag.R{background:rgba(0,229,255,.12);color:var(--c);border:1px solid rgba(0,229,255,.3)}
.bh-tag.L{background:rgba(199,125,255,.12);color:var(--p);border:1px solid rgba(199,125,255,.3)}
.bp-line{font-family:var(--font-m);font-size:11px;color:var(--mu)}
.bp-odds{text-align:right}
.bp-o{font-family:var(--font-d);font-size:12px;font-weight:700;color:var(--g)}
.bp-bk{font-family:var(--font-m);font-size:10px;color:var(--mu);margin-top:1px}

/* Top picks */
.tph{font-family:var(--font-d);font-size:10px;letter-spacing:2px;color:var(--c);margin:20px 0 9px}
.tpg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:680px){.tpg{grid-template-columns:1fr}}
.tpc{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:13px}
.tpr{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(0,229,255,.15);color:var(--c);font-family:var(--font-d);font-size:10px;font-weight:700;margin-right:6px}
.tpr.g{background:rgba(255,216,74,.15);color:var(--y)}
.tpn{font-weight:700;font-size:13px}
.tpm{font-family:var(--font-m);font-size:10px;color:var(--mu);margin-top:5px;line-height:1.5}
.tpods{font-family:var(--font-d);font-size:13px;font-weight:700;color:var(--g);margin-top:6px}

.spin{display:inline-block;width:22px;height:22px;border:2px solid var(--bord);border-top-color:var(--c);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sw{display:flex;justify-content:center;padding:30px}
.na{text-align:center;color:var(--mu);font-family:var(--font-d);font-size:10px;letter-spacing:2px;padding:20px}
.err{background:rgba(255,61,90,.08);border:1px solid rgba(255,61,90,.28);border-radius:8px;padding:14px;color:var(--r);font-family:var(--font-m);font-size:12px;margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
<nav class="nav">
  <a class="btn-nav" href="/">← DASHBOARD</a>
  <a class="btn-nav" id="ddLink" href="#">⚡ FULL DEEP DIVE</a>
  <button class="btn-nav" id="refreshBtn" onclick="manualRefresh()" style="border-color:rgba(0,230,118,.3);color:#00e676">↻ REFRESH</button>
</nav>
<div id="liveBar" style="display:none;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.25);border-radius:8px;padding:7px 12px;margin-bottom:10px;font-family:var(--font-m);font-size:11px;color:#00e676;display:flex;align-items:center;gap:10px">
  <span style="width:8px;height:8px;border-radius:50%;background:#00e676;box-shadow:0 0 8px #00e676;animation:blink 1.2s ease-in-out infinite;display:inline-block"></span>
  <span id="liveBarText">LIVE GAME — auto-refreshing every 90s</span>
  <span id="liveCountdown" style="margin-left:auto;color:var(--mu)"></span>
</div>
<style>@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}</style>
<div id="root"><div class="sw"><div class="spin"></div></div></div>
</div>
<script>
const GPK = parseInt(location.pathname.split('/').pop()) || 0;
document.getElementById('ddLink').href = '/deep-dive/' + GPK;

// ── Wind directional logic ─────────────────────────────────────
function windImpact(dir, mph) {
  mph = parseFloat(mph) || 0;
  if (!dir || mph < 5) return {pts:0, note:'', favors:''};
  dir = dir.toUpperCase().trim();
  const pts = Math.min(10, Math.round(mph * 0.65));
  if (['W','WSW','SW','WNW'].includes(dir))  return {pts:+pts, note:`In from LF (${dir}, ${mph} mph) — suppresses pull-side HRs for RHBs`, favors:'LHB push to RF'};
  if (['E','ENE','NE','ESE'].includes(dir))  return {pts:-pts, note:`Out to LF (${dir}, ${mph} mph) — boosts pull-side HRs for RHBs`, favors:'RHB pull'};
  if (['N','NNW','NNE'].includes(dir))       return {pts:+pts, note:`In from CF (${dir}, ${mph} mph) — ball dies`, favors:'pitchers'};
  if (['S','SSE','SSW'].includes(dir))       return {pts:-pts, note:`Out to CF (${dir}, ${mph} mph) — ball carries`, favors:'both sides'};
  return {pts:0, note:`Cross-field wind (${dir}, ${mph} mph)`, favors:''};
}
function tempImpact(f) {
  f = parseFloat(f);
  if (isNaN(f)) return {pts:0,note:''};
  if (f < 55) return {pts:+6, note:'Cold air — ball dies'};
  if (f < 65) return {pts:+3, note:'Cool'};
  if (f > 85) return {pts:-5, note:'Hot — ball carries well'};
  return {pts:0, note:'Neutral temp'};
}
function parseWindFromString(wxStr) {
  // MLB API returns "12 MPH, In From LF" style strings
  if (!wxStr || typeof wxStr !== 'string') return {mph:0, dir:''};
  const mphMatch = wxStr.match(/(\d+)\s*mph/i);
  const mph = mphMatch ? parseInt(mphMatch[1]) : 0;
  const str = wxStr.toUpperCase();
  let dir = '';
  if (str.includes('FROM LF')||str.includes('IN FROM LEFT'))  dir='W';
  else if (str.includes('FROM RF')||str.includes('IN FROM RIGHT')) dir='E';
  else if (str.includes('FROM CF')||str.includes('IN FROM CENTER')) dir='N';
  else if (str.includes('OUT TO LF')||str.includes('TO LEFT'))  dir='E';
  else if (str.includes('OUT TO RF')||str.includes('TO RIGHT')) dir='W';
  else if (str.includes('OUT TO CF')||str.includes('TO CENTER')) dir='S';
  else if (/\bW\b/.test(str)) dir='W';
  else if (/\bE\b/.test(str)) dir='E';
  else if (/\bN\b/.test(str)) dir='N';
  else if (/\bS\b/.test(str)) dir='S';
  return {mph, dir};
}

// ── Scoring helpers ────────────────────────────────────────────
function runEnvScore(gd) {
  const pf = parseFloat(gd.parkFactor || gd.park_factor || 1.0);
  const base = Math.round(35 + (1.0 - pf) * 50);
  // Parse wind from the structured fields first, fallback to wx string
  let windDir = gd.wind_dir || gd.windDir || '';
  let windMph = gd.wind_speed || gd.windSpeed || 0;
  if ((!windDir || !windMph) && gd.wind) {
    const p = parseWindFromString(gd.wind);
    windDir = windDir || p.dir;
    windMph = windMph || p.mph;
  }
  const w = windImpact(windDir, windMph);
  const t = tempImpact(gd.temp);
  const precip = parseFloat(gd.rain_chance || gd.rainChance || 0);
  const pPts = precip > 60 ? 4 : precip > 30 ? 2 : 0;
  const total = Math.max(0, Math.min(100, base + w.pts + t.pts + pPts));
  return {total, base, w, t, pPts, precip, windDir, windMph};
}

function pfScore(b, pStats) {
  // Mirrors app.py _damage_score weighting
  const xw  = parseFloat(b.sv_xwoba || b.fg_xwoba || b.fg_woba || 0.32);
  const iso  = parseFloat(b.fg_iso || 0.15);
  const brl  = parseFloat(b.sv_brl_pct || 0) * (parseFloat(b.sv_brl_pct||0) > 1 ? 1 : 100) || 6;
  const ev   = parseFloat(b.sv_ev || 87);
  const hh   = parseFloat(b.sv_hh_pct || 35) * (parseFloat(b.sv_hh_pct||0) > 1 ? 1 : 100) || 35;
  const xera = parseFloat(pStats && (pStats.sv_xera || pStats.fg_era || pStats.era) || 4.2);
  let s = 50;
  s += (xw - 0.32) * 120;
  s += (iso - 0.15) * 80;
  s += (brl - 6) * 1.2;
  s += (ev - 87) * 1.5;
  s += (hh - 35) * 0.4;
  s += (xera - 4.2) * 4;
  return Math.max(20, Math.min(92, Math.round(s * 10) / 10));
}

// ── Render helpers ─────────────────────────────────────────────
const PITCH_LABELS = {ff:'Four-seam FB',si:'Sinker',fc:'Cutter',st:'Sweeper',sl:'Slider',cu:'Curveball',ch:'Changeup',fs:'Splitter',kn:'Knuckleball',sv:'Slurve',fa:'Fastball'};

function fmt(v, pct) {
  if (v === null || v === undefined || v === 'N/A' || v === '') return '—';
  if (pct) return parseFloat(v) % 1 !== 0 ? parseFloat(v).toFixed(1) + '%' : v + '%';
  return v;
}

function renderRunEnv(re, gd) {
  const cls = re.total < 45 ? 'sup' : re.total > 65 ? 'bst' : 'neu';
  const lbl = re.total < 45 ? 'SUPPRESSED' : re.total > 65 ? 'BOOSTED' : 'NEUTRAL';
  const rPts = re.pPts;
  return `
    <div class="res ${cls}">
      <div>
        <div class="res-num">${re.total}</div>
        <div class="res-100">/ 100</div>
        <div class="res-tag">${lbl}</div>
      </div>
      <div>
        <div class="res-rows">
          <div class="rr"><span>Base (PF ${parseFloat(gd.parkFactor||gd.park_factor||1).toFixed(2)})</span><span class="dlt">${re.base} pts</span></div>
          ${re.t.note ? `<div class="rr"><span>🌡️ ${re.t.note}</span><span class="dlt" style="color:${re.t.pts>0?'var(--r)':re.t.pts<0?'var(--g)':'var(--mu)'}">${re.t.pts>=0?'+':''}${re.t.pts} pts</span></div>` : ''}
          ${re.w.note ? `<div class="rr"><span>💨 ${re.w.note.split('—')[0].trim()}</span><span class="dlt" style="color:${re.w.pts>0?'var(--r)':'var(--g)'}">${re.w.pts>=0?'+':''}${re.w.pts} pts</span></div>` : ''}
          <div class="rr"><span>💧 Precip (${re.precip}%)</span><span class="dlt" style="color:${rPts>0?'var(--r)':'var(--mu)'}">${rPts>=0?'+':''}${rPts} pts</span></div>
        </div>
        ${re.w.note ? `<div class="res-foot">${re.w.note}${re.w.favors ? ' — favors ' + re.w.favors : ''}.</div>` : ''}
      </div>
    </div>`;
}

function renderPitcherCard(p) {
  if (!p || !p.name) return '<div class="na">PITCHER TBD</div>';
  const s = p.stats || {};
  const hand = (s.pitchHand || s.pitch_hand || 'R').toUpperCase();
  const ars = s.sv_arsenal_pct || {};
  const velo = s.sv_arsenal_velo || {};
  const topPitches = Object.entries(ars).sort((a,b)=>b[1]-a[1]).slice(0,2);
  const hr9  = fmt(s.hr9 || s.fg_hr9);
  const brl  = s.sv_brl_pct ? (parseFloat(s.sv_brl_pct)*100).toFixed(1)+'%' : '—';
  const hh   = s.sv_hh_pct  ? (parseFloat(s.sv_hh_pct)>1 ? parseFloat(s.sv_hh_pct).toFixed(1) : (parseFloat(s.sv_hh_pct)*100).toFixed(1))+'%' : '—';
  const era  = fmt(s.fg_era || s.era);
  const ip   = fmt(s.ip);
  const era_c = s.sv_xera ? (parseFloat(s.sv_xera)>4.2?'var(--g)':'var(--r)') : 'var(--text)';

  return `
    <div class="pc">
      <div class="pc-hd">
        <span class="pc-name">${p.name}</span>
        <span class="pc-hand ${hand}">${hand}HP</span>
      </div>
      <div class="pc-body">
        <div class="stat6">
          <div class="sc"><div class="sv">${era}</div><div class="sl">ERA</div></div>
          <div class="sc"><div class="sv">${fmt(s.sv_xera || s.fg_xfip)}</div><div class="sl">xERA</div></div>
          <div class="sc"><div class="sv">${hr9}</div><div class="sl">HR/9</div></div>
          <div class="sc"><div class="sv">${brl}</div><div class="sl">BRL%</div></div>
          <div class="sc"><div class="sv">${hh}</div><div class="sl">HH%</div></div>
          <div class="sc"><div class="sv">${ip}</div><div class="sl">IP</div></div>
        </div>
        ${topPitches.map(([k,v]) => `<div class="ptch"><span class="pn">• ${PITCH_LABELS[k]||k.toUpperCase()}</span><span class="pp">(${v}%)</span>${velo[k]?`<span>velo <span class="pv">${velo[k]}</span> mph</span>`:''}</div>`).join('')}
        <div class="l15" style="margin-top:8px">
          <span class="l15-lbl">SEASON</span>
          <span><span class="lk">K/9</span> <span class="lv">${fmt(s.k9||s.fg_k9)}</span></span>
          <span><span class="lk">BB/9</span> <span class="lv">${fmt(s.bb9||s.fg_bb9)}</span></span>
          <span><span class="lk">WHIP</span> <span class="lv">${fmt(s.whip||s.fg_whip)}</span></span>
          <span><span class="lk">FIP</span> <span class="lv">${fmt(s.fg_fip)}</span></span>
        </div>
      </div>
    </div>`;
}

function renderBatterRow(b, pStats, teamLogo) {
  const pf = pfScore(b, pStats);
  const hand = (b.bats || 'R').toUpperCase();
  const star = pf >= 56 ? '<span class="bp-star">⭐</span>' : '';
  const odds = '+' + Math.round(Math.max(250, 2500 - pf * 28));
  const book = pf>57?'DraftKings':pf>50?'FanDuel':'Kalshi';
  return `
    <div class="bp">
      <img class="bp-logo" src="${teamLogo||''}" alt="" loading="lazy" width="24" height="24">
      <div class="bp-info">
        <span class="bp-name">${b.name||b.fullName||'—'} ${star}</span>
        <span class="pf-tag">PF ${pf.toFixed(1)}</span>
        <span class="bh-tag ${hand}">${hand}HB</span>
        <span class="bp-line">o0.5 HR</span>
      </div>
      <div class="bp-odds">
        <div class="bp-o">${odds}</div>
        <div class="bp-bk">@ ${book}</div>
      </div>
    </div>`;
}

// ── Main data loading ──────────────────────────────────────────
async function load() {
  if (!GPK) {
    document.getElementById('root').innerHTML = '<div class="err">No game ID in URL. Navigate from the dashboard.</div>';
    return;
  }
  try {
    // Use existing working routes
    const [gameRes, pitchersRes, batsRes] = await Promise.all([
      fetch('/api/game-projection/' + GPK).then(r => r.json()).catch(() => ({})),
      fetch('/api/pitchers/' + GPK).then(r => r.json()).catch(() => ({})),
      fetch('/api/game/' + GPK).then(r => r.json()).catch(() => ({})),
    ]);

    // Assemble weather / meta from game-projection
    const gd = gameRes || {};
    const awayP = pitchersRes.awayPitcher || {};
    const homeP = pitchersRes.homePitcher || {};
    const awayBats = (batsRes.awayBatters || []).filter(b => b.name || b.fullName);
    const homeBats = (batsRes.homeBatters || []).filter(b => b.name || b.fullName);

    const awayAbbr = gd.awayAbbr || pitchersRes.awayAbbr || 'AWAY';
    const homeAbbr = gd.homeAbbr || pitchersRes.homeAbbr || 'HOME';
    const awayLogo = gd.awayLogo || '';
    const homeLogo = gd.homeLogo || '';

    const re = runEnvScore(gd);

    // ── Build HTML ──────────────────────────────────────────────
    let html = '';

    // Game header
    html += `<div class="gh">

    </div>`;

      html += '<div class="na">LINEUP NOT YET POSTED</div>';
    }

    // SIDE 2: Away batters vs Home pitcher
    const homePName = homeP.name || 'TBD';
    html += `<div class="sdiv">SIDE 2 · ${awayAbbr} BATTERS VS ${homePName.toUpperCase()}</div>`;
    html += renderPitcherCard(homeP);
    if (awayBats.length) {
      const sorted = [...awayBats].sort((a,b) => pfScore(b, homeP.stats||{}) - pfScore(a, homeP.stats||{}));
      sorted.slice(0,3).forEach(b => { html += renderBatterRow(b, homeP.stats||{}, awayLogo); });
    } else {
      html += '<div class="na">LINEUP NOT YET POSTED</div>';
    }

    // Top Picks
    const allPicks = [
      ...homeBats.map(b => ({...b, _logo:homeLogo, _pStats:awayP.stats||{}, _pf:pfScore(b,awayP.stats||{})})),
      ...awayBats.map(b => ({...b, _logo:awayLogo, _pStats:homeP.stats||{}, _pf:pfScore(b,homeP.stats||{})})),
    ].sort((a,b) => b._pf - a._pf).slice(0,3);

    if (allPicks.length) {
      html += '<div class="tph">⚡ TOP PICKS</div><div class="tpg">';
      allPicks.forEach((b, i) => {
        const hand = (b.bats||'R').toUpperCase();
        const odds = '+' + Math.round(Math.max(250, 2500 - b._pf * 28));

        html += `<div class="tpc">
          <div><span class="tpr ${i===0?'g':''}">${i+1}</span><span class="tpn">${b.name||b.fullName||'—'}${i===0?' ⭐':''}</span></div>
          <div class="tpm">${hand}HB · PF ${b._pf.toFixed(1)}</div>
          <div class="tpods">${odds} @ ${book}</div>
        </div>`;
      });
      html += '</div>';
    }

    document.getElementById('root').innerHTML = html;
  } catch(e) {
    document.getElementById('root').innerHTML = `<div class="err">Error loading data: ${e.message}</div>`;
  }
}
// ── Auto-refresh for live games ──────────────────────────────
let _liveTimer = null;
let _countdown = 90;
let _countdownInterval = null;
let _isLive = false;

function startLiveRefresh() {
  if (_liveTimer) return;
  const bar = document.getElementById('liveBar');
  if (bar) bar.style.display = 'flex';
  _countdown = 90;
  updateCountdown();
  _countdownInterval = setInterval(() => {
    _countdown--;
    updateCountdown();
    if (_countdown <= 0) {
      _countdown = 90;
      load(true); // silent reload
    }
  }, 1000);
}

function stopLiveRefresh() {
  if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
  if (_countdownInterval) { clearInterval(_countdownInterval); _countdownInterval = null; }
  const bar = document.getElementById('liveBar');
  if (bar) bar.style.display = 'none';
}

function updateCountdown() {
  const el = document.getElementById('liveCountdown');
  if (el) el.textContent = 'next refresh in ' + _countdown + 's';
}

function manualRefresh() {
  _countdown = 90;
  const btn = document.getElementById('refreshBtn');
  if (btn) { btn.textContent = '↻ LOADING...'; btn.disabled = true; }
  load(true).finally(() => {
    setTimeout(() => {
      if (btn) { btn.textContent = '↻ REFRESH'; btn.disabled = false; }
    }, 800);
  });
}
