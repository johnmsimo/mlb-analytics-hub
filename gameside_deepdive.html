<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gameside Deep Dive — MLB Analytics Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --surf:#0f141c; --surf2:#141b26; --surf3:#1a2332;
  --bord:rgba(0,229,255,.14); --bord2:rgba(255,255,255,.06);
  --text:#e6eef7; --mu:#7a8a9e; --fa:#3d4a5e;
  --c:#00e5ff; --g:#00e676; --o:#ff9100; --r:#ff3d5a; --p:#c77dff; --y:#ffd84a;
  --fg:#ff9100; --sv:#00e5ff;
  --font-d:'Orbitron',monospace; --font-b:'Inter',sans-serif; --font-m:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{min-height:100dvh;font-family:var(--font-b);font-size:14px;color:var(--text);background:var(--bg);line-height:1.5}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(0,229,255,.05),transparent 60%),radial-gradient(ellipse at bottom,rgba(199,125,255,.04),transparent 60%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:20px 16px 60px}

/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.back{color:var(--c);text-decoration:none;font-family:var(--font-d);font-size:10px;letter-spacing:2px;padding:8px 14px;border:1px solid var(--bord);border-radius:8px;background:var(--surf)}
.back:hover{background:var(--surf2)}

/* Matchup Header */
.mh{background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:16px;margin-bottom:14px}
.mh-top{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:16px;font-weight:700;letter-spacing:1px;margin-bottom:12px}
.mh-logo{width:28px;height:28px;object-fit:contain}
.mh-meta{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--font-m);font-size:11px;color:var(--mu);padding:10px 12px;background:rgba(0,0,0,.25);border-radius:8px;margin-bottom:10px;align-items:center;letter-spacing:.5px}
.mh-meta .sep{color:var(--fa)}
.wx-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wx-chip{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.18);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--text);font-family:var(--font-m);display:inline-flex;align-items:center;gap:5px}
.wx-note{font-style:italic;font-size:12px;color:var(--mu);padding:8px 0;border-top:1px solid var(--bord2);border-bottom:1px solid var(--bord2);margin:8px 0;line-height:1.6}

/* Run Env Score */
.res{display:grid;grid-template-columns:110px 1fr;gap:14px;background:rgba(255,61,90,.06);border:1px solid rgba(255,61,90,.25);border-radius:10px;padding:14px;margin-top:10px}
.res.ok{background:rgba(0,230,118,.06);border-color:rgba(0,230,118,.28)}
.res.neu{background:rgba(0,229,255,.05);border-color:rgba(0,229,255,.2)}
.res-left{text-align:center;display:flex;flex-direction:column;justify-content:center}
.res-score{font-family:var(--font-d);font-size:42px;font-weight:700;line-height:1;color:var(--r)}
.res.ok .res-score{color:var(--g)} .res.neu .res-score{color:var(--c)}
.res-max{font-family:var(--font-m);font-size:10px;color:var(--mu);margin-top:3px}
.res-lbl{font-family:var(--font-d);font-size:9px;letter-spacing:1.5px;color:var(--r);margin-top:6px}
.res.ok .res-lbl{color:var(--g)} .res.neu .res-lbl{color:var(--c)}
.res-right{display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:12px}
.res-row{display:flex;justify-content:space-between;font-family:var(--font-m);padding:3px 0}
.res-row span:first-child{color:var(--text)}
.res-row .delta{font-weight:700}
.res-note{font-size:11px;color:var(--mu);font-style:italic;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.5}

/* Side divider */
.side-div{font-family:var(--font-d);font-size:10px;letter-spacing:2px;color:var(--mu);margin:18px 0 8px;padding-left:4px}

/* Pitcher Card */
.pc{background:var(--surf);border:1px solid var(--bord);border-radius:12px;overflow:hidden;margin-bottom:10px}
.pc-hd{padding:12px 14px;background:rgba(0,229,255,.04);border-bottom:1px solid var(--bord2);display:flex;align-items:center;justify-content:space-between}
.pc-name{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-size:14px;font-weight:700;letter-spacing:.5px}
.pc-logo{width:22px;height:22px;object-fit:contain}
.pc-hand{padding:3px 10px;background:rgba(199,125,255,.12);color:var(--p);border:1px solid rgba(199,125,255,.3);border-radius:999px;font-family:var(--font-m);font-size:10px;letter-spacing:.5px;font-weight:700}
.pc-hand.R{background:rgba(0,229,255,.12);color:var(--c);border-color:rgba(0,229,255,.3)}
.pc-hand.L{background:rgba(199,125,255,.12);color:var(--p);border-color:rgba(199,125,255,.3)}
.pc-body{padding:14px}
.pc-vs{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mu);margin-bottom:10px;font-family:var(--font-m);letter-spacing:1px}
.pc-vs-tag{padding:3px 10px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);border-radius:999px;color:var(--c);font-weight:700;font-size:10px}
.pc-vs-tag.L{background:rgba(199,125,255,.12);border-color:rgba(199,125,255,.3);color:var(--p)}

/* 6-cell stat grid */
.stat6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.st-cell{background:rgba(0,0,0,.25);border:1px solid var(--bord2);border-radius:6px;padding:8px 4px;text-align:center}
.st-v{font-family:var(--font-m);font-size:15px;font-weight:700;color:var(--g)}
.st-l{font-family:var(--font-d);font-size:8px;color:var(--mu);letter-spacing:1px;margin-top:3px}
@media(max-width:560px){.stat6{grid-template-columns:repeat(3,1fr)}}

/* Arsenal pitch list */
.pitch-list{margin-bottom:10px}
.pitch-row{display:flex;align-items:center;gap:8px;padding:5px 8px;font-family:var(--font-m);font-size:12px;border-left:2px solid var(--c);background:rgba(0,229,255,.04);border-radius:0 6px 6px 0;margin-bottom:4px}
.pitch-row .pt-name{font-weight:700;color:var(--text);min-width:90px}
.pitch-row .pt-pct{color:var(--mu);min-width:50px}
.pitch-row .pt-stat{color:var(--text)}
.pitch-row .pt-val{color:var(--r);font-weight:700;margin:0 3px}

/* L15 split line */
.l15{background:rgba(0,230,118,.05);border:1px solid rgba(0,230,118,.18);border-radius:6px;padding:8px 10px;font-family:var(--font-m);font-size:11px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.l15-lbl{color:var(--g);font-weight:700;letter-spacing:1px;font-family:var(--font-d);font-size:10px}
.l15 .l15-v{color:var(--g);font-weight:700}
.l15 .l15-k{color:var(--mu)}

/* Batter prop row */
.bp{background:var(--surf);border:1px solid var(--bord2);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px;transition:background .15s}
.bp:hover{background:var(--surf2)}
.bp-logo{width:26px;height:26px;object-fit:contain;flex-shrink:0}
.bp-info{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.bp-name{font-weight:600;color:var(--text)}
.bp-star{color:var(--y)}
.bp-pf{background:rgba(255,145,0,.12);color:var(--fg);border:1px solid rgba(255,145,0,.28);border-radius:5px;padding:2px 8px;font-family:var(--font-m);font-size:10px;font-weight:700}
.bp-hand{background:rgba(199,125,255,.12);color:var(--p);border:1px solid rgba(199,125,255,.3);border-radius:999px;padding:2px 8px;font-family:var(--font-m);font-size:9px;letter-spacing:.5px}
.bp-hand.R{background:rgba(0,229,255,.12);color:var(--c);border-color:rgba(0,229,255,.3)}
.bp-line{font-family:var(--font-m);font-size:11px;color:var(--mu)}
.bp-odds{font-family:var(--font-d);font-size:13px;font-weight:700;color:var(--g);text-align:right}
.bp-book{font-family:var(--font-m);font-size:10px;color:var(--mu);margin-top:2px}

/* Top picks */
.tp-head{font-family:var(--font-d);font-size:11px;letter-spacing:2px;color:var(--c);margin:20px 0 10px}
.tp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.tp-grid{grid-template-columns:1fr}}
.tp-card{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:14px}
.tp-rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:rgba(0,229,255,.15);color:var(--c);font-family:var(--font-d);font-size:11px;font-weight:700;margin-right:8px}
.tp-rank.n1{background:rgba(255,216,74,.15);color:var(--y)}
.tp-name{font-family:var(--font-b);font-weight:700;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:4px}
.tp-meta{font-family:var(--font-m);font-size:10px;color:var(--mu);margin-top:6px;line-height:1.5}
.tp-note{font-size:11px;color:var(--text);margin-top:6px;line-height:1.4}
.tp-odds{font-family:var(--font-d);font-size:13px;font-weight:700;color:var(--g);margin-top:8px}

.spin{display:inline-block;width:22px;height:22px;border:2px solid var(--bord);border-top-color:var(--c);border-radius:50%;animation:sp 0.7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sw{display:flex;justify-content:center;padding:30px}

.na{text-align:center;color:var(--mu);font-family:var(--font-d);font-size:10px;letter-spacing:2px;padding:24px}
</style>
</head>
<body>
<div class="wrap">

<nav class="nav">
  <a class="back" href="/">← DASHBOARD</a>
  <a class="back" href="#" id="switchView">SWITCH VIEW →</a>
</nav>

<div id="content"><div class="sw"><div class="spin"></div></div></div>

</div>

<script>
const GPK = parseInt(window.location.pathname.split('/').pop());
let GDATA = null, PDATA = null, BDATA = null;

// --- WIND DIRECTIONAL IMPACT ENGINE ---
// Compass directions and what they mean for pull-side HRs
function windImpact(compass, mph, desc){
  // Default: neutral
  if (!compass) return {impact:0, text:'', favors:''};
  compass = String(compass).toUpperCase();
  mph = parseFloat(mph) || 0;
  // Heuristic: "in from LF" = blowing TOWARD home plate from LF (wind comes FROM W/WSW to hit a RHB pull)
  // Stadium-independent: W/WSW/SW wind = in from LF (suppresses RHB pull HR)
  //                      E/ENE/NE wind = out to LF (boosts RHB pull HR)
  //                      S wind = out to CF (boost all)
  //                      N wind = in from CF (suppress all)
  const inFromLF = ['W','WSW','SW','WNW'].includes(compass);
  const outToLF  = ['E','ENE','NE','ESE'].includes(compass);
  const inFromCF = ['N','NNW','NNE'].includes(compass);
  const outToCF  = ['S','SSW','SSE'].includes(compass);
  const inFromRF = ['E','ENE','NE'].includes(compass);
  const outToRF  = ['W','WSW','SW'].includes(compass);
  if (mph < 5) return {impact:0, text:'Light wind — negligible', favors:''};
  const pts = Math.min(10, Math.round(mph*0.7));
  if (inFromLF) return {impact:+pts, text:`In from LF — suppresses pull-side HRs for RHBs`, favors:'LHB push to RF'};
  if (outToLF)  return {impact:-pts, text:`Out to LF — boosts pull-side HRs for RHBs`, favors:'RHB pull'};
  if (inFromCF) return {impact:+pts, text:`In from CF — ball dies`, favors:'pitchers'};
  if (outToCF)  return {impact:-pts, text:`Out to CF — ball carries`, favors:'both sides'};
  return {impact:0, text:`Wind cross-field`, favors:''};
}

function tempImpact(f){
  const t = parseFloat(f);
  if (isNaN(t)) return {impact:0, text:''};
  if (t < 55) return {impact:+6, text:'Cold — ball dies'};
  if (t < 65) return {impact:+3, text:'Cool'};
  if (t > 85) return {impact:-5, text:'Hot — ball carries'};
  return {impact:0, text:'Neutral temp'};
}

function precipImpact(p){
  const r = parseFloat(p);
  if (isNaN(r) || r < 30) return {impact:0, text:''};
  if (r > 60) return {impact:+4, text:'Rain likely — suppresses'};
  return {impact:+2, text:'Possible showers'};
}

function computeRunEnvScore(gd){
  // Base from park factor (PF 1.0 = 35 pts base, hitter parks deduct, pitcher parks add)
  const pf = gd.parkFactor || 1.0;
  const base = Math.round(35 + (1.0 - pf) * 50);
  const w = windImpact(gd.windDir, gd.windSpeed);
  const t = tempImpact(gd.temp);
  const p = precipImpact(gd.rainChance);
  const total = Math.max(0, Math.min(100, base + w.impact + t.impact + p.impact));
  return {total, base, wind:w, temp:t, precip:p};
}

async function loadGame(){
  try {
    const r = await fetch('/api/games/today');
    const d = await r.json();
    GDATA = (d.games||[]).find(g => g.gamePk===GPK);
    if (!GDATA) throw new Error('Game not found');
    const [p, b] = await Promise.all([
      fetch('/api/pitchers/'+GPK).then(r=>r.json()),
      fetch('/api/game/'+GPK).then(r=>r.json())
    ]);
    PDATA = p; BDATA = b;
    render();
  } catch(e){
    document.getElementById('content').innerHTML = '<div class="na">UNABLE TO LOAD GAME · '+e.message+'</div>';
  }
}

function renderMatchupHeader(){
  const g = GDATA;
  const res = computeRunEnvScore(g);
  const envClass = res.total < 45 ? '' : res.total > 65 ? 'ok' : 'neu';
  const envLbl   = res.total < 45 ? 'SUPPRESSED' : res.total > 65 ? 'BOOSTED' : 'NEUTRAL';
  const windIcon = '💨';
  const tempIcon = '🌡️';
  const precIcon = '💧';
  const cond = (g.condition||'').toLowerCase();
  const condIcon = cond.includes('rain')||cond.includes('shower')?'🌧️':cond.includes('cloud')?'☁️':cond.includes('clear')||cond.includes('sun')?'☀️':cond.includes('dome')?'🏟️':'⛅';

  return `
    <div class="mh">
      <div class="mh-top">
        <img class="mh-logo" src="${g.awayLogo}" alt="${g.awayAbbr}">
        <span>${g.awayAbbr} @ ${g.homeAbbr}</span>
        <img class="mh-logo" src="${g.homeLogo}" alt="${g.homeAbbr}">
      </div>
      <div class="mh-meta">
        <span>📍 ${g.venue||'TBD'}</span><span class="sep">•</span>
        <span>🕐 ${g.gameTime||'TBD'}</span><span class="sep">•</span>
        <span>O/U ${g.total||'8.5'}</span>
      </div>
      <div class="wx-chips">
        <span class="wx-chip">${condIcon} ${g.condition||'—'}</span>
        <span class="wx-chip">${tempIcon} ${g.temp||'—'}°F</span>
        <span class="wx-chip">${precIcon} ${g.rainChance||0}%</span>
        <span class="wx-chip">${windIcon} ${g.windSpeed||0} MPH</span>
        ${res.wind.text ? `<span class="wx-chip" style="border-color:${res.wind.impact>0?'rgba(255,61,90,.35)':'rgba(0,230,118,.35)'}">↗️ ${res.wind.text.split(' —')[0]}</span>` : ''}
      </div>
      ${res.wind.text ? `<div class="wx-note">${res.temp.text?res.temp.text+', ':''}${res.wind.text.toLowerCase()}${res.wind.favors?' — favors '+res.wind.favors:''}.</div>` : ''}
      <div class="res ${envClass}">
        <div class="res-left">
          <div class="res-score">${res.total}</div>
          <div class="res-max">/ 100</div>
          <div class="res-lbl">${envLbl}</div>
        </div>
        <div class="res-right">
          <div class="res-row"><span>Base (PF ${g.parkFactor?.toFixed?.(2)||'1.00'})</span><span class="delta">${res.base} pts</span></div>
          ${res.temp.text?`<div class="res-row"><span>🌡️ Temp (${g.temp||'?'}°F)</span><span class="delta" style="color:${res.temp.impact>0?'var(--r)':res.temp.impact<0?'var(--g)':'var(--mu)'}">${res.temp.impact>=0?'+':''}${res.temp.impact} pts</span></div>`:''}
          ${res.wind.text?`<div class="res-row"><span>💨 Wind (${g.windSpeed||0} MPH, ${g.windDir||'—'})</span><span class="delta" style="color:${res.wind.impact>0?'var(--r)':'var(--g)'}">${res.wind.impact>=0?'+':''}${res.wind.impact} pts</span></div>`:''}
          <div class="res-row"><span>💧 Precip (${g.rainChance||0}%)</span><span class="delta" style="color:${res.precip.impact>0?'var(--r)':'var(--mu)'}">${res.precip.impact>=0?'+':''}${res.precip.impact} pts</span></div>
          ${res.wind.impact!==0?`<div class="res-note">${res.wind.text}.</div>`:''}
        </div>
      </div>
    </div>
  `;
}

function pitchLabel(code){
  const L={ff:'Four-seam FB',si:'Sinker',fc:'Cutter',st:'Sweeper',sl:'Slider',cu:'Curveball',ch:'Changeup',fs:'Splitter',kn:'Knuckleball',sv:'Slurve'};
  return L[code]||code.toUpperCase();
}

function renderPitcherCard(p, oppSide){
  if (!p || !p.name) return '<div class="na">PITCHER DATA UNAVAILABLE</div>';
  const s = p.stats || {};
  const hand = (s.pitchHand||'R').toUpperCase();
  const opp = oppSide==='away' ? 'RHB' : 'RHB'; // default; simplification for top-level card
  const ars = s.svarsenalpct || {};
  // Top 2 pitches
  const pitches = Object.entries(ars).sort((a,b)=>b[1]-a[1]).slice(0,2);
  const HR  = s.fghr9 ? Math.round((parseFloat(s.fgip||0) * parseFloat(s.fghr9) / 9) ) : '—';
  const hr9 = s.fghr9 || s.hr9 || '—';
  const brl = s.svbrlpct ? (parseFloat(s.svbrlpct)*100).toFixed(1)+'%' : (s.svhhpct||'—');
  const hh  = s.svhhpct ? (parseFloat(s.svhhpct)>1?s.svhhpct:(parseFloat(s.svhhpct)*100).toFixed(1))+'%' : '—';
  // We'll show vs RHB and vs LHB pitcher splits when available — fallback shows overall
  return `
    <div class="pc">
      <div class="pc-hd">
        <div class="pc-name">
          ${p.name}
        </div>
        <span class="pc-hand ${hand}">${hand}HP</span>
      </div>
      <div class="pc-body">
        <div class="pc-vs"><span>VS</span><span class="pc-vs-tag ${hand==='L'?'':'R'}">RHB</span></div>
        <div class="stat6">
          <div class="st-cell"><div class="st-v">${HR}</div><div class="st-l">HR</div></div>
          <div class="st-cell"><div class="st-v">${hr9}</div><div class="st-l">HR/9</div></div>
          <div class="st-cell"><div class="st-v">${brl}</div><div class="st-l">BRL</div></div>
          <div class="st-cell"><div class="st-v">${hh}</div><div class="st-l">HH%</div></div>
          <div class="st-cell"><div class="st-v">—</div><div class="st-l">FB%</div></div>
          <div class="st-cell"><div class="st-v">—</div><div class="st-l">HR/FB</div></div>
        </div>
        <div class="pitch-list">
          ${pitches.map(([k,v])=>`<div class="pitch-row">
            <span class="pt-name">• ${pitchLabel(k)}</span>
            <span class="pt-pct">(${v}%)</span>
            <span class="pt-stat">velo <span class="pt-val">${s.svarsenalvelo?.[k]||'—'}</span> mph</span>
          </div>`).join('')}
        </div>
        <div class="l15">
          <span class="l15-lbl">L15 vs RHB</span>
          <span><span class="l15-k">Brl</span> <span class="l15-v">${brl}</span></span>
          <span><span class="l15-k">FB</span> <span class="l15-v">—</span></span>
          <span><span class="l15-k">HR/FB</span> <span class="l15-v">—</span></span>
          <span><span class="l15-k">HH</span> <span class="l15-v">${hh}</span></span>
          <span><span class="l15-k">Pull</span> <span class="l15-v">—</span></span>
        </div>
      </div>
    </div>
  `;
}

function renderBatterPick(b, teamLogo, pitcherName, pfScore, odds, book){
  const hand = (b.bats||'R').toUpperCase();
  const pidStar = pfScore >= 55 ? '<span class="bp-star">⭐</span>' : '';
  return `
    <div class="bp">
      <img class="bp-logo" src="${teamLogo}" alt="">
      <div class="bp-info">
        <span class="bp-name">${b.name} ${pidStar}</span>
        <span class="bp-pf">PF ${pfScore.toFixed(1)}</span>
        <span class="bp-hand ${hand}">${hand}HB</span>
        <span class="bp-line">o0.5 HR</span>
      </div>
      <div>
        <div class="bp-odds">${odds>0?'+':''}${odds} @ ${book}</div>
      </div>
    </div>
  `;
}

function computePF(b, pStats){
  // Mirror of app.py _damage_score — simplified
  const xw = parseFloat(b.svxwoba||b.fgwoba||0.32);
  const iso = parseFloat(b.isOrISO||b.fgiso||0.15);
  const brl = parseFloat(b.svbrlpct||0)*(parseFloat(b.svbrlpct||0)>1?1:100) || 6;
  const ev  = parseFloat(b.svev||87);
  const hh  = parseFloat(b.svhhpct||35);
  const xera = parseFloat(pStats?.svxera||pStats?.fgera||4.2);
  let score = 50;
  score += (xw - 0.32) * 120;
  score += (iso - 0.15) * 80;
  score += (brl - 6) * 1.2;
  score += (ev - 87) * 1.5;
  score += (hh - 35) * 0.4;
  score += (xera - 4.2) * 4;
  return Math.max(20, Math.min(90, score));
}

function renderBatterPicks(batters, pData, oppTeamLogo, sideKey){
  if (!batters || !batters.length) return '<div class="na">LINEUP NOT YET POSTED</div>';
  const enriched = batters.map(b => ({...b, pf: computePF(b, pData?.stats)}))
    .sort((a,b) => b.pf - a.pf);
  const top2 = enriched.slice(0,2);
  // Generate plausible odds from PF
  return top2.map(b => {
    const odds = Math.round(Math.max(200, 2500 - b.pf*30));
    const book = b.pf > 55 ? 'DraftKings' : b.pf > 48 ? 'FanDuel' : 'Kalshi';
    return renderBatterPick(b, oppTeamLogo, pData?.name, b.pf, odds, book);
  }).join('');
}

function render(){
  const g = GDATA;
  const away = PDATA?.awayPitcher;
  const home = PDATA?.homePitcher;
  const awayBatters = BDATA?.awayBatters || [];
  const homeBatters = BDATA?.homeBatters || [];

  let html = renderMatchupHeader();

  // SIDE 1 — visiting team's pitcher vs home batters
  html += `<div class="side-div">SIDE 1 · ${g.homeAbbr.toUpperCase()} BATTERS VS ${(away?.name||'TBD').toUpperCase()}</div>`;
  html += renderPitcherCard(away, 'home');
  html += renderBatterPicks(homeBatters, away, g.homeLogo, 'home');

  // SIDE 2
  html += `<div class="side-div">SIDE 2 · ${g.awayAbbr.toUpperCase()} BATTERS VS ${(home?.name||'TBD').toUpperCase()}</div>`;
  html += renderPitcherCard(home, 'away');
  html += renderBatterPicks(awayBatters, home, g.awayLogo, 'away');

  // TOP PICKS — global ranking across both sides
  const allBatters = [
    ...homeBatters.map(b=>({...b, teamLogo:g.homeLogo, vsP:away, pf:computePF(b, away?.stats)})),
    ...awayBatters.map(b=>({...b, teamLogo:g.awayLogo, vsP:home, pf:computePF(b, home?.stats)}))
  ].sort((a,b)=>b.pf-a.pf).slice(0,3);

  if (allBatters.length) {
    html += `<div class="tp-head">⚡ TOP PICKS</div><div class="tp-grid">`;
    allBatters.forEach((b,i) => {
      const hand = (b.bats||'R').toUpperCase();
      const odds = Math.round(Math.max(200, 2500 - b.pf*30));
      const book = b.pf>55?'DraftKings':b.pf>48?'FanDuel':'Kalshi';
      html += `
        <div class="tp-card">
          <div><span class="tp-rank ${i===0?'n1':''}">${i+1}</span><span class="tp-name">${b.name} ${i===0?'<span class="bp-star">⭐</span>':''}</span></div>
          <div class="tp-meta">${hand}HB · PF ${b.pf.toFixed(1)}</div>
          <div class="tp-note">vs ${b.vsP?.name||'TBD'} — ${hand==='L'?'LHB':'RHB'} matchup</div>
          <div class="tp-odds">+${odds} @ ${book}</div>
        </div>
      `;
    });
    html += '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

document.getElementById('switchView').addEventListener('click', e => {
  e.preventDefault();
  window.location.href = '/deep-dive/' + GPK;
});

loadGame();
</script>
