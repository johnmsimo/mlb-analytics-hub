name: Quality and Deploy
on:
  pull_request:
    branches: [Main]
  push:
    branches: [Main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'mlb-analytics-hub-production' || format('quality-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run regression suite
        env:
          APP_ENV: test
          PROCESS_ROLE: test
          ADMIN_AUTH_REQUIRED: '0'
        run: python -m pytest -q
      - name: Validate inline JavaScript
        run: python scripts/validate_inline_js.py
      - name: Validate current production contract
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/production_contract_gate.py
          --base-url https://mlb-analytics-hub.fly.dev
          --baseline
          --release-attempts 3
          --contract-attempts 2
          --retry-delay 3

  deploy:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Capture current rollback image
        id: rollback
        run: |
          image=$(flyctl releases --app mlb-analytics-hub --image | grep -Eo 'registry\.fly\.io/[^[:space:]]+' | head -1)
          echo "image=$image" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy tested commit
        id: deploy
        run: >-
          python3 scripts/deploy_with_lease_retry.py
          --attempts 4
          --base-delay 15
          --
          flyctl deploy --remote-only
          --build-arg GIT_SHA=${{ github.sha }}
          --image-label ${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Production smoke and readiness gate
        id: smoke
        run: >-
          python3 scripts/production_contract_gate.py
          --base-url https://mlb-analytics-hub.fly.dev
          --expected-sha ${{ github.sha }}
      - name: Roll back failed deployment or production smoke
        id: rollback_deploy
        if: failure() && steps.rollback.outputs.image != '' && steps.deploy.outcome != 'skipped'
        run: >-
          python3 scripts/deploy_with_lease_retry.py
          --attempts 4
          --base-delay 15
          --
          flyctl deploy
          --image ${{ steps.rollback.outputs.image }}
          --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Record deployment provenance
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback_deploy.outcome }}
          ROLLBACK_IMAGE: ${{ steps.rollback.outputs.image }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Production deployment provenance"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source | GitHub Actions |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Run | [$GITHUB_RUN_ID]($RUN_URL) |"
            echo "| Deploy | $DEPLOY_OUTCOME |"
            echo "| Production smoke | $SMOKE_OUTCOME |"
            echo "| Rollback | $ROLLBACK_OUTCOME |"
            echo "| Captured rollback image | $ROLLBACK_IMAGE |"
            echo "| Application | https://mlb-analytics-hub.fly.dev |"
          } >> "$GITHUB_STEP_SUMMARY"
