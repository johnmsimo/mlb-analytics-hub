name: Deploy to Fly.io
on:
  push:
    branches: [Main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # setup-flyctl installs the binary as `flyctl` (no `fly` alias on the
      # runner), so `fly deploy` failed with "fly: command not found" (exit
      # 127) on every run since June 2026 — no deploy reached production.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
