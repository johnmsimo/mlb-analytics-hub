<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitcher Deep Dive – MLB Analytics Hub</title>
<style>
/* ── TOKENS (matching your app's dark theme) ── */
:root {
  --bg: #0a0e14;
  --surface: #111620;
  --surface2: #161c28;
  --border: rgba(0,229,255,.12);
  --t: #e0e6f0;
  --mu: #6a8db0;
  --faint: #3a4a5c;
  --c: #00e5ff;    /* cyan accent */
  --g: #00e676;    /* green */
  --o: #ff9800;    /* orange */
  --m: #e040fb;    /* magenta/purple */
  --fg: #ff9100;   /* fangraphs orange */
  --sv: #00e5ff;   /* savant cyan */
  --r: #f44336;    /* red/bad */
  --warn: #ffd740;
  font-family: 'Inter', 'Segoe UI', sans-serif;
  font-size: 14px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--t); min-height: 100vh; }

/* ── NAV ── */
nav {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand-name { font-family: 'Orbitron', monospace; font-size: .78rem; color: var(--c); letter-spacing: 2px; }
.brand-sub { font-size: .62rem; color: var(--mu); letter-spacing: 1px; }
.back { font-size: .68rem; color: var(--mu); text-decoration: none; margin-left: auto; }
.back:hover { color: var(--c); }

/* ── CONTAINER ── */
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

/* ── PITCHER SELECTOR BAR ── */
.sel-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
}
.sel-bar label { font-size: .65rem; color: var(--mu); letter-spacing: 1px; text-transform: uppercase; }
.sel-bar select {
  background: var(--bg); color: var(--t); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; font-size: .78rem; flex: 1; min-width: 200px; cursor: pointer;
}
.sel-bar select:focus { outline: none; border-color: var(--c); }
.load-btn {
  background: rgba(0,229,255,.1); border: 1px solid rgba(0,229,255,.3);
  color: var(--c); border-radius: 6px; padding: 6px 16px;
  font-family: 'Orbitron', monospace; font-size: .65rem; letter-spacing: 1px;
  cursor: pointer; transition: all .2s;
}
.load-btn:hover { background: rgba(0,229,255,.2); }

/* ── PITCHER CARD GRID ── */
.pitcher-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  margin-bottom: 16px;
}
@media (max-width: 680px) { .pitcher-grid { grid-template-columns: 1fr; } }

/* ── PITCHER CARD ── */
.pc {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
}
.pc-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 10px;
  background: rgba(0,229,255,.04);
  border-bottom: 1px solid var(--border);
}
.pc-logo { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
.pc-name { font-family: 'Orbitron', monospace; font-size: .82rem; color: var(--t); }
.pc-team { font-size: .62rem; color: var(--mu); margin-top: 2px; letter-spacing: 1px; }
.pc-hand {
  margin-left: auto; font-family: 'Orbitron', monospace; font-size: .7rem;
  background: rgba(0,229,255,.1); border: 1px solid rgba(0,229,255,.25);
  color: var(--c); border-radius: 20px; padding: 3px 10px; letter-spacing: 1px;
}

/* ── TABS within card ── */
.pc-tabs { display: flex; border-bottom: 1px solid var(--border); }
.pc-tab {
  flex: 1; padding: 8px 4px; font-size: .6rem; letter-spacing: 1px;
  text-align: center; cursor: pointer; color: var(--mu);
  font-family: 'Orbitron', monospace; border-bottom: 2px solid transparent;
  transition: all .2s;
}
.pc-tab.ac { color: var(--c); border-bottom-color: var(--c); background: rgba(0,229,255,.04); }
.pc-tab:hover:not(.ac) { color: var(--t); background: rgba(255,255,255,.03); }

/* ── TAB PANES ── */
.pc-pane { display: none; padding: 12px 14px; }
.pc-pane.vis { display: block; }

/* ── STAT GRID (4-up cards) ── */
.stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.stat4-card {
  background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.06);
  border-radius: 7px; padding: 8px 6px; text-align: center;
}
.s4v { font-family: 'Orbitron', monospace; font-size: 1rem; font-weight: 700; color: var(--t); }
.s4l { font-size: .54rem; color: var(--mu); letter-spacing: 1px; margin-top: 3px; }
.s4v.good { color: var(--g); }
.s4v.warn { color: var(--o); }
.s4v.bad  { color: var(--r); }
.s4v.neu  { color: var(--c); }

/* ── DIVIDER ROWS ── */
.div-row {
  font-size: .58rem; color: var(--mu); letter-spacing: 2px;
  padding: 4px 0 2px; border-top: 1px solid rgba(255,255,255,.05);
  margin: 8px 0 6px; text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.div-row .tag-fg { background: rgba(255,145,0,.12); border: 1px solid rgba(255,145,0,.25); color: var(--fg); border-radius: 3px; padding: 1px 5px; font-size: .52rem; }
.div-row .tag-sv { background: rgba(0,229,255,.1); border: 1px solid rgba(0,229,255,.22); color: var(--sv); border-radius: 3px; padding: 1px 5px; font-size: .52rem; }

/* ── STAT TABLE ── */
.stab { width: 100%; border-collapse: collapse; font-size: .72rem; }
.stab tr:hover td { background: rgba(255,255,255,.03); }
.stab td { padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,.04); }
.stab td:first-child { color: var(--mu); font-size: .65rem; letter-spacing: .5px; }
.stab td:last-child { font-family: 'Orbitron', monospace; font-size: .72rem; text-align: right; color: var(--t); }
.stab .sv-row td { background: rgba(0,229,255,.04); }
.stab .fg-row td { background: rgba(255,145,0,.04); }
.stab .era-good { color: var(--g); }
.stab .era-warn { color: var(--o); }
.stab .era-bad  { color: var(--r); }

/* ── ARSENAL ── */
.arsenal-wrap { margin-top: 4px; }
.arsenal-hd {
  font-size: .58rem; color: var(--mu); letter-spacing: 2px;
  display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
}
.ars-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ars-name { font-size: .62rem; color: var(--mu); width: 88px; flex-shrink: 0; letter-spacing: .5px; }
.ars-bar-wrap { flex: 1; height: 7px; background: rgba(255,255,255,.07); border-radius: 4px; overflow: hidden; }
.ars-bar { height: 100%; border-radius: 4px; transition: width .6s ease; }
.ars-pct { font-family: 'Orbitron', monospace; font-size: .62rem; color: var(--t); width: 36px; text-align: right; flex-shrink: 0; }
.ars-velo { font-size: .6rem; color: var(--mu); width: 52px; text-align: right; flex-shrink: 0; }

/* Arsenal color palette */
.ars-ff { background: var(--r); }
.ars-si { background: #ff6d00; }
.ars-fc { background: var(--warn); }
.ars-sl { background: var(--o); }
.ars-st { background: #76ff03; }
.ars-cu { background: #00b8d4; }
.ars-ch { background: var(--m); }
.ars-fs { background: #aa00ff; }
.ars-kn { background: var(--mu); }
.ars-sv { background: #ff4081; }

/* ── GAME LOG ── */
.gl-wrap { overflow-x: auto; }
.gl-table { width: 100%; border-collapse: collapse; font-size: .66rem; min-width: 380px; }
.gl-table thead th {
  font-size: .56rem; color: var(--mu); letter-spacing: 1px; text-transform: uppercase;
  padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: center;
}
.gl-table thead th:first-child { text-align: left; }
.gl-table tbody td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.04); text-align: center; }
.gl-table tbody td:first-child { text-align: left; color: var(--mu); }
.gl-table tbody tr:hover td { background: rgba(255,255,255,.03); }
.gl-l7 { background: rgba(0,229,255,.04); }
.ip-good { color: var(--g); }
.ip-warn { color: var(--o); }
.ip-bad  { color: var(--r); }
.k-good  { color: var(--g); }
.er-bad  { color: var(--r); }
.er-good { color: var(--g); }

/* ── L5 SUMMARY PILLS ── */
.l5-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.l5-pill {
  background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px; padding: 4px 10px;
  font-family: 'Orbitron', monospace; font-size: .6rem;
  display: flex; align-items: center; gap: 5px;
}
.l5-pill .lv { font-size: .7rem; color: var(--t); }
.l5-pill .ll { font-size: .52rem; color: var(--mu); }

/* ── PROJ BOX ── */
.proj-box {
  background: rgba(0,229,255,.04); border: 1px solid rgba(0,229,255,.18);
  border-radius: 8px; padding: 12px 14px; margin-top: 8px;
}
.proj-title { font-family: 'Orbitron', monospace; font-size: .65rem; color: var(--c); letter-spacing: 2px; margin-bottom: 10px; }
.proj-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
.proj-row:last-child { border: none; }
.proj-key { font-size: .68rem; color: var(--mu); }
.proj-val { font-family: 'Orbitron', monospace; font-size: .78rem; color: var(--t); }
.proj-sig { font-size: .62rem; padding: 2px 8px; border-radius: 3px; }
.sig-over { background: rgba(0,230,118,.15); color: var(--g); border: 1px solid rgba(0,230,118,.3); }
.sig-lover { background: rgba(118,255,3,.1); color: #76ff03; border: 1px solid rgba(118,255,3,.25); }
.sig-under { background: rgba(244,67,54,.15); color: var(--r); border: 1px solid rgba(244,67,54,.3); }
.sig-lunder { background: rgba(255,152,0,.12); color: var(--o); border: 1px solid rgba(255,152,0,.28); }
.sig-neu { color: var(--mu); }
.proj-note { font-size: .6rem; color: var(--mu); margin-top: 8px; line-height: 1.5; }

/* ── PLATOON SPLITS ── */
.split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.split-card {
  background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.07);
  border-radius: 7px; padding: 10px;
}
.split-title { font-size: .6rem; color: var(--mu); letter-spacing: 1px; margin-bottom: 8px; }
.split-title.facing { color: var(--g); }
.split-row { display: flex; justify-content: space-between; font-size: .66rem; padding: 3px 0; }
.split-k { color: var(--mu); }
.split-v { font-family: 'Orbitron', monospace; font-size: .66rem; color: var(--t); }

/* ── SCOUT LINES ── */
.scout-box {
  background: rgba(0,0,0,.25); border-left: 2px solid rgba(0,229,255,.3);
  border-radius: 0 7px 7px 0; padding: 10px 12px; font-size: .7rem;
  color: var(--mu); line-height: 1.7;
}
.scout-box em { color: var(--t); font-style: normal; }

/* ── K-PROP BANDS ── */
.kprop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.kprop-card {
  background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.07);
  border-radius: 7px; padding: 9px 8px; text-align: center;
}
.kprop-line { font-family: 'Orbitron', monospace; font-size: .78rem; color: var(--t); }
.kprop-pct {
  font-family: 'Orbitron', monospace; font-size: 1.1rem; font-weight: 700;
  margin: 4px 0 2px;
}
.kprop-lbl { font-size: .54rem; color: var(--mu); letter-spacing: 1px; }
.kp-hot  { color: var(--g); }
.kp-warm { color: #76ff03; }
.kp-cool { color: var(--o); }
.kp-cold { color: var(--r); }

/* ── SPINNER ── */
.spinner {
  width: 28px; height: 28px; margin: 20px auto; border-radius: 50%;
  border: 2px solid rgba(0,229,255,.15); border-top-color: var(--c);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── NA state ── */
.na { color: var(--mu); font-size: .72rem; padding: 12px 0; }

/* ── LEGEND ── */
.legend { font-size: .6rem; color: var(--mu); margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }

/* ── HOT/COLD BADGE ── */
.hc-hot { background: rgba(255,152,0,.15); border: 1px solid rgba(255,152,0,.3); color: var(--o); border-radius: 4px; padding: 1px 6px; font-size: .58rem; }
.hc-cold { background: rgba(100,181,246,.1); border: 1px solid rgba(100,181,246,.25); color: #64b5f6; border-radius: 4px; padding: 1px 6px; font-size: .58rem; }

/* ── xERA DIFF badge ── */
.xdiff-pos { color: var(--r); font-size: .64rem; }
.xdiff-neg { color: var(--g); font-size: .64rem; }

/* ── COMPARISON TABLE ── */
.compare-table { width: 100%; border-collapse: collapse; font-size: .7rem; margin-top: 8px; }
.compare-table th { font-size: .58rem; color: var(--mu); letter-spacing: 1px; text-transform: uppercase; padding: 4px 8px; border-bottom: 1px solid var(--border); text-align: center; }
.compare-table th:first-child { text-align: left; }
.compare-table td { padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,.04); text-align: center; }
.compare-table td:first-child { text-align: left; color: var(--mu); }
.compare-table .best { color: var(--g); font-weight: 700; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300..600&display=swap" rel="stylesheet">
</head>
<body>

<nav>
  <div>
    <div class="brand-name">MLB ANALYTICS HUB</div>
    <div class="brand-sub">PITCHER DEEP DIVE</div>
  </div>
  <a class="back" href="/">← DASHBOARD</a>
</nav>

<div class="wrap">

  <!-- GAME/PITCHER SELECTOR -->
  <div class="sel-bar">
    <label>GAME</label>
    <select id="gameSel" onchange="onGameChange()">
      <option value="">Loading games...</option>
    </select>
    <label>PITCHER</label>
    <select id="pitcherSel">
      <option value="">Select game first</option>
    </select>
    <button class="load-btn" onclick="loadSelected()">ANALYZE ▶</button>
  </div>

  <!-- PITCHER CARDS (2-up grid) -->
  <div class="pitcher-grid" id="pitcherGrid">
    <div class="pc" id="card-away"><div class="spinner"></div></div>
    <div class="pc" id="card-home"><div class="spinner"></div></div>
  </div>

</div>

<script>
// ── CONSTANTS ──
const PITCH_NAMES = {
  ff:'4-Seam FB', si:'Sinker', fc:'Cutter', st:'Sweeper',
  sl:'Slider', cu:'Curveball', ch:'Changeup', fs:'Splitter',
  kn:'Knuckleball', sv:'Slurve', kc:'KC Curve', fp:'Forkball'
};
const ARS_COLORS = {
  ff:'ars-ff', si:'ars-si', fc:'ars-fc', sl:'ars-sl', st:'ars-st',
  cu:'ars-cu', ch:'ars-ch', fs:'ars-fs', kn:'ars-kn', sv:'ars-sv'
};

let GPK = null;
let GAME_DATA = null;
let PD = null;   // pitcher stats from /api/pitchers/<pk>
let LOGS = {};   // { pitcherId: [...gameLogs] }

// ── BOOT ──
async function boot() {
  try {
    const r = await fetch('/api/games/today');
    const d = await r.json();
    if (!d.success || !d.games.length) {
      document.getElementById('gameSel').innerHTML = '<option>No games today</option>';
      return;
    }
    document.getElementById('gameSel').innerHTML =
      d.games.map(g =>
        `<option value="${g.gamePk}">${g.awayAbbr} @ ${g.homeAbbr} – ${g.gameTime}</option>`
      ).join('');
    GPK = d.games[0].gamePk;
    GAME_DATA = d.games[0];
    await loadPitchersForGame(GPK);
  } catch(e) {
    document.getElementById('gameSel').innerHTML = `<option>Error: ${e.message}</option>`;
  }
}

async function onGameChange() {
  const sel = document.getElementById('gameSel');
  GPK = parseInt(sel.value);
  await loadPitchersForGame(GPK);
}

async function loadPitchersForGame(pk) {
  document.getElementById('pitcherSel').innerHTML = '<option>Loading...</option>';
  setCardLoading('card-away');
  setCardLoading('card-home');
  try {
    const r = await fetch(`/api/pitchers/${pk}`);
    PD = await r.json();
    if (!PD.success) throw new Error(PD.error || 'Failed');
    // Fetch game data for logos/names
    const r2 = await fetch('/api/games/today');
    const d2 = await r2.json();
    GAME_DATA = (d2.games || []).find(g => g.gamePk == pk) || GAME_DATA;
    populatePitcherSel();
    renderBothCards();
  } catch(e) {
    setCardError('card-away', e.message);
    setCardError('card-home', e.message);
  }
}

function populatePitcherSel() {
  if (!PD || !PD.success) return;
  const opts = [
    { val: 'away', label: `${PD.awayPitcher.name} (${GAME_DATA?.awayAbbr || 'AWAY'})` },
    { val: 'home', label: `${PD.homePitcher.name} (${GAME_DATA?.homeAbbr || 'HOME'})` },
  ].map(o => `<option value="${o.val}">${o.label}</option>`).join('');
  document.getElementById('pitcherSel').innerHTML = opts;
}

function loadSelected() {
  const side = document.getElementById('pitcherSel').value;
  if (!PD || !PD.success) return;
  const pit = side === 'away' ? PD.awayPitcher : PD.homePitcher;
  scrollToCard(side === 'away' ? 'card-away' : 'card-home');
  fetchAndRenderSingleCard(pit, side);
}

function scrollToCard(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── RENDER BOTH CARDS ──
function renderBothCards() {
  if (!PD || !PD.success) { setCardError('card-away', 'No data'); setCardError('card-home', 'No data'); return; }
  fetchAndRenderSingleCard(PD.awayPitcher, 'away');
  fetchAndRenderSingleCard(PD.homePitcher, 'home');
}

async function fetchAndRenderSingleCard(pit, side) {
  const cardId = `card-${side}`;
  setCardLoading(cardId);
  // Fetch game log for this pitcher
  let log = [];
  if (pit.id) {
    try {
      const r = await fetch(`/api/player-splits/${pit.id}/pitching`);
      const d = await r.json();
      if (d.success) {
        log = d.recentGames || [];
        LOGS[pit.id] = log;
      }
    } catch(e) {}
  }
  const teamLabel = side === 'away'
    ? (GAME_DATA?.awayAbbr || 'AWAY')
    : (GAME_DATA?.homeAbbr || 'HOME');
  const teamLogo = side === 'away'
    ? (GAME_DATA?.awayLogo || '')
    : (GAME_DATA?.homeLogo || '');
  buildCard(document.getElementById(cardId), pit, teamLabel, teamLogo, log, side);
}

// ── CARD BUILDER ──
function buildCard(el, pit, teamLabel, logoSrc, log, side) {
  const s = pit.stats || {};
  const pitchHand = s.pitchHand || '?';
  const cardId = `card-${side}`;

  // ── HEAD ──
  const headHtml = `
    <div class="pc-head">
      ${logoSrc ? `<img class="pc-logo" src="${logoSrc}" alt="${teamLabel}">` : `<div class="pc-logo"></div>`}
      <div>
        <div class="pc-name">${pit.name || 'TBD'}</div>
        <div class="pc-team">${teamLabel} &nbsp;·&nbsp; ${pitchHand === 'L' ? 'LHP' : pitchHand === 'R' ? 'RHP' : 'P'}</div>
      </div>
      <div class="pc-hand">${pitchHand}HP</div>
    </div>`;

  // ── TABS ──
  const tabsHtml = `
    <div class="pc-tabs">
      <div class="pc-tab ac" data-card="${cardId}" data-pane="stats" onclick="switchTab(this)">STATS</div>
      <div class="pc-tab" data-card="${cardId}" data-pane="proj" onclick="switchTab(this)">PROJECTION</div>
      <div class="pc-tab" data-card="${cardId}" data-pane="log" onclick="switchTab(this)">GAME LOG</div>
      <div class="pc-tab" data-card="${cardId}" data-pane="arsenal" onclick="switchTab(this)">ARSENAL</div>
    </div>`;

  // ── PANE: STATS ──
  const statsPane = buildStatsPane(s, pit, log);

  // ── PANE: PROJECTION ──
  const projPane = buildProjPane(s, log);

  // ── PANE: GAME LOG ──
  const logPane = buildLogPane(log, s);

  // ── PANE: ARSENAL ──
  const arsenalPane = buildArsenalPane(s);

  el.innerHTML = headHtml + tabsHtml +
    `<div id="${cardId}-stats" class="pc-pane vis">${statsPane}</div>` +
    `<div id="${cardId}-proj"  class="pc-pane">${projPane}</div>` +
    `<div id="${cardId}-log"   class="pc-pane">${logPane}</div>` +
    `<div id="${cardId}-arsenal" class="pc-pane">${arsenalPane}</div>`;

  // Animate arsenal bars after render
  setTimeout(() => {
    el.querySelectorAll('.ars-bar').forEach(b => {
      b.style.width = b.getAttribute('data-w') + '%';
    });
  }, 120);
}

// ── STATS PANE ──
function buildStatsPane(s, pit, log) {
  const era  = pv(s.fg_era || s.era);
  const whip = pv(s.fg_whip || s.whip);
  const k9   = pv(s.fg_k9 || s.k9);
  const bb9  = pv(s.fg_bb9 || s.bb9);
  const ip   = pv(s.fg_ip || s.ip);
  const wins = pv(s.fg_w || s.wins, 0);
  const loss = pv(s.fg_l || s.losses, 0);
  const gs   = pv(s.fg_gs || s.gs, 0);
  const fip  = pv(s.fg_fip);
  const xfip = pv(s.fg_xfip);
  const kpct = s.fg_kpct ? fmtP(s.fg_kpct) : '---';
  const bbpct= s.fg_bbpct ? fmtP(s.fg_bbpct) : '---';
  const war  = pv(s.fg_war);
  const xera = pv(s.sv_xera);
  const xwobap = pv(s.sv_xwoba_p);
  const svkpct = pv(s.sv_kpct);
  const svbbpct = pv(s.sv_bbpct);
  const lob  = s.fg_lob ? fmtP(s.fg_lob) : '---';
  const babip= pv(s.fg_babip);

  // ERA color
  const eraF = parseFloat(era);
  const eraClass = isNaN(eraF) ? '' : eraF < 3.20 ? 'era-good' : eraF > 4.80 ? 'era-bad' : 'era-warn';

  // xERA vs ERA diff
  const xeraF = parseFloat(xera);
  let xdiffHtml = '';
  if (!isNaN(eraF) && !isNaN(xeraF)) {
    const diff = (xeraF - eraF).toFixed(2);
    const cls = parseFloat(diff) > 0.30 ? 'xdiff-pos' : parseFloat(diff) < -0.30 ? 'xdiff-neg' : '';
    const note = parseFloat(diff) > 0.30 ? '▲ regression risk' : parseFloat(diff) < -0.30 ? '▼ positive regression' : 'aligned';
    xdiffHtml = `<span class="${cls}">${diff > 0 ? '+' : ''}${diff} (${note})</span>`;
  }

  // L5 trend
  const l5 = log.slice(-5);
  const l5er = l5.reduce((s,g) => s + (g.er||0), 0);
  const l5k  = l5.reduce((s,g) => s + (g.k||0), 0);
  const l5ip = l5.reduce((s,g) => s + (parseFloat(g.ip)||0), 0);
  const l5badge = l5.length >= 3
    ? (l5er <= 4 && l5ip >= 20 ? '<span class="hc-hot">🔥 HOT L5</span>' :
       l5er >= 12 ? '<span class="hc-cold">❄ COLD L5</span>' : '')
    : '';

  return `
    ${l5badge ? `<div style="padding:10px 14px 0">${l5badge}</div>` : ''}
    <!-- KEY STATS 4-UP -->
    <div class="stat4" style="margin-top:10px">
      <div class="stat4-card">
        <div class="s4v ${eraClass}">${era}</div>
        <div class="s4l">ERA</div>
      </div>
      <div class="stat4-card">
        <div class="s4v">${whip}</div>
        <div class="s4l">WHIP</div>
      </div>
      <div class="stat4-card">
        <div class="s4v neu">${k9}</div>
        <div class="s4l">K/9</div>
      </div>
      <div class="stat4-card">
        <div class="s4v">${ip}</div>
        <div class="s4l">IP</div>
      </div>
    </div>

    <!-- W/L record -->
    <div style="font-size:.65rem;color:var(--mu);margin-bottom:8px;padding-left:2px">
      ${wins}W – ${loss}L &nbsp;·&nbsp; ${gs} GS
    </div>

    <!-- FANGRAPHS SECTION -->
    <div class="div-row"><span class="tag-fg">FG</span> FANGRAPHS ADVANCED</div>
    <table class="stab">
      <tr><td>FIP</td><td class="${ecolor(fip, 'fip')}">${fip}</td></tr>
      <tr><td>xFIP</td><td class="${ecolor(xfip, 'fip')}">${xfip}</td></tr>
      <tr><td>K%</td><td class="${kpctColor(s.fg_kpct)}">${kpct}</td></tr>
      <tr><td>BB%</td><td>${bbpct}</td></tr>
      <tr><td>BABIP</td><td>${babip}</td></tr>
      <tr><td>LOB%</td><td>${lob}</td></tr>
      <tr><td>WAR</td><td>${war}</td></tr>
      <tr><td>BB/9</td><td>${bb9}</td></tr>
    </table>

    <!-- SAVANT SECTION -->
    <div class="div-row"><span class="tag-sv">SV</span> BASEBALL SAVANT</div>
    <table class="stab sv-row">
      <tr><td>xERA</td><td class="${ecolor(xera, 'fip')}">${xera}</td></tr>
      ${xdiffHtml ? `<tr><td>xERA vs ERA</td><td>${xdiffHtml}</td></tr>` : ''}
      <tr><td>xwOBA vs</td><td>${xwobap}</td></tr>
    </table>

    <div class="legend">
      <span style="color:var(--fg)">● FanGraphs</span>
      <span style="color:var(--sv)">● Savant</span>
    </div>`;
}

// ── PROJECTION PANE ──
function buildProjPane(s, log) {
  // Derive best ERA/FIP for projection
  const era  = parseFloat(s.sv_xera || s.fg_era || s.era) || 4.20;
  const fip  = parseFloat(s.fg_fip) || era;
  const k9   = parseFloat(s.fg_k9 || s.k9) || 8.0;
  const kpct = parseFloat(s.fg_kpct) || (k9 / 36);
  const whip = parseFloat(s.fg_whip || s.whip) || 1.30;
  const bb9  = parseFloat(s.fg_bb9 || s.bb9) || 3.0;

  // L5 recent: avg ip, k, er
  const l5 = log.slice(-5);
  const l5ip = l5.length ? l5.reduce((s,g)=>s+(parseFloat(g.ip)||0),0)/l5.length : null;
  const l5k  = l5.length ? l5.reduce((s,g)=>s+(g.k||0),0)/l5.length : null;
  const l5er = l5.length ? l5.reduce((s,g)=>s+(g.er||0),0)/l5.length : null;

  // Season projected outs
  const projOuts = Math.max(9, Math.min(21, 16.5 - (era - 4.0) * 0.9));
  const projIP   = (projOuts / 3).toFixed(1);
  const projK    = Math.max(2, Math.min(10, projOuts * (kpct) * 3)).toFixed(1);
  const projER   = Math.max(0.5, Math.min(5.5, (era / 9) * (projOuts / 3))).toFixed(1);

  // Blend with L5 if we have it
  const blendedK  = l5k  != null ? (0.6 * parseFloat(projK)  + 0.4 * l5k ).toFixed(1) : projK;
  const blendedER = l5er != null ? (0.6 * parseFloat(projER) + 0.4 * l5er).toFixed(1) : projER;
  const blendedIP = l5ip != null ? (0.6 * parseFloat(projIP) + 0.4 * l5ip).toFixed(1) : projIP;

  // K prop lines
  const kLines = [
    { line: 3.5, pct: kPropPct(parseFloat(blendedK), 3.5) },
    { line: 4.5, pct: kPropPct(parseFloat(blendedK), 4.5) },
    { line: 5.5, pct: kPropPct(parseFloat(blendedK), 5.5) },
    { line: 6.5, pct: kPropPct(parseFloat(blendedK), 6.5) },
    { line: 7.5, pct: kPropPct(parseFloat(blendedK), 7.5) },
    { line: 8.5, pct: kPropPct(parseFloat(blendedK), 8.5) },
  ];
  const kPropsHtml = kLines.map(kl => {
    const cls = kl.pct >= 0.70 ? 'kp-hot' : kl.pct >= 0.55 ? 'kp-warm' : kl.pct >= 0.40 ? 'kp-cool' : 'kp-cold';
    return `<div class="kprop-card">
      <div class="kprop-line">K ${kl.line}</div>
      <div class="kprop-pct ${cls}">${Math.round(kl.pct*100)}%</div>
      <div class="kprop-lbl">${kl.pct >= 0.55 ? '▲ LEAN OVER' : kl.pct >= 0.45 ? '≈ NEUTRAL' : '▼ LEAN UNDER'}</div>
    </div>`;
  }).join('');

  // Outing signal
  const erF = parseFloat(blendedER);
  const ipF = parseFloat(blendedIP);
  const qsSig = ipF >= 6.0 && erF <= 3.0 ? { lbl: 'QUALITY START LIKELY', cls: 'sig-over' }
               : ipF >= 5.0 && erF <= 4.0 ? { lbl: 'SOLID OUTING', cls: 'sig-lover' }
               : erF >= 4.0               ? { lbl: 'RISKY START', cls: 'sig-under' }
               : { lbl: 'NEUTRAL', cls: 'sig-neu' };

  const blend = l5ip != null ? 'Season (60%) + L5 (40%)' : 'Season stats (no recent log)';

  return `
    <div class="proj-box">
      <div class="proj-title">⚾ OUTING PROJECTION</div>
      <div class="proj-row">
        <span class="proj-key">Projected IP</span>
        <span class="proj-val">${blendedIP} <span class="proj-sig ${ipF >= 6 ? 'sig-lover' : ''}">${ipF >= 6 ? '▲ DEEP' : ipF < 5 ? '▼ SHORT' : ''}</span></span>
      </div>
      <div class="proj-row">
        <span class="proj-key">Projected Ks</span>
        <span class="proj-val">${blendedK}</span>
      </div>
      <div class="proj-row">
        <span class="proj-key">Projected ER</span>
        <span class="proj-val ${erF >= 4 ? 'era-bad' : erF <= 2 ? 'era-good' : ''}">${blendedER}</span>
      </div>
      <div class="proj-row">
        <span class="proj-key">Outing Signal</span>
        <span class="proj-sig ${qsSig.cls}">${qsSig.lbl}</span>
      </div>
      <div class="proj-note">Model: ${blend} · xERA ${pv(s.sv_xera)} · FIP ${pv(s.fg_fip)} · K/9 ${pv(s.fg_k9||s.k9)}</div>
    </div>

    <!-- K PROP BANDS -->
    <div class="div-row" style="margin-top:14px"><span class="tag-sv">K</span> STRIKEOUT PROP BANDS</div>
    <div class="kprop-grid">${kPropsHtml}</div>
    <div class="proj-note" style="margin-top:8px">Based on blended projected K total (${blendedK}). Poisson distribution estimate.</div>`;
}

// Poisson CDF approximation for K props
function kPropPct(mean, line) {
  // P(X > line) approximation using Poisson
  const k = Math.floor(line);
  let cumProb = 0;
  let factorial = 1;
  for (let i = 0; i <= k; i++) {
    if (i > 0) factorial *= i;
    cumProb += (Math.pow(mean, i) * Math.exp(-mean)) / factorial;
  }
  return Math.max(0.03, Math.min(0.97, 1 - cumProb));
}

// ── GAME LOG PANE ──
function buildLogPane(log, s) {
  if (!log || !log.length) {
    return `<p class="na">No recent game log available. Play splits endpoint may not be cached yet.</p>`;
  }
  const recent = [...log].reverse().slice(0, 10);
  const l5 = log.slice(-5);
  const l5er = l5.reduce((sum,g)=>sum+(g.er||0),0);
  const l5k  = l5.reduce((sum,g)=>sum+(g.k||0),0);
  const l5ip = l5.reduce((sum,g)=>sum+(parseFloat(g.ip)||0),0).toFixed(1);
  const hcBadge = l5er <= 4 && parseFloat(l5ip) >= 18
    ? '<span class="hc-hot">🔥 HOT L5</span>'
    : l5er >= 12 ? '<span class="hc-cold">❄ COLD L5</span>' : '';

  const pills = `
    <div class="l5-pills">
      ${hcBadge}
      <div class="l5-pill"><span class="lv">${l5ip}</span><span class="ll">L5 IP</span></div>
      <div class="l5-pill"><span class="lv" style="color:var(--m)">${l5k}</span><span class="ll">L5 K</span></div>
      <div class="l5-pill"><span class="lv" style="color:${l5er<=4?'var(--g)':'var(--r)'}">${l5er}</span><span class="ll">L5 ER</span></div>
    </div>`;

  const rows = recent.map((g, i) => {
    const ipF = parseFloat(g.ip) || 0;
    const ipCls = ipF >= 6 ? 'ip-good' : ipF < 4 ? 'ip-bad' : 'ip-warn';
    const kCls  = g.k >= 7 ? 'k-good' : '';
    const erCls = g.er === 0 ? 'er-good' : g.er >= 4 ? 'er-bad' : '';
    const rowCls = i < 5 ? 'gl-l7' : '';
    return `<tr class="${rowCls}">
      <td>${g.date ? g.date.slice(5) : '---'}</td>
      <td>${g.opp || '---'}</td>
      <td class="${ipCls}">${g.ip || '---'}</td>
      <td>${g.h !== undefined ? g.h : '---'}</td>
      <td class="${erCls}">${g.er !== undefined ? g.er : '---'}</td>
      <td class="${kCls}">${g.k !== undefined ? g.k : '---'}</td>
      <td>${g.bb !== undefined ? g.bb : '---'}</td>
    </tr>`;
  }).join('');

  return `
    ${pills}
    <div class="gl-wrap">
      <table class="gl-table">
        <thead>
          <tr>
            <th>DATE</th><th>OPP</th><th>IP</th><th>H</th><th>ER</th><th>K</th><th>BB</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="legend" style="margin-top:8px">
      <span style="color:var(--c)">● Highlighted = Last 5 starts</span>
      <span style="color:var(--g)">● Green = Good</span>
      <span style="color:var(--r)">● Red = Bad</span>
    </div>`;
}

// ── ARSENAL PANE ──
function buildArsenalPane(s) {
  const pct  = s.sv_arsenal_pct  || {};
  const velo = s.sv_arsenal_velo || {};
  const keys = Object.keys(pct).filter(k => pct[k] > 1);
  if (!keys.length) return `<p class="na">Arsenal data not available. May load after Savant cache refreshes.</p>`;

  keys.sort((a,b) => pct[b] - pct[a]);

  const rows = keys.map((pt, i) => {
    const p = pct[pt] || 0;
    const v = velo[pt] || null;
    const name = PITCH_NAMES[pt] || pt.toUpperCase();
    const cls  = ARS_COLORS[pt] || 'ars-ff';
    const hue  = `hsl(${(i * 47 + 180) % 360}, 70%, 55%)`;
    const barCls = `ars-bar ${cls}`;
    return `<div class="ars-row">
      <div class="ars-name">${name}</div>
      <div class="ars-bar-wrap">
        <div class="${barCls}" style="width:0" data-w="${Math.min(100, p)}"></div>
      </div>
      <div class="ars-pct">${p.toFixed(1)}%</div>
      <div class="ars-velo">${v ? v.toFixed(1) + ' mph' : '---'}</div>
    </div>`;
  }).join('');

  const primaryPitch = PITCH_NAMES[keys[0]] || keys[0].toUpperCase();
  const primaryPct   = (pct[keys[0]] || 0).toFixed(1);
  const primaryVelo  = velo[keys[0]] ? velo[keys[0]].toFixed(1) + ' mph' : '';

  const scoutNote = buildArsenalScout(keys, pct, velo, s);

  return `
    <div class="arsenal-wrap">
      <div class="arsenal-hd">
        <span class="tag-sv" style="font-size:.58rem">SV</span>
        PITCH ARSENAL &nbsp;·&nbsp; <span style="color:var(--t)">${keys.length} pitches</span>
      </div>
      ${rows}
      <div class="div-row" style="margin-top:12px">SCOUTING NOTE</div>
      <div class="scout-box">${scoutNote}</div>
    </div>`;
}

function buildArsenalScout(keys, pct, velo, s) {
  const primary = PITCH_NAMES[keys[0]] || keys[0].toUpperCase();
  const pp = (pct[keys[0]] || 0).toFixed(0);
  const pv_ = velo[keys[0]] ? `at ${velo[keys[0]].toFixed(1)} mph` : '';

  let note = `Primary weapon: <em>${primary}</em> (${pp}% usage ${pv_}). `;

  if (keys.includes('sl') || keys.includes('st') || keys.includes('cu')) {
    const brk = keys.filter(k => ['sl','st','cu'].includes(k));
    note += `Breaking ball mix with <em>${brk.map(k=>PITCH_NAMES[k]).join(' / ')}</em>. `;
  }
  if (keys.includes('ch') || keys.includes('fs')) {
    note += `Off-speed <em>${PITCH_NAMES[keys.includes('ch')?'ch':'fs']}</em> for swing-and-miss. `;
  }

  const kpct = parseFloat(s.fg_kpct) || 0;
  if (kpct > 0.27) note += `<em>Elite K rate</em> (${fmtP(s.fg_kpct)}) – target strikeout props. `;
  else if (kpct > 0.22) note += `Above-average swing-and-miss. `;
  else if (kpct > 0) note += `Below-average K rate – fade K overs. `;

  return note || 'Arsenal data loaded.';
}

// ── TAB SWITCHER ──
function switchTab(tabEl) {
  const cardId = tabEl.getAttribute('data-card');
  const pane   = tabEl.getAttribute('data-pane');
  // Deactivate all tabs in this card
  document.querySelectorAll(`.pc-tab[data-card="${cardId}"]`).forEach(t => t.classList.remove('ac'));
  tabEl.classList.add('ac');
  // Hide all panes in this card
  document.querySelectorAll(`[id^="${cardId}-"]`).forEach(p => p.classList.remove('vis'));
  const paneEl = document.getElementById(`${cardId}-${pane}`);
  if (paneEl) paneEl.classList.add('vis');

  // Animate arsenal bars on tab switch
  if (pane === 'arsenal') {
    setTimeout(() => {
      document.querySelectorAll(`#${cardId}-arsenal .ars-bar`).forEach(b => {
        b.style.width = b.getAttribute('data-w') + '%';
      });
    }, 80);
  }
}

// ── HELPERS ──
function setCardLoading(id) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = '<div class="spinner"></div>';
}
function setCardError(id, msg) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = `<p class="na" style="padding:20px">${msg}</p>`;
}
function pv(v, fb) { return (v !== undefined && v !== null && v !== 'NA' && v !== '' && v !== '?') ? v : (fb !== undefined ? fb : '---'); }
function fmtP(v) { const n = parseFloat(v); return isNaN(n) ? '---' : (n * 100).toFixed(1) + '%'; }
function toF(v, fb) { const n = parseFloat(v); return isNaN(n) ? fb : n; }

function ecolor(v, type) {
  const n = parseFloat(v);
  if (isNaN(n)) return '';
  if (type === 'fip') return n < 3.20 ? 'era-good' : n > 4.80 ? 'era-bad' : 'era-warn';
  return '';
}
function kpctColor(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return '';
  return n > 0.27 ? 'era-good' : n < 0.18 ? 'era-bad' : 'era-warn';
}

boot();
</script>
