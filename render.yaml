services:
  - type: web
    name: mlb-analytics-hub
    env: python
    # Upgrading to `starter` is strongly recommended (2GB RAM) if available.
    # On `free`/512MB a cold boot of pybaseball + Savant caches is very tight.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Use gunicorn_conf.py for the hardened settings (1 worker, gthread,
    # 600s timeout, preload_app). See gunicorn_conf.py for rationale.
    startCommand: gunicorn app:app -c gunicorn_conf.py
    # Health check endpoint Render pings; must respond <30s even during
    # cold cache-build (status route returns immediately, cache loads async).
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_REGION
        value: us
      # Tells pybaseball NOT to hammer FanGraphs on every boot (we cache locally)
      - key: PYBASEBALL_CACHE
        value: "1"
