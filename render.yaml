services:
  - type: web
    name: mlb-analytics-hub
    env: python
    buildCommand: pip install -r requirements.txt && python fix_timezone.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_REGION
        value: us
