<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Parlay Tracker — MLB Analytics Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c:#00e5ff;--g:#00e676;--o:#ff9800;--e:#f44336;--bg:#050a18;--card:#0a1628;
  --b:rgba(0,229,255,.18);--t:#e0f0ff;--mu:#6a8db0;--sv:#00b8d9}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}

nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
  background:rgba(5,10,24,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--b);
  position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap}
.logo{font-family:Orbitron,monospace;font-size:1.05rem;font-weight:900;color:var(--c);
  display:flex;align-items:center;gap:8px}
.nav-links{display:flex;gap:8px;flex-wrap:wrap}
.nav-link{padding:7px 14px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.18);
  border-radius:7px;color:var(--mu);font-family:Orbitron,monospace;font-size:.58rem;
  letter-spacing:2px;text-decoration:none;transition:all .2s}
.nav-link:hover{color:var(--c);background:rgba(0,229,255,.12)}
.nav-link.active{color:var(--c);background:rgba(0,229,255,.14);border-color:rgba(0,229,255,.35)}

.pg{max-width:1140px;margin:0 auto;padding:28px 20px}
.pg-hdr{margin-bottom:24px}
.pg-title{font-family:Orbitron,monospace;font-size:.85rem;color:var(--c);letter-spacing:3px;margin-bottom:4px}
.pg-sub{font-size:.72rem;color:var(--mu)}

/* Controls */
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px;
  padding:14px 16px;background:rgba(10,22,40,.8);border:1px solid rgba(0,229,255,.12);border-radius:12px}
.ctrl-label{font-family:Orbitron,monospace;font-size:.58rem;color:var(--mu);letter-spacing:2px}
.date-input{background:rgba(5,10,24,.9);border:1px solid rgba(0,229,255,.2);color:var(--t);
  padding:8px 12px;border-radius:8px;font-size:.76rem;outline:none;font-family:Inter,sans-serif}
.date-input:focus{border-color:rgba(0,229,255,.4)}
.load-btn{padding:8px 18px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);
  color:var(--c);font-family:Orbitron,monospace;font-size:.62rem;letter-spacing:2px;
  border-radius:8px;cursor:pointer;transition:all .2s}
.load-btn:hover{background:rgba(0,229,255,.2)}

/* Summary bar */
.summary-bar{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.sum-card{background:var(--card);border:1px solid rgba(0,229,255,.12);border-radius:10px;padding:12px 14px;text-align:center}
.sum-v{font-family:Orbitron,monospace;font-size:1.05rem;font-weight:700;color:var(--c)}
.sum-l{font-size:.58rem;color:var(--mu);letter-spacing:2px;margin-top:3px}

/* Parlay cards */
#parlayList{display:grid;gap:16px}
.pcard{background:var(--card);border:1px solid var(--b);border-radius:14px;overflow:hidden;position:relative}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--c),var(--g))}
.pcard-inner{padding:18px 20px}
.pcard-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.pcard-meta{display:flex;flex-direction:column;gap:2px}
.pcard-id{font-family:Orbitron,monospace;font-size:.62rem;color:var(--mu);letter-spacing:2px}
.pcard-time{font-size:.62rem;color:var(--mu)}
.pcard-badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.verdict-badge{font-family:Orbitron,monospace;font-size:.75rem;font-weight:900;
  padding:5px 13px;border-radius:999px;white-space:nowrap}
.legs-badge{font-family:Orbitron,monospace;font-size:.62rem;padding:4px 10px;
  border-radius:999px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.2);color:var(--c)}

/* Legs grid */
.legs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;margin-bottom:14px}
.leg-card{background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.1);
  border-radius:8px;padding:8px 10px}
.leg-player{font-size:.73rem;font-weight:600;color:var(--t);margin-bottom:2px}
.leg-team{font-size:.6rem;color:var(--c)}
.leg-market{font-size:.6rem;color:var(--mu);margin-bottom:4px}
.leg-prob{font-family:Orbitron,monospace;font-size:.65rem;color:var(--g)}
.leg-edge{font-size:.58rem;color:var(--mu);margin-left:6px}

/* Stats row */
.stats-row{display:flex;gap:0;padding:10px 0;border-top:1px dashed rgba(0,229,255,.1);
  border-bottom:1px dashed rgba(0,229,255,.1);margin-bottom:14px;flex-wrap:wrap}
.stat-b{text-align:center;min-width:90px;padding:4px 8px;flex:1}
.stat-b+.stat-b{border-left:1px solid rgba(0,229,255,.08)}
.stat-v{font-family:Orbitron,monospace;font-size:.88rem;font-weight:700;color:var(--c)}
.stat-l{font-size:.52rem;color:var(--mu);letter-spacing:1px;margin-top:3px}

/* Correlation & flags */
.analysis-section{margin-bottom:12px}
.asec-hdr{font-family:Orbitron,monospace;font-size:.55rem;letter-spacing:2px;
  margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.05)}
.corr-item{font-size:.63rem;line-height:1.6;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.flag-item{font-size:.61rem;color:var(--o);padding:3px 0;line-height:1.5}
.reason-item{font-size:.62rem;color:var(--mu);line-height:1.55;padding:3px 0}
.analysis-toggle{background:none;border:1px solid rgba(0,229,255,.15);color:var(--mu);
  font-size:.58rem;font-family:Orbitron,monospace;letter-spacing:1px;padding:4px 10px;
  border-radius:6px;cursor:pointer;margin-bottom:10px;transition:all .2s}
.analysis-toggle:hover{color:var(--c);border-color:rgba(0,229,255,.3)}
.analysis-body{display:none}
.analysis-body.open{display:block}

/* Grade section */
.grade-section{padding:12px 0 0;border-top:1px solid rgba(0,229,255,.08);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grade-lbl{font-family:Orbitron,monospace;font-size:.58rem;color:var(--mu);letter-spacing:2px;margin-right:4px}
.grade-btn{padding:6px 16px;border-radius:6px;font-family:Orbitron,monospace;font-size:.6rem;
  letter-spacing:1px;cursor:pointer;border:1px solid;transition:all .2s;background:none}
.g-win{border-color:rgba(0,230,118,.3);color:var(--g)}
.g-win:hover,.g-win.active{background:rgba(0,230,118,.2)}
.g-loss{border-color:rgba(244,67,54,.3);color:var(--e)}
.g-loss:hover,.g-loss.active{background:rgba(244,67,54,.2)}
.g-push{border-color:rgba(255,152,0,.3);color:var(--o)}
.g-push:hover,.g-push.active{background:rgba(255,152,0,.18)}
.graded-pill{font-family:Orbitron,monospace;font-size:.75rem;font-weight:900;
  padding:5px 14px;border-radius:999px}
.grade-time{font-size:.6rem;color:var(--mu)}

/* States */
.empty-state{text-align:center;padding:70px 20px;color:var(--mu);font-size:.8rem;line-height:2.2}
.empty-icon{font-size:2.5rem;margin-bottom:12px}
.spinner{width:28px;height:28px;border:2px solid rgba(0,229,255,.12);border-top-color:var(--c);
  border-radius:50%;animation:spin 1s linear infinite;margin:50px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(0,230,118,.15);border:1px solid rgba(0,230,118,.4);color:var(--g);
  font-family:Orbitron,monospace;font-size:.65rem;letter-spacing:2px;padding:10px 24px;
  border-radius:10px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:600px){
  nav{padding:12px 16px}
  .pg{padding:20px 14px}
  .legs-grid{grid-template-columns:1fr 1fr}
  .stats-row{display:grid;grid-template-columns:1fr 1fr}
  .stat-b+.stat-b{border-left:none}
}
</style>
</head>
<body>
<nav>
  <div class="logo">⚾ MLB ANALYTICS HUB</div>
  <div class="nav-links">
    <a class="nav-link" href="/">DASHBOARD</a>
    <a class="nav-link" href="/tracker">TRACKER</a>
    <a class="nav-link active" href="/parlays">PARLAYS</a>
  </div>
</nav>

<div class="pg">
  <div class="pg-hdr">
    <div class="pg-title">📋 PARLAY TRACKER</div>
    <div class="pg-sub">All saved parlay slips with AI analysis and WIN/LOSS grading</div>
  </div>

  <div class="controls">
    <span class="ctrl-label">DATE</span>
    <input type="date" class="date-input" id="dateInput">
    <button class="load-btn" onclick="loadParlays()">▶ LOAD</button>
  </div>

  <div class="summary-bar" id="summaryBar" style="display:none"></div>
  <div id="parlayList"><div class="spinner"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
var TODAY = new Date().toISOString().slice(0,10);
document.getElementById('dateInput').value = TODAY;

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function loadParlays(){
  var d = document.getElementById('dateInput').value || TODAY;
  var el = document.getElementById('parlayList');
  var sb = document.getElementById('summaryBar');
  el.innerHTML = '<div class="spinner"></div>';
  sb.style.display = 'none';

  fetch('/api/parlay/'+d)
    .then(function(r){ return r.json(); })
    .then(function(data){
      var parlays = data.parlays || [];
      if(!parlays.length){
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">🎯</div>No parlays saved for '+d+'.<br>Open a Deep Dive game and build one from the Ranked Projections board.</div>';
        return;
      }
      // Summary
      var total = parlays.length;
      var wins  = parlays.filter(function(p){ return p.grade==='win';  }).length;
      var losses= parlays.filter(function(p){ return p.grade==='loss'; }).length;
      var pushes= parlays.filter(function(p){ return p.grade==='push'; }).length;
      var ungraded = total - wins - losses - pushes;
      var winRate  = (wins+losses) > 0 ? (wins/(wins+losses)*100).toFixed(0) : '—';
      var avgLegs  = parlays.length ? (parlays.reduce(function(a,p){ return a+(p.legs||[]).length; },0)/parlays.length).toFixed(1) : '—';
      var avgFair  = parlays.length ? (parlays.reduce(function(a,p){ return a+(p.analysis&&p.analysis.combinedFairProb?p.analysis.combinedFairProb:0); },0)/parlays.length*100).toFixed(1)+'%' : '—';

      sb.innerHTML =
        sumBox(total,'PARLAYS','var(--c)')+
        sumBox(wins,'WINS','var(--g)')+
        sumBox(losses,'LOSSES','var(--e)')+
        sumBox(pushes,'PUSHES','var(--o)')+
        sumBox(winRate+(winRate!=='—'?'%':''),'WIN RATE','var(--c)')+
        sumBox(avgLegs,'AVG LEGS','var(--c)')+
        sumBox(avgFair,'AVG PROB','var(--c)');
      sb.style.display = 'grid';

      el.innerHTML = parlays.map(function(p){ return buildCard(p, d); }).join('');
    })
    .catch(function(){ el.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>Failed to load parlays.</div>'; });
}

function sumBox(v,l,col){
  return '<div class="sum-card"><div class="sum-v" style="color:'+col+'">'+v+'</div><div class="sum-l">'+l+'</div></div>';
}

function buildCard(p, dateStr){
  var a     = p.analysis || {};
  var legs  = p.legs || [];
  var eg    = a.parlayEdge!=null ? (a.parlayEdge>=0?'+':'')+(a.parlayEdge*100).toFixed(1)+'%' : 'N/A';
  var im    = a.combinedImplied!=null ? (a.combinedImplied*100).toFixed(1)+'%' : 'N/A';
  var vCol  = a.verdictColor || '#6a8db0';
  var vBg   = a.verdictBg   || 'rgba(106,141,176,.1)';

  // Legs grid
  var legsHtml = legs.map(function(l){
    var mk = (l.marketKey||'').replace('batter_','').replace('pitcher_','P.').replace(/_/g,' ');
    var egL = l.edge!=null ? (parseFloat(l.edge)>=0?'+':'')+(parseFloat(l.edge)*100).toFixed(1)+'%' : '';
    return '<div class="leg-card">'+
      '<div class="leg-player">'+l.player+'</div>'+
      '<div class="leg-team">'+l.team+'</div>'+
      '<div class="leg-market">'+mk.toUpperCase()+' <strong>o'+l.line+'</strong></div>'+
      '<span class="leg-prob">'+((parseFloat(l.prob)||0)*100).toFixed(0)+'%</span>'+
      (egL ? '<span class="leg-edge" style="color:'+(parseFloat(l.edge)>0?'var(--g)':'var(--e)')+'">Edge '+egL+'</span>' : '')+
      '</div>';
  }).join('');

  // Stats
  var statsHtml =
    '<div class="stats-row">'+
    statBox((a.verdict||'—'),   'VERDICT',     vCol)+
    statBox(((a.combinedFairProb||0)*100).toFixed(1)+'%', 'FAIR PROB', 'var(--c)')+
    statBox(im,                 'IMPLIED',     'var(--c)')+
    statBox(eg,                 'EDGE',        a.parlayEdge!=null&&a.parlayEdge>0?'var(--g)':'var(--e)')+
    statBox(a.approxOdds!=null?(a.approxOdds>0?'+':'')+a.approxOdds:'N/A', 'EST ODDS', 'var(--c)')+
    statBox(legs.length,        'LEGS',        'var(--c)')+
    '</div>';

  // Analysis panel (collapsed)
  var corrHtml = (a.correlations||[]).map(function(c){
    return '<div class="corr-item"><span style="color:'+c.color+'">'+c.icon+'</span> '+c.desc+'</div>';
  }).join('');
  var flagHtml = (a.flags||[]).map(function(f){
    return '<div class="flag-item">⚠️ '+f+'</div>';
  }).join('');
  var reasonHtml = (a.reasons||[]).map(function(r){
    return '<div class="reason-item">'+r+'</div>';
  }).join('');
  var hasAnalysis = corrHtml || flagHtml || reasonHtml;

  var analysisHtml = hasAnalysis ? (
    '<button class="analysis-toggle" onclick="toggleAnalysis(''+p.id+'',this)">▼ SHOW AI ANALYSIS</button>'+
    '<div class="analysis-body" id="ab-'+p.id+'">'+
      (corrHtml ? '<div class="analysis-section"><div class="asec-hdr" style="color:var(--sv)">CORRELATIONS</div>'+corrHtml+'</div>' : '')+
      (flagHtml ? '<div class="analysis-section"><div class="asec-hdr" style="color:var(--o)">RISK FLAGS</div>'+flagHtml+'</div>' : '')+
      (reasonHtml ? '<div class="analysis-section"><div class="asec-hdr" style="color:var(--mu)">LEG BREAKDOWN</div>'+reasonHtml+'</div>' : '')+
    '</div>'
  ) : '';

  // Grade section
  var gradeHtml = '';
  if(p.grade){
    var gMap = {win:'var(--g)',loss:'var(--e)',push:'var(--o)'};
    var gBg  = {win:'rgba(0,230,118,.15)',loss:'rgba(244,67,54,.15)',push:'rgba(255,152,0,.15)'};
    gradeHtml =
      '<span class="graded-pill" style="background:'+gBg[p.grade]+';color:'+(gMap[p.grade]||'var(--c)')+'">'+p.grade.toUpperCase()+' ✓</span>'+
      (p.gradedAt ? '<span class="grade-time">graded '+p.gradedAt.slice(0,16).replace('T',' ')+'</span>' : '');
  } else {
    gradeHtml =
      '<span class="grade-lbl">GRADE:</span>'+
      '<button class="grade-btn g-win"  onclick="gradeParlay(''+dateStr+'',''+p.id+'','win',this)">WIN</button>'+
      '<button class="grade-btn g-loss" onclick="gradeParlay(''+dateStr+'',''+p.id+'','loss',this)">LOSS</button>'+
      '<button class="grade-btn g-push" onclick="gradeParlay(''+dateStr+'',''+p.id+'','push',this)">PUSH</button>';
  }

  return '<div class="pcard" id="card-'+p.id+'">'+
    '<div class="pcard-inner">'+
      '<div class="pcard-hdr">'+
        '<div class="pcard-meta">'+
          '<span class="pcard-id">'+p.id+'</span>'+
          '<span class="pcard-time">'+p.createdAt.slice(0,16).replace('T',' ')+' EDT</span>'+
        '</div>'+
        '<div class="pcard-badges">'+
          '<span class="verdict-badge" style="background:'+vBg+';color:'+vCol+'">'+a.verdict+'</span>'+
          '<span class="legs-badge">'+legs.length+' LEGS</span>'+
        '</div>'+
      '</div>'+
      '<div class="legs-grid">'+legsHtml+'</div>'+
      statsHtml+
      analysisHtml+
      '<div class="grade-section">'+gradeHtml+'</div>'+
    '</div>'+
  '</div>';
}

function statBox(v,l,col){
  return '<div class="stat-b"><div class="stat-v" style="color:'+col+'">'+v+'</div><div class="stat-l">'+l+'</div></div>';
}

function toggleAnalysis(id, btn){
  var panel = document.getElementById('ab-'+id);
  if(!panel) return;
  panel.classList.toggle('open');
  btn.textContent = panel.classList.contains('open') ? '▲ HIDE AI ANALYSIS' : '▼ SHOW AI ANALYSIS';
}

function gradeParlay(dateStr, parlayId, grade, btn){
  btn.disabled = true;
  fetch('/api/parlay/'+dateStr+'/'+parlayId+'/grade',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({grade: grade})
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d.success){ showToast('Graded as '+grade.toUpperCase()+' ✓'); loadParlays(); }
    else { btn.disabled=false; alert('Grade failed: '+d.error); }
  }).catch(function(){ btn.disabled=false; });
}

loadParlays();
</script>
</body>
</html>
