    :root{--bg:#070d18;--card:#101a2a;--card2:#0b1322;--b:#223149;--t:#dfe9ff;--mu:#8ea4c8;--c:#00e5ff;--g:#00e676;--o:#ff9800;--r:#ff5252;--y:#f5c542}

    select,input[type=range]{font:inherit;background:var(--card);border:1px solid var(--b);color:var(--t);border-radius:8px;padding:6px 10px}
